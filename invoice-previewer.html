.theme[data-theme=dark] .paper,.paper{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#8A919E;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96;color-scheme:light;color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}

.gmenu,.gdclose{display:none}
.gdctx{display:none}
.gscrim{display:none}
.gutxt span{white-space:nowrap}
@media (max-width:1439px){
.gperiod,.gtl{display:none !important}
.card{overflow-x:auto !important}
}
@media (max-width:1279px){
.r-col{max-width:none !important}

.gsearch{flex:1 1 auto !important;min-width:120px !important}
.ghead{padding:10px 12px !important}
.gmain{padding:12px !important;gap:12px !important}
.r-col{flex:1 1 100% !important}
.card{overflow-x:auto !important}
.r-g5,.r-g6{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
.r-mh{min-height:0 !important}

.r-gdoc{grid-template-columns:minmax(0,1fr) !important}

@media (max-width:767px){

.gdctx{display:flex}
.gsearch .input{font-size:16px}
.r-g4,.r-g5,.r-g6{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.r-g3a,.r-gs,.r-g3:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g4:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g3a > *,.r-gs > *,.r-g3:has(input,select,textarea) > *,.r-g4:has(input,select,textarea) > *{grid-column:1/-1 !important}
section:has(> .r-paper){justify-content:flex-start !important;padding:12px !important;overflow-x:auto}
.r-paper{zoom:.505}
.r-g3a > :first-child{border-inline-end:0 !important;padding:12px 16px 0 !important}
.r-g3a br{display:none}
.r-g3a > a{border-inline-end:0 !important;border-top:1px solid var(--line2)}
.r-w{max-width:100% !important}
.card-head{flex-wrap:wrap;padding-block:8px}
.ghead h1{font-size:16px !important}
.ghead p{font-size:11.5px !important}
.gright{width:100%;gap:8px !important}
.gright .select,.gright .input{max-width:100%}
.r-wrap,.opt{flex-wrap:wrap !important;row-gap:8px !important}
.ifc .r-wrap,.tile .r-wrap,[role=tablist]{flex-wrap:nowrap !important}
[role=tablist]{overflow-x:auto;scrollbar-width:none;gap:20px !important}
[role=tablist]::-webkit-scrollbar{display:none}
.r-g4 > *,.r-g5 > *,.r-g6 > *{height:auto !important;min-height:68px;padding-block:10px !important}
.r-g4 > * > :last-child{font-size:19px !important;line-height:26px !important;word-break:break-word}
.gtoast{inset-inline:12px !important;bottom:12px !important;max-width:none !important}
.paper{max-width:none}
}
@media (max-width:420px){
.r-g2m:has(input,select,textarea),.r-g2:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g2m:has(input,select,textarea) > *,.r-g2:has(input,select,textarea) > *{grid-column:1/-1 !important}
}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:30px;border-radius:4px;font-size:13px;color:var(--ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--onaccent);font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin-inline-end:6px;vertical-align:middle;box-sizing:border-box}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif}
.inv th{position:static;height:auto;background:none;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line3)}

.inv tbody tr:hover td{background:none}</style>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { doc: 'inv', country: 'SG', dir: 'O', ctype: 'F', ent: '', marks: true, seq: {}, log: {} };
  }
  renderVals() {
    const s = this.state;
    const C = {
      SG: { name: 'Singapore', regime: 'Peppol / InvoiceNow', ccy: 'SGD', rate: 0.09, taxName: 'GST 9%', pod: 'SGSIN', loc: 'SIN', max: null, alt: null, dual: false },
      IN: { name: 'India', regime: 'GSTN e-Invoice (IRN)', ccy: 'INR', rate: 0.18, taxName: 'IGST 18%', pod: 'INNSA', loc: 'NSA', max: 16, alt: null, dual: true },
      SA: { name: 'Saudi Arabia', regime: 'ZATCA Phase 2', ccy: 'SAR', rate: 0.15, taxName: 'VAT 15%', pod: 'SAJED', loc: 'JED', max: null, alt: 'ar', dual: false },
      MY: { name: 'Malaysia', regime: 'MyInvois', ccy: 'MYR', rate: 0.08, taxName: 'SST 8%', pod: 'MYPKG', loc: 'PKG', max: null, alt: null, dual: false },
      MX: { name: 'Mexico', regime: 'CFDI', ccy: 'MXN', rate: 0.16, taxName: 'IVA 16%', pod: 'MXZLO', loc: 'ZLO', max: null, alt: 'es', dual: false }
    };
    const c = C[s.country];
    const titles = { inv: ['Tax Invoice', 'فاتورة ضريبية', 'Factura'], cn: ['Credit Note', 'إشعار دائن', 'Nota de crédito'], dn: ['Debit Note', 'إشعار مدين', 'Nota de débito'] };
    const docSuffix = { inv: '', cn: 'CR', dn: '' }[s.doc];
    const series = c.loc + s.dir + s.ctype + '26' + '|' + s.ent + docSuffix;
    const seqN = s.seq[series] || 1042;
    const run = (n) => String(n).padStart(5, '0');
    const fmtNo = (n) => c.loc + s.dir + s.ctype + '26' + run(n) + s.ent + docSuffix;
    const local = { SGD: 410, INR: 24500, SAR: 1100, MYR: 1300, MXN: 5200 }[c.ccy];
    const doc = { SGD: 45, INR: 2800, SAR: 120, MYR: 140, MXN: 560 }[c.ccy];
    const sign = s.doc === 'cn' ? -1 : 1;
    const f2 = (v) => (sign * v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const marks = s.marks;
    const lines = [
      { desc: 'Ocean Freight', sched: 'International — zero-rated', ccy: 'USD', amt: f2(1850), badge: 6, mark: marks },
      { desc: 'Bunker / Environmental Surcharge', sched: 'International — zero-rated', ccy: 'USD', amt: f2(320), badge: 7, mark: marks },
      { desc: 'Terminal Handling (THC)', sched: 'Domestic — ' + c.taxName, ccy: c.ccy, amt: f2(local), badge: 7, mark: marks },
      { desc: 'Documentation Fee', sched: 'Domestic — ' + c.taxName, ccy: c.ccy, amt: f2(doc), badge: 7, mark: marks }
    ];
    const tax = (local + doc) * c.rate;
    const totals = [
      { label: 'Subtotal USD', val: f2(2170), style: '' },
      { label: 'Subtotal ' + c.ccy, val: f2(local + doc), style: '' },
      { label: c.taxName + ' (' + c.ccy + ')', val: f2(tax), style: '' },
      { label: 'Total USD', val: f2(2170), style: 'font-weight:600;border-top:1px solid var(--line3);padding-top:6px' },
      { label: 'Total ' + c.ccy, val: f2(local + doc + tax), style: 'font-weight:600' }
    ];
    let seed = seqN * 7 + s.doc.length * 13 + s.country.charCodeAt(0);
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const finder = (r, col) => {
      const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && col >= c0 && col < c0 + 7;
      const boxes = [[0, 0], [0, 14], [14, 0]];
      for (const [r0, c0] of boxes) {
        if (inBox(r0, c0)) {
          const y = r - r0, x = col - c0;
          return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4)) ? 1 : 0;
        }
      }
      return -1;
    };
    const qr = [];
    for (let r = 0; r < 21; r++) for (let col = 0; col < 21; col++) {
      const f = finder(r, col);
      qr.push((f === 1 || (f === -1 && rnd() > 0.52)) ? 'var(--ink)' : 'var(--surface)');
    }
    const fieldNames = ['Legal Carrier Name', 'Tax IDs', 'B/L #', 'Voyage', 'POL / POD', 'Itemized Freight', 'Surcharges', 'Tax Breakdowns'];
    const recent = (s.log[series] || []).slice(-3).reverse().map((no) => ({ no }));
    return {
      docTypes: [['inv', 'Invoice'], ['cn', 'Credit Note'], ['dn', 'Debit Note']].map(([k, label]) => ({ label, on: s.doc === k ? 'true' : 'false', bg: s.doc === k ? 'var(--surface)' : 'transparent', fw: s.doc === k ? 600 : 500, shadow: s.doc === k ? '0 1px 2px rgba(22,26,33,.15)' : 'none', pick: () => this.setState({ doc: k }) })),
      countries: Object.keys(C).map((k) => ({ k, name: C[k].name, regime: C[k].regime })),
      country: s.country,
      pickCountry: (e) => this.setState({ country: e.target.value }),
      marks,
      toggleMarks: () => this.setState({ marks: !marks }),
      hl: marks ? '2px dashed var(--accent)' : 'none',
      fields: fieldNames.map((label, i) => ({ n: i + 1, label })),
      docTitle: titles[s.doc][0],
      bilingual: !!c.alt,
      docTitleAlt: c.alt === 'ar' ? titles[s.doc][1] : titles[s.doc][2],
      altClass: c.alt === 'ar' ? 'ar' : '',
      currentNo: fmtNo(seqN),
      nextNo: fmtNo(seqN + 1),
      isCredit: s.doc !== 'inv',
      refNo: c.loc + s.dir + s.ctype + '26' + run(seqN - 3) + s.ent,
      dualTax: c.dual,
      dir: s.dir, ctype: s.ctype, ent: s.ent,
      pickDir: (e) => this.setState({ dir: e.target.value }),
      pickCtype: (e) => this.setState({ ctype: e.target.value }),
      pickEnt: (e) => this.setState({ ent: e.target.value }),
      etLabel: s.dir === 'O' ? 'ETD (export)' : 'ETA (import)',
      partyLabel: s.dir === 'O' ? 'Shipper' : 'Consignee',
      parts: [
        { v: c.loc, k: 'Location' }, { v: s.dir, k: s.dir === 'O' ? 'Outbound' : 'Inbound' }, { v: s.ctype, k: s.ctype === 'F' ? 'Freight' : 'DET / DEM' },
        { v: '26', k: 'Year' }, { v: run(seqN), k: 'Running no.' },
        { v: s.ent || '—', k: s.ent === 'M' ? 'MELL' : (s.ent === 'S' ? 'MSC' : 'Entity') },
        { v: docSuffix || (s.doc === 'dn' ? '[TBC]' : '—'), k: s.doc === 'cn' ? 'Credit note' : (s.doc === 'dn' ? 'Debit note' : 'Doc type') }
      ].map((p) => ({ ...p, bg: (p.v === '—') ? 'var(--sub)' : 'var(--tint)', border: (p.v === '—') ? 'var(--line2)' : 'var(--tintbd)' })),
      lenText: fmtNo(seqN).length + (c.max ? ' / ' + c.max + ' chars' : ' chars'),
      lenChip: c.max && fmtNo(seqN).length > c.max ? 'background:var(--badbg);color:var(--bad)' : 'background:var(--okbg);color:var(--ok)',
      lenNote: c.max ? 'India GST: invoice number max 16 characters, unique per financial year.' : (s.doc === 'dn' ? 'Debit note identifier to be confirmed by PIL.' : 'Character capacity must be accepted by LMS, GIRS, GFS and third-party platforms.'),
      polpod: 'SGSIN → ' + (c.pod === 'SGSIN' ? 'INNSA' : c.pod),
      lines, totals, qr,
      regime: c.regime,
      qrRef: s.country === 'IN' ? 'IRN: [64-char hash]' : '[Clearance reference]',
      log: recent,
      issue: () => {
        const cur = fmtNo(seqN);
        const lg = { ...s.log, [series]: [...(s.log[series] || []), cur] };
        this.setState({ seq: { ...s.seq, [series]: seqN + 1 }, log: lg });
      }
    };
  }
}

const USER_NAME = 'Daniel Tan', USER_INITIALS = 'DT';
const LOGINS = [{ role: 'Billing Executive', agency: 'Singapore · SIN', code: 'SIN' }, { role: 'Team Lead', agency: 'Malaysia · PKG', code: 'PKG' }];
class Component extends GirsPage {
  constructor(p) {
    super(p);
    let sb = false, th = 'light', hub = 'SIN', ent = 'PIL';
    try { sb = localStorage.getItem('girs.sb') === '1'; th = localStorage.getItem('girs.th') || 'light'; hub = localStorage.getItem('girs.hub') || 'SIN'; ent = localStorage.getItem('girs.ent') || 'PIL'; } catch (e) {}
    let lg = 0; try { lg = +(localStorage.getItem('girs.lg') || 0); } catch (e) {}
    let narrow = false;
    try {
      const mq = window.matchMedia('(max-width: 1023px)');
      narrow = mq.matches;
      const on = (e) => this.setState({ __narrow: e.matches, __drawer: false });
      if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    } catch (e) {}
    this.state = Object.assign({}, this.state, { __sb: sb, __th: th, __hub: hub, __ent: ent, __q: '', __um: false, __lg: lg, __toast: '', __narrow: narrow, __drawer: false });
  }
  renderVals() {
    const v = super.renderVals();

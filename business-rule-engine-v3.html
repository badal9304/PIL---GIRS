.b3-drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px;border:1.5px dashed var(--bd);border-radius:8px;cursor:pointer;text-align:center;font-size:12.5px;color:var(--muted)}
.b3-drop:hover{border-color:var(--accent);background:var(--tint)}.b3-drop b{color:var(--ink);font-size:13px}
.b3-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn-primary[data-danger=true]{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.gtoast{bottom:84px !important}

.dd-q{position:sticky;top:-4px;z-index:1;margin:-4px -4px 4px;padding:8px;background:var(--surface);border-bottom:1px solid var(--line2);display:flex;align-items:center}
.dd-q svg{position:absolute;left:18px;color:var(--muted);pointer-events:none}
.dd-q .input{width:100%;height:32px !important;padding-left:30px;font-size:13px;background:var(--sub)}
.dd-q .input::-webkit-search-cancel-button{display:none}
.dd-e{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.dlg.dim.b3-dlg:not(.b5-wide){overflow:visible}.b3-dlg:not(.b5-wide) .db.b3-db{overflow:visible}

</path></svg></button></sc-for></div></sc-if></div></span></sc-if></div>

    if (c.lp) depth++; if (c.rp) depth--; if (depth < 0) bad = true; });

  return { errors, warns, rowErr, tabs, tabFirst: tabs.def ? 'def' : tabs.cond ? 'cond' : tabs.exc ? 'exc' : 'cond' };
}

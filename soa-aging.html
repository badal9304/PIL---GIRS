<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIRS Statement of Account and Aging</title>
<link rel="icon" href="pil-logo.png">
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#161A21;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:#0071B7}a:hover{color:#005C96}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:40px;padding-inline:12px;border-radius:6px;color:#3A4556;text-decoration:none;font-size:13px;font-weight:500}
.nav-item:hover{background:#F1F3F6;color:#161A21}
.nav-on,.nav-on:hover{background:#EAF4FB;color:#0071B7;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid #C5CAD3;background:#fff;color:#161A21;font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#F1F3F6}
.btn-sm{height:32px;padding:0 12px}
.btn-primary{background:#0071B7;border-color:#0071B7;color:#fff}
.btn-primary:hover{background:#005C96;border-color:#005C96}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:2px solid #0071B7;outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select:hover,.input:hover{border-color:#8C95A3}
.input{height:36px;padding:0 12px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:#fff;border:1px solid #DADDE3;border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid #DADDE3;box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:#5A6170}
.lbl{display:block;font-size:12px;font-weight:600;color:#5A6170;line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A6170;font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:#5A6170;padding:0 12px;border-bottom:1px solid #DADDE3;white-space:nowrap;background:#F7F8FA;box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid #ECEEF2;vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:#F7F9FC}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:#0071B7;cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:#0071B7;cursor:pointer}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:8px;height:104px;padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{background:#FBFCFD}
.lockbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;box-sizing:border-box}
.lockbtn:focus-visible{outline:2px solid #0071B7;outline-offset:2px}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <div aria-hidden="true" style="height: 3px; background: #E31D1A; flex: none"></div>
  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside style="flex: 1 0 240px; max-width: 240px; background: #fff; border-inline-end: 1px solid #DADDE3; display: flex; flex-direction: column; box-sizing: border-box">
      <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #ECEEF2; box-sizing: border-box">
        <img src="pil-logo.png" alt="PIL" style="height: 26px; width: auto; display: block">
        <span style="width: 1px; height: 20px; background: #DADDE3"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: #0071B7">GIRS</span>
      </div>
      <nav aria-label="Screens" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px">
        <a href="index.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.3 19a10 10 0 1 1 17.4 0"></path><path d="M12 14l4-4"></path></svg>
          <span>Operations Cockpit</span>
        </a>
        <a href="invoice-previewer.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
          <span>Invoice Previewer</span>
        </a>
        <a href="dar-console.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
          <span>DAR Console</span>
        </a>
        <a href="soa-aging.html" class="nav-item nav-on" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
          <span>SOA &amp; Aging</span>
        </a>
        <a href="cashapp-workbench.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>
          <span>CashApp Workbench</span>
        </a>
        <a href="tolerance-coreor.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
          <span>Tolerance &amp; COREOR</span>
        </a>
      </nav>
    </aside>

    <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
      <header style="min-height: 64px; background: #fff; border-bottom: 1px solid #DADDE3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 24px; box-sizing: border-box">
        <div style="min-width: 0">
          <h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Statement of Account &amp; Aging</h1>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5A6170">[Customer A] · Consolidated statement in USD alongside local billing currencies</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <label for="terms" style="font-size: 12px; font-weight: 600; color: #5A6170">Credit terms</label>
          <div style="position: relative">
            <select id="terms" class="select" value="{{terms}}" onChange="{{setTerms}}" style="width: 232px">
              <option value="15">15 days from vessel sailing</option>
              <option value="30">30 days from vessel sailing</option>
              <option value="45">45 days from vessel sailing</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 10px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn btn-primary" onClick="{{genLetter}}">Generate dunning letter</button>
        </div>
      </header>

      <main style="flex: 1 1 auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{buckets}}" as="b" hint-placeholder-count="4">
            <button class="tile" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="border: 1px solid {{b.border}}; box-shadow: {{b.shadow}}">
              <span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 600; color: {{b.fg}}">{{b.label}}</span><span class="mono" style="font-size: 12px; color: #5A6170">{{b.count}} inv.</span></span>
              <span class="mono" style="font-size: 22px; font-weight: 500; line-height: 28px">USD {{b.amt}}</span>
              <span style="height: 6px; border-radius: 3px; background: #EEF1F5; overflow: hidden; display: block"><span style="display: block; height: 6px; width: {{b.w}}; background: {{b.bar}}"></span></span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
          <div style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <section class="card" style="overflow: hidden">
              <div class="card-head">
                <h2 class="card-title">{{tableTitle}}</h2>
                <sc-if value="{{filtered}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" onClick="{{clearBucket}}">Show all buckets</button></sc-if>
              </div>
              <div style="max-height: 400px; overflow: auto">
                <table>
                  <thead><tr><th>Invoice #</th><th>Charge</th><th>Bucket</th><th class="r">Days overdue</th><th class="r">Billing amount</th><th class="r">USD eq.</th><th style="width: 170px">Dispute isolation</th></tr></thead>
                  <tbody>
                    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                      <tr style="{{r.rowStyle}}">
                        <td class="mono" style="font-weight: 500">{{r.no}}</td>
                        <td>{{r.charge}}</td>
                        <td><span class="chip" style="{{r.bStyle}}">{{r.bucket}}</span></td>
                        <td class="mono r">{{r.over}}</td>
                        <td class="mono r">{{r.ccy}} {{r.amtText}}</td>
                        <td class="mono r">{{r.usdText}}</td>
                        <td>
                          <button class="lockbtn" onClick="{{r.lock}}" aria-pressed="{{r.lockedAttr}}" style="border: 1px solid {{r.lockBorder}}; background: {{r.lockBg}}; color: {{r.lockFg}}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="{{r.shackle}}"></path></svg>
                            {{r.lockText}}
                          </button>
                        </td>
                      </tr>
                    </sc-for>
                  </tbody>
                </table>
              </div>
            </section>

            <sc-if value="{{letter}}" hint-placeholder-val="{{ false }}">
              <section class="card" aria-label="Dunning letter preview" style="overflow: hidden">
                <div class="card-head">
                  <h2 class="card-title">Dunning letter — preview</h2>
                  <div style="display: flex; gap: 8px; align-items: center">
                    <span class="chip" style="{{sendStyle}}">{{sendText}}</span>
                    <button class="btn btn-sm" onClick="{{closeLetter}}">Close</button>
                    <button class="btn btn-sm btn-primary" onClick="{{send}}" disabled="{{sent}}">Send reminder</button>
                  </div>
                </div>
                <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 760px">
                  <p style="margin: 0">To: [Customer A] · [Billing contact email]</p>
                  <p style="margin: 0">Our records show the following overdue amounts on your account. Disputed items under review are excluded from this reminder.</p>
                  <div style="max-width: 420px; display: flex; flex-direction: column">
                    <sc-for list="{{letterRows}}" as="l" hint-placeholder-count="3">
                      <div style="display: flex; justify-content: space-between; height: 28px; align-items: center"><span>{{l.label}}</span><span class="mono">USD {{l.amt}}</span></div>
                    </sc-for>
                    <div style="display: flex; justify-content: space-between; height: 32px; align-items: center; border-top: 1px solid #DADDE3; font-weight: 600"><span>Total overdue</span><span class="mono">USD {{letterTotal}}</span></div>
                  </div>
                  <p style="margin: 0; color: #5A6170; font-size: 12px">Excluded under dispute: {{lockedCount}} item(s) · USD {{lockedAmt}}</p>
                </div>
              </section>
            </sc-if>
          </div>

          <aside style="flex: 1 1 400px; max-width: 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <section class="card">
              <div class="card-head"><h2 class="card-title">Statement summary (USD)</h2></div>
              <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{summary}}" as="x" hint-placeholder-count="4">
                  <div style="display: flex; justify-content: space-between; gap: 12px; {{x.style}}"><span>{{x.label}}</span><span class="mono">{{x.val}}</span></div>
                </sc-for>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; border-top: 1px solid #ECEEF2; padding-top: 12px; margin-top: 4px">
                  <input type="checkbox" checked="{{prov}}" onChange="{{toggleProv}}">
                  <span>Apply provisional credit allocation for unapplied cash</span>
                </label>
              </div>
            </section>

            <section class="card">
              <div class="card-head"><h2 class="card-title">By billing currency</h2></div>
              <div style="padding: 4px 16px 8px; display: flex; flex-direction: column">
                <sc-for list="{{byCcy}}" as="c" hint-placeholder-count="4">
                  <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; border-bottom: 1px solid #ECEEF2"><span class="mono" style="font-weight: 500">{{c.ccy}}</span><span class="mono">{{c.amt}}</span></div>
                </sc-for>
              </div>
            </section>
          </aside>
        </div>
      </main>
    </div>
  </div>

</div>
</script>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { terms: 30, bucket: null, locked: { i4: true }, prov: false, letter: false, sent: false };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const inv = [
      { id: 'i1', no: 'SG-INV-2026-002281', charge: 'Ocean Freight', ccy: 'USD', amt: 62400, usd: 62400, sail: 15 },
      { id: 'i2', no: 'SG-INV-2026-002290', charge: 'Terminal Handling (THC)', ccy: 'SGD', amt: 18500, usd: 13700, sail: 25 },
      { id: 'i3', no: 'SG-INV-2026-002144', charge: 'Ocean Freight', ccy: 'USD', amt: 48200, usd: 48200, sail: 50 },
      { id: 'i4', no: 'SG-INV-2026-002150', charge: 'Demurrage', ccy: 'USD', amt: 50, usd: 50, sail: 55 },
      { id: 'i5', no: 'IN-INV-2026-001012', charge: 'Ocean Freight', ccy: 'INR', amt: 2450000, usd: 29300, sail: 80 },
      { id: 'i6', no: 'SG-INV-2026-002033', charge: 'Bunker / Environmental Surcharge', ccy: 'USD', amt: 41000, usd: 41000, sail: 85 },
      { id: 'i7', no: 'SG-INV-2026-001870', charge: 'Ocean Freight', ccy: 'USD', amt: 34350, usd: 34350, sail: 150 },
      { id: 'i8', no: 'MY-INV-2026-000702', charge: 'Detention', ccy: 'MYR', amt: 98000, usd: 21000, sail: 170 }
    ];
    const bk = (over) => over <= 0 ? 'cur' : (over <= 30 ? 'b30' : (over <= 60 ? 'b60' : 'b90'));
    const meta = {
      cur: { label: 'Current', fg: '#1F6B45', bar: '#2E8B57', chip: 'background:#E6F3EC;color:#1F6B45' },
      b30: { label: '30 days', fg: '#005C96', bar: '#0071B7', chip: 'background:#EAF4FB;color:#005C96' },
      b60: { label: '60 days', fg: '#8A4200', bar: '#C86B10', chip: 'background:#FDF0E3;color:#8A4200' },
      b90: { label: '90+ days', fg: '#A3262A', bar: '#B3363A', chip: 'background:#FBEAEA;color:#A3262A' }
    };
    const enriched = inv.map((i) => { const over = i.sail - s.terms; return { ...i, over, b: bk(over), locked: !!s.locked[i.id] }; });
    const total = enriched.reduce((a, i) => a + i.usd, 0);
    const keys = ['cur', 'b30', 'b60', 'b90'];
    const maxB = Math.max(...keys.map((k) => enriched.filter((i) => i.b === k).reduce((a, i) => a + i.usd, 0)), 1);
    const buckets = keys.map((k) => {
      const list = enriched.filter((i) => i.b === k);
      const amt = list.reduce((a, i) => a + i.usd, 0);
      const on = s.bucket === k;
      return { label: meta[k].label, fg: meta[k].fg, bar: meta[k].bar, count: list.length, amt: m(amt),
        w: Math.round((amt / maxB) * 100) + '%', on: on ? 'true' : 'false',
        border: on ? '#0071B7' : '#DADDE3', shadow: on ? '0 0 0 1px #0071B7' : 'none',
        pick: () => this.setState({ bucket: on ? null : k }) };
    });
    const visible = enriched.filter((i) => !s.bucket || i.b === s.bucket);
    const rows = visible.map((i) => ({
      no: i.no, charge: i.charge, bucket: meta[i.b].label, bStyle: meta[i.b].chip,
      over: i.over <= 0 ? '—' : String(i.over), ccy: i.ccy, amtText: m(i.amt), usdText: m(i.usd),
      rowStyle: i.locked ? 'color:#5A6170' : '',
      lockedAttr: i.locked ? 'true' : 'false',
      lockText: i.locked ? 'Locked — disputed' : 'Isolate',
      lockBg: i.locked ? '#FBEAEA' : '#fff', lockFg: i.locked ? '#A3262A' : '#161A21', lockBorder: i.locked ? '#E9B7B9' : '#C5CAD3',
      shackle: i.locked ? 'M8 11V7a4 4 0 0 1 8 0v4' : 'M8 11V7a4 4 0 0 1 7.9-1',
      lock: () => this.setState({ locked: { ...s.locked, [i.id]: !i.locked }, sent: false })
    }));
    const lockedList = enriched.filter((i) => i.locked);
    const lockedAmt = lockedList.reduce((a, i) => a + i.usd, 0);
    const unapplied = 12000;
    const due = total - lockedAmt - (s.prov ? unapplied : 0);
    const summary = [
      { label: 'Statement total', val: m(total), style: '' },
      { label: 'Disputed — isolated', val: '− ' + m(lockedAmt), style: 'color:#A3262A' },
      { label: 'Unapplied cash receipts', val: (s.prov ? '− ' : '') + m(unapplied), style: s.prov ? 'color:#0071B7' : 'color:#5A6170' },
      { label: 'Amount due', val: m(due), style: 'font-weight:600;border-top:1px solid #DADDE3;padding-top:8px;font-size:15px;line-height:24px' }
    ];
    const ccys = {};
    enriched.forEach((i) => { ccys[i.ccy] = (ccys[i.ccy] || 0) + i.amt; });
    const overdue = enriched.filter((i) => i.b !== 'cur' && !i.locked);
    const letterRows = ['b30', 'b60', 'b90'].map((k) => ({ label: meta[k].label, amt: m(overdue.filter((i) => i.b === k).reduce((a, i) => a + i.usd, 0)) }));
    return {
      terms: String(s.terms),
      setTerms: (e) => this.setState({ terms: Number(e.target.value), sent: false }),
      buckets, rows,
      filtered: !!s.bucket,
      clearBucket: () => this.setState({ bucket: null }),
      tableTitle: s.bucket ? meta[s.bucket].label + ' — invoices' : 'Open invoices',
      summary, prov: s.prov,
      toggleProv: () => this.setState({ prov: !s.prov }),
      byCcy: Object.keys(ccys).map((c) => ({ ccy: c, amt: m(ccys[c]) })),
      letter: s.letter,
      genLetter: () => this.setState({ letter: true, sent: false }),
      closeLetter: () => this.setState({ letter: false }),
      letterRows,
      letterTotal: m(overdue.reduce((a, i) => a + i.usd, 0)),
      lockedCount: lockedList.length, lockedAmt: m(lockedAmt),
      sent: s.sent,
      send: () => this.setState({ sent: true }),
      sendText: s.sent ? 'Queued for email' : 'Draft',
      sendStyle: s.sent ? 'background:#E6F3EC;color:#1F6B45' : 'background:#EEF1F5;color:#5A6170'
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>

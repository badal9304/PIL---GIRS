<style>
:root,.theme{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#8A919E;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96}
.theme[data-theme=dark]{--ink:#E6E9EE;--muted:#9AA3B2;--muted2:#C3CAD5;--muted3:#C3CAD5;--muted4:#6B7485;--line:#2C333E;--line2:#232A34;--bd:#3A4350;--bdh:#5D6878;--line3:#3A4350;--bg:#0E1116;--sub:#1B212A;--hover:#222934;--hover2:#1A2029;--hover3:#1A2029;--neutral:#262D38;--canvas:#0B0E13;--accent:#2A86CC;--accent2:#7DBDEE;--tint:#13263A;--tintbd:#1F4566;--tint2:#14222F;--ok:#5FC896;--okbg:#12291E;--ok2:#7AD3A6;--okdot:#3FB97A;--okbar:#3FB97A;--okbd:#1F4A33;--okrow:#132219;--warn:#F0A35C;--warnbg:#2E1F10;--warn2:#F5B37A;--warnbar:#E08A2E;--warnbd:#5A3A17;--bad:#F08A8C;--badbg:#321718;--badbar:#E0575B;--bad2:#F5A3A5;--badbd:#5C2A2C;--badrow:#24181A;--aibg:#241C38;--ai:#B9A4F2;--surface:#161B22;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#1F6FAE;color-scheme:dark}
.theme[data-theme=dark] .paper,.paper{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#8A919E;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96;color-scheme:light;color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:8px;height:68px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile:hover{background:var(--hover3)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;height:48px;padding:0 2px;display:inline-flex;align-items:center;font-weight:500;white-space:nowrap}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>
</helmet>

                    <span style="display: flex; flex-direction: column"><span style="font-weight: 500">{{x.event}}</span><span style="font-size: 12px; line-height: 16px; color: var(--muted)">{{x.by}}</span></span>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { f: {}, stage: null, selected: 'd1', tab: 'trace', notice: '' };
  }
  renderVals() {
    const s = this.state, f = s.f;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const D = [
      { id: 'd1', no: 'SINOF2602401', doc: 'Invoice', ship: '[Booking 1001]', bl: 'BL-SG-24001', ves: 'Vessel 01 / 012E', cus: '[Customer A]', pol: 'SGSIN', pod: 'INNSA', date: '2026-11-02', amt: 2475, stage: 'paid', receipt: 'issued', dar: '—', fail: null },
      { id: 'd2', no: 'SINOF2602405', doc: 'Invoice', ship: '[Booking 1006]', bl: 'BL-SG-24006', ves: 'Vessel 01 / 012E', cus: '[Customer B]', pol: 'SGSIN', pod: 'SAJED', date: '2026-11-02', amt: 3900, stage: 'paid', receipt: 'not', dar: '—', fail: null },
      { id: 'd3', no: 'NSAOF2601044', doc: 'Invoice', ship: '[Booking 1005]', bl: 'BL-IN-24005', ves: 'Vessel 04 / 021S', cus: '[Customer C]', pol: 'INNSA', pod: 'SGSIN', date: '2026-11-03', amt: 1200, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'portal' },
      { id: 'd4', no: 'SINOD2600311CR', doc: 'Credit Note', ship: '[Booking 1004]', bl: 'BL-SG-24004', ves: 'Vessel 03 / 108N', cus: '[Customer D]', pol: 'SGSIN', pod: 'MYPKG', date: '2026-11-03', amt: -4200, stage: 'invoiced', receipt: 'not', dar: '[DAR no.]', fail: null },
      { id: 'd5', no: 'LCHOF2600318', doc: 'Invoice', ship: '[Booking 1007]', bl: 'BL-TH-24007', ves: 'Vessel 05 / 077E', cus: '[Customer E]', pol: 'THLCH', pod: 'SGSIN', date: '2026-11-04', amt: 5600, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'gfs' },
      { id: 'd6', no: '[Receipt no.]', doc: 'Receipt', ship: '[Booking 1001]', bl: 'BL-SG-24001', ves: 'Vessel 01 / 012E', cus: '[Customer A]', pol: 'SGSIN', pod: 'INNSA', date: '2026-11-04', amt: 2475, stage: 'paid', receipt: 'issued', dar: '—', fail: null },
      { id: 'd7', no: '—', doc: 'Invoice', ship: '[Booking 1003]', bl: 'BL-CN-24003', ves: 'Vessel 02 / 044W', cus: '[Customer F]', pol: 'CNSHA', pod: 'SGSIN', date: '2026-11-04', amt: 320, stage: 'yet', receipt: 'not', dar: '—', fail: null },
      { id: 'd8', no: 'SINOF2602298', doc: 'Invoice', ship: '[Booking 1009]', bl: 'BL-SG-24009', ves: 'Vessel 03 / 108N', cus: '[Customer G]', pol: 'SGSIN', pod: 'MYPKG', date: '2026-11-05', amt: 6120, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'email' }
    ];
    const STAGE = { invoiced: 'Invoiced', yet: 'Yet to be invoiced', paid: 'Paid', unpaid: 'Unpaid' };
    const CHIP = { invoiced: 'background:var(--tint);color:var(--accent2)', yet: 'background:var(--neutral);color:var(--muted)', paid: 'background:var(--okbg);color:var(--ok)', unpaid: 'background:var(--warnbg);color:var(--warn)' };
    const has = (v, q) => !q || String(v).toLowerCase().includes(String(q).toLowerCase());
    const inStage = (d, k) => k === 'issued' ? d.receipt === 'issued' : (k === 'notissued' ? d.receipt === 'not' : (k === 'invoiced' ? d.stage !== 'yet' : d.stage === k));
    const match = (d) => has(d.ship, f.ship) && (!f.doc || d.doc === f.doc) && has(d.bl, f.bl) && has(d.ves, f.ves) && has(d.cus, f.cus) && has(d.no, f.no)
      && (!f.idate || d.date === f.idate) && (!f.from || d.date >= f.from) && (!f.to || d.date <= f.to) && has(d.pol, f.pol) && has(d.pod, f.pod);
    const base = D.filter(match);
    const vis = base.filter((d) => !s.stage || inStage(d, s.stage));
    const fmtD = (iso) => iso.slice(8) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(iso.slice(5, 7)) - 1] + ' ' + iso.slice(0, 4);
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const rows = vis.map((d) => {
      const on = s.selected === d.id;
      return { ...d, dateText: fmtD(d.date), amtText: (d.amt < 0 ? '− ' : '') + m(Math.abs(d.amt)), stageText: STAGE[d.stage], chip: CHIP[d.stage],
        cell: on ? 'background:var(--tint);' : '', edge: on ? selEdge : '', select: () => this.setState({ selected: d.id }) };
    });
    const stageDefs = [['invoiced', 'Invoiced'], ['yet', 'Yet to be invoiced'], ['paid', 'Paid'], ['unpaid', 'Unpaid'], ['issued', 'Receipt issued'], ['notissued', 'Receipt not issued']];
    const stages = stageDefs.map(([k, label]) => {
      const on = s.stage === k;
      return { label, value: base.filter((d) => inStage(d, k)).length, on: on ? 'true' : 'false', border: on ? 'var(--accent)' : 'var(--line)', shadow: on ? '0 0 0 1px var(--accent)' : 'none',
        pick: () => this.setState({ stage: on ? null : k }) };
    });
    const sd = D.find((d) => d.id === s.selected) || D[0];
    const ok = ['Completed', 'background:var(--okbg);color:var(--ok)'], pend = ['Pending', 'background:var(--neutral);color:var(--muted)'], bad = ['Failed', 'background:var(--badbg);color:var(--bad)'];
    const inv = sd.stage !== 'yet';
    const steps = [
      ['LMS charge', ok],
      ['Invoice', inv ? ok : pend],
      ['Tax validation', !inv ? pend : (sd.fail === 'portal' ? bad : ok)],
      ['Distribution', !inv ? pend : (sd.fail === 'email' ? bad : ok)],
      ['Payment', sd.stage === 'paid' ? ok : pend],
      ['Receipt', sd.receipt === 'issued' ? ok : pend]
    ];
    const trace = steps.map(([label, st]) => ({ label, state: st[0], chip: st[1], dot: st === ok ? 'var(--okdot)' : (st === bad ? 'var(--badbar)' : 'var(--bd)'), fg: st === pend ? 'var(--muted)' : 'var(--ink)' }));
    const failDefs = {
      portal: [['Government tax portal', 'Rejected', 'Schema validation failed: [error description from portal]']],
      gfs: [['GFS', 'Rejected', 'Journal posting rejected: [error description from GFS]']],
      email: [['Customer email', 'Bounced', 'Invoice email bounced: [delivery error description]']]
    };
    const fl = sd.fail ? failDefs[sd.fail] : [];
    const fails = fl.length ? fl.map(([sys, state, desc]) => ({ sys, state, desc, chip: bad[1], border: 'var(--badbd)', bg: 'var(--badrow)' }))
      : [{ sys: 'GIRS · GFS · Government portal · Third-party', state: 'No failures', desc: 'All validation checks passed for this record.', chip: ok[1], border: 'var(--line)', bg: 'var(--surface)' }];
    const audit = [
      { event: sd.doc + ' created', by: 'System · batch run', at: fmtD(sd.date) + ' 09:12' },
      { event: 'Tax computation', by: 'System', at: fmtD(sd.date) + ' 09:12' },
      { event: 'Email sent to customer', by: '[No-reply mailbox]', at: fmtD(sd.date) + ' 09:15' },
      { event: sd.fail === 'email' ? 'Email bounced' : 'Email delivered', by: 'Email delivery status', at: fmtD(sd.date) + ' 09:16' },
      { event: 'Status changed · ' + STAGE[sd.stage], by: '[User ID]', at: fmtD(sd.date) + ' 14:30' }
    ];
    const setF = (k) => (e) => this.setState({ f: { ...f, [k]: e.target.value } });
    const tabDefs = [['trace', 'Transaction trace'], ['fail', 'Failed transactions'], ['audit', 'Audit trail'], ['ai', 'AI activity']];
    const aiLog = [
      { event: 'Remittance data extracted from email attachment', by: 'AI · [Model] · prompt and response retained', at: fmtD(sd.date) + ' 10:02' },
      { event: 'Allocation suggested for ' + sd.no, by: 'AI · [Model] · awaiting human confirmation', at: fmtD(sd.date) + ' 10:03' },
      { event: 'Suggestion confirmed', by: '[User ID] · human approval before posting', at: fmtD(sd.date) + ' 10:11' }
    ];
    return {
      f: { ship: f.ship || '', doc: f.doc || '', bl: f.bl || '', ves: f.ves || '', cus: f.cus || '', no: f.no || '', idate: f.idate || '', from: f.from || '', to: f.to || '', pol: f.pol || '', pod: f.pod || '' },
      set: { ship: setF('ship'), doc: setF('doc'), bl: setF('bl'), ves: setF('ves'), cus: setF('cus'), no: setF('no'), idate: setF('idate'), from: setF('from'), to: setF('to'), pol: setF('pol'), pod: setF('pod') },
      clear: () => this.setState({ f: {}, stage: null }),
      stages, rows, rowCount: rows.length, empty: rows.length === 0,
      tabs: tabDefs.map(([k, label]) => ({ label, on: s.tab === k ? 'true' : 'false', fg: s.tab === k ? 'var(--accent)' : 'var(--muted)', line: s.tab === k ? 'var(--accent)' : 'transparent', pick: () => this.setState({ tab: k }) })),
      tabTrace: s.tab === 'trace', tabFail: s.tab === 'fail', tabAudit: s.tab === 'audit', tabAi: s.tab === 'ai', aiLog,
      sel: { no: sd.no === '—' ? sd.bl : sd.no, corr: 'CID-' + sd.bl.replace(/[^0-9]/g, '') + '-' + sd.id.toUpperCase() },
      trace, fails, audit,
      pendingText: '2 pending approvals · approvers notified by email',
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' }),
      exXls: () => this.setState({ notice: rows.length + ' records exported to Excel.' }),
      exCsv: () => this.setState({ notice: rows.length + ' records exported to CSV.' }),
      exPdf: () => this.setState({ notice: rows.length + ' records exported to PDF.' })
    };
  }
}

    const c = s.__sb;
    return Object.assign({}, v, { shell: {
      theme: s.__th, dark: s.__th === 'dark',
      sbW: c ? '64px' : '240px', hide: c ? 'display:none' : '', item: c ? 'justify-content:center;padding-inline:0' : '',

      toggleSb: () => { save('girs.sb', c ? '0' : '1'); this.setState({ __sb: !c }); },
      lightOn: s.__th === 'dark' ? 'false' : 'true', darkOn: s.__th === 'dark' ? 'true' : 'false',
      lightBg: s.__th === 'dark' ? 'transparent;color:var(--muted)' : 'var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)', darkBg: s.__th === 'dark' ? 'var(--tint);color:var(--accent2)' : 'transparent;color:var(--muted)',
      setLight: () => { save('girs.th', 'light'); this.setState({ __th: 'light' }); },
      setDark: () => { save('girs.th', 'dark'); this.setState({ __th: 'dark' }); },
      hub: s.__hub, setHub: (e) => { save('girs.hub', e.target.value); this.setState({ __hub: e.target.value }); },
      ent: s.__ent, setEnt: (e) => { save('girs.ent', e.target.value); this.setState({ __ent: e.target.value }); },
      q: s.__q, setQ: (e) => this.setState({ __q: e.target.value }), hasQ: !!s.__q, clearQ: () => this.setState({ __q: '' }),
      pending: 10, l: L,

      logins: [0, 1].map((i) => ({ label: '[Login ' + (i + 1) + ']', role: '[Role ' + (i + 1) + ']', on: s.__lg === i ? 'true' : 'false', mark: s.__lg === i ? '✓' : '',
        pick: () => { save('girs.lg', String(i)); this.setState({ __lg: i, __um: false, __toast: 'Switched to [Login ' + (i + 1) + '] · [Role ' + (i + 1) + ']. Screens and actions follow that role.' }); } })),
      curLogin: '[Login ' + (s.__lg + 1) + ']', curRole: '[Role ' + (s.__lg + 1) + ']',
      exp: (e) => { const v = e.target.value; if (!v) return; e.target.value = ''; this.setState({ __toast: 'Export to ' + ({ xlsx: 'Excel', csv: 'CSV', pdf: 'PDF' })[v] + ' prepared — current filters applied.' }); },

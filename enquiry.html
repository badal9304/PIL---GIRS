<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIRS Enquiry and Monitoring</title>
<link rel="icon" href="pil-logo.png">
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#161A21;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:#0071B7}a:hover{color:#005C96}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:#3A4556;text-decoration:none;font-size:13px;font-weight:500}
.nav-item:hover{background:#F1F3F6;color:#161A21}
.nav-on,.nav-on:hover{background:#EAF4FB;color:#0071B7;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid #C5CAD3;background:#fff;color:#161A21;font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#F1F3F6}
.btn-sm{height:32px;padding:0 12px}
.btn-primary{background:#0071B7;border-color:#0071B7;color:#fff}
.btn-primary:hover{background:#005C96;border-color:#005C96}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:2px solid #0071B7;outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select:hover,.input:hover{border-color:#8C95A3}
.input{height:36px;padding:0 12px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:#fff;border:1px solid #DADDE3;border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid #DADDE3;box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:#5A6170}
.lbl{display:block;font-size:12px;font-weight:600;color:#5A6170;line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A6170;font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:#5A6170;padding:0 12px;border-bottom:1px solid #DADDE3;white-space:nowrap;background:#F7F8FA;box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid #ECEEF2;vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:#F7F9FC}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:#0071B7;cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:#0071B7;cursor:pointer}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:8px;height:68px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile:hover{background:#FBFCFD}
.tab{all:unset;box-sizing:border-box;cursor:pointer;height:48px;padding:0 2px;display:inline-flex;align-items:center;font-weight:500;white-space:nowrap}
.tab:focus-visible{outline:2px solid #0071B7;outline-offset:-2px}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid #0071B7;outline-offset:2px}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <div aria-hidden="true" style="height: 3px; background: #E31D1A; flex: none"></div>
  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside style="flex: 1 0 240px; max-width: 240px; background: #fff; border-inline-end: 1px solid #DADDE3; display: flex; flex-direction: column; box-sizing: border-box">
      <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #ECEEF2; box-sizing: border-box">
        <img src="pil-logo.png" alt="PIL" style="height: 26px; width: auto; display: block">
        <span style="width: 1px; height: 20px; background: #DADDE3"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: #0071B7">GIRS</span>
      </div>
      <nav aria-label="Screens" style="display: flex; flex-direction: column; gap: 20px; padding: 16px 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Operations</div>
          <a href="index.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.3 19a10 10 0 1 1 17.4 0"></path><path d="M12 14l4-4"></path></svg>
            <span>Operations Cockpit</span>
          </a>
          <a href="charge-processing.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path><circle cx="19" cy="18" r="2"></circle></svg>
            <span>Charge Processing</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Invoicing</div>
          <a href="invoice-previewer.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
            <span>Invoice Previewer</span>
          </a>
          <a href="credit-notes.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15h6"></path></svg>
            <span>Credit Notes</span>
          </a>
          <a href="dar-console.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
            <span>DAR Console</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Receivables</div>
          <a href="receipting.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h7"></path><path d="M15 17l2 2 4-4"></path></svg>
            <span>Receipting</span>
          </a>
          <a href="cashapp-workbench.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>
            <span>CashApp Workbench</span>
          </a>
          <a href="tolerance-coreor.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
            <span>Tolerance &amp; COREOR</span>
          </a>
          <a href="soa-aging.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
            <span>SOA &amp; Aging</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Enquiry</div>
          <a href="enquiry.html" class="nav-item nav-on" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <span>Enquiry &amp; Monitoring</span>
          </a>
        </div>
      </nav>
    </aside>

    <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
      <header style="min-height: 64px; background: #fff; border-bottom: 1px solid #DADDE3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 24px; box-sizing: border-box">
        <div style="min-width: 0">
          <h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Enquiry &amp; Monitoring</h1>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5A6170">Read-only search across invoices, credit notes and receipts · end-to-end transaction trace · audit trail</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span class="chip" style="background: #FDF0E3; color: #8A4200; height: 28px">{{pendingText}}</span>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: #DADDE3"></span>
          <span style="font-size: 12px; font-weight: 600; color: #5A6170">Export</span>
          <div role="group" aria-label="Export results" style="display: flex; gap: 4px">
            <button class="btn btn-sm" onClick="{{exXls}}">Excel</button>
            <button class="btn btn-sm" onClick="{{exCsv}}">CSV</button>
            <button class="btn btn-sm" onClick="{{exPdf}}">PDF</button>
          </div>
          <span class="chip" style="background: #EEF1F5; color: #3A4556; height: 28px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            Read-only
          </span>
        </div>
      </header>

      <main style="flex: 1 1 auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 8px 0 16px; border-radius: 8px; background: #EAF4FB; border: 1px solid #B9D9EE; color: #005C96; box-sizing: border-box">{{notice}}<button class="btn btn-sm" onClick="{{closeNotice}}">Close</button></div>
        </sc-if>
        <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
            <div><label class="lbl" for="f-ship">Shipment</label><input id="f-ship" class="input" value="{{f.ship}}" onInput="{{set.ship}}" placeholder="Booking / shipment" style="width: 100%"></div>
            <div><label class="lbl" for="f-doc">Document type</label>
              <div style="position: relative"><select id="f-doc" class="select" value="{{f.doc}}" onChange="{{set.doc}}" style="width: 100%"><option value="">All</option><option value="Invoice">Invoice</option><option value="Credit Note">Credit Note</option><option value="Receipt">Receipt</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 10px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></div></div>
            <div><label class="lbl" for="f-bl">BL / HBL</label><input id="f-bl" class="input mono" value="{{f.bl}}" onInput="{{set.bl}}" placeholder="BL-…" style="width: 100%"></div>
            <div><label class="lbl" for="f-ves">Vessel</label><input id="f-ves" class="input" value="{{f.ves}}" onInput="{{set.ves}}" placeholder="Vessel / voyage" style="width: 100%"></div>
            <div><label class="lbl" for="f-cus">Customer</label><input id="f-cus" class="input" value="{{f.cus}}" onInput="{{set.cus}}" placeholder="Customer" style="width: 100%"></div>
            <div><label class="lbl" for="f-no">Invoice number</label><input id="f-no" class="input mono" value="{{f.no}}" onInput="{{set.no}}" placeholder="Document no." style="width: 100%"></div>
            <div><label class="lbl" for="f-idate">Invoice date</label><input id="f-idate" class="input mono" type="date" value="{{f.idate}}" onChange="{{set.idate}}" style="width: 100%"></div>
            <div><label class="lbl" for="f-from">Date range — from</label><input id="f-from" class="input mono" type="date" value="{{f.from}}" onChange="{{set.from}}" style="width: 100%"></div>
            <div><label class="lbl" for="f-to">Date range — to</label><input id="f-to" class="input mono" type="date" value="{{f.to}}" onChange="{{set.to}}" style="width: 100%"></div>
            <div><label class="lbl" for="f-pol">POL</label><input id="f-pol" class="input mono" value="{{f.pol}}" onInput="{{set.pol}}" placeholder="e.g. SGSIN" style="width: 100%"></div>
            <div><label class="lbl" for="f-pod">POD</label><input id="f-pod" class="input mono" value="{{f.pod}}" onInput="{{set.pod}}" placeholder="e.g. INNSA" style="width: 100%"></div>
            <div style="display: flex; align-items: flex-end"><button class="btn" onClick="{{clear}}" style="width: 100%">Clear filters</button></div>
          </div>
        </section>

        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{stages}}" as="k" hint-placeholder-count="6">
            <button class="tile" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="border: 1px solid {{k.border}}; box-shadow: {{k.shadow}}">
              <span style="font-size: 12px; font-weight: 500; color: #5A6170">{{k.label}}</span>
              <span class="mono" style="font-size: 20px; font-weight: 500; line-height: 28px">{{k.value}}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
          <section class="card" style="flex: 999 1 720px; min-width: 0; overflow: hidden">
            <div class="card-head"><h2 class="card-title">Results</h2><span class="card-meta">{{rowCount}} records</span></div>
            <div style="max-height: 400px; overflow: auto">
              <table>
                <thead><tr><th>Document #</th><th>Type</th><th>BL / HBL</th><th>Customer</th><th>POL → POD</th><th>Date</th><th class="r">Amount USD</th><th>Lifecycle</th><th>DAR / TPB</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: #0071B7">{{r.no}}</button></td>
                      <td style="{{r.cell}}">{{r.doc}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.bl}}</td>
                      <td style="{{r.cell}}">{{r.cus}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.pol}} → {{r.pod}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.dateText}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.amtText}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.chip}}">{{r.stageText}}</span></td>
                      <td class="mono" style="color: #5A6170; {{r.cell}}">{{r.dar}}</td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 32px 16px; text-align: center; color: #5A6170">No records match these filters.</p></sc-if>
            </div>
          </section>

          <section class="card" style="flex: 1 1 440px; max-width: 480px; min-width: 0; overflow: hidden">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #DADDE3">
              <div role="tablist" aria-label="Record detail" style="display: flex; gap: 16px">
                <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
                  <button class="tab" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="color: {{t.fg}}; box-shadow: inset 0 -2px 0 {{t.line}}">{{t.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="padding: 12px 16px 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <div><div class="k">Document</div><div class="mono" style="margin-top: 2px">{{sel.no}}</div></div>
              <div><div class="k">Correlation ID</div><div class="mono" style="margin-top: 2px">{{sel.corr}}</div></div>
            </div>
            <sc-if value="{{tabTrace}}" hint-placeholder-val="{{ true }}">
              <ol style="list-style: none; margin: 0; padding: 4px 16px 16px; display: flex; flex-direction: column">
                <sc-for list="{{trace}}" as="x" hint-placeholder-count="6">
                  <li style="display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #ECEEF2">
                    <span style="width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: {{x.dot}}; flex: none"></span>
                    <span style="flex: 1; display: flex; justify-content: space-between; gap: 12px"><span style="font-weight: 500; color: {{x.fg}}">{{x.label}}</span><span class="chip" style="{{x.chip}}">{{x.state}}</span></span>
                  </li>
                </sc-for>
              </ol>
            </sc-if>
            <sc-if value="{{tabFail}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{fails}}" as="x" hint-placeholder-count="2">
                  <div style="padding: 12px 16px; border-radius: 6px; border: 1px solid {{x.border}}; background: {{x.bg}}">
                    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-weight: 600">{{x.sys}}</span><span class="chip" style="{{x.chip}}">{{x.state}}</span></div>
                    <div style="margin-top: 4px; font-size: 12px; line-height: 16px; color: #3A4556">{{x.desc}}</div>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{tabAudit}}" hint-placeholder-val="{{ false }}">
              <ul style="list-style: none; margin: 0; padding: 4px 16px 16px">
                <sc-for list="{{audit}}" as="x" hint-placeholder-count="5">
                  <li style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #ECEEF2">
                    <span style="display: flex; flex-direction: column"><span style="font-weight: 500">{{x.event}}</span><span style="font-size: 12px; line-height: 16px; color: #5A6170">{{x.by}}</span></span>
                    <span class="mono" style="font-size: 12px; color: #5A6170; white-space: nowrap">{{x.at}}</span>
                  </li>
                </sc-for>
              </ul>
            </sc-if>
          </section>
        </div>
      </main>
    </div>
  </div>

</div>
</script>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { f: {}, stage: null, selected: 'd1', tab: 'trace', notice: '' };
  }
  renderVals() {
    const s = this.state, f = s.f;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const D = [
      { id: 'd1', no: 'SINOF2602401', doc: 'Invoice', ship: '[Booking 1001]', bl: 'BL-SG-24001', ves: 'Vessel 01 / 012E', cus: '[Customer A]', pol: 'SGSIN', pod: 'INNSA', date: '2026-11-02', amt: 2475, stage: 'paid', receipt: 'issued', dar: '—', fail: null },
      { id: 'd2', no: 'SINOF2602405', doc: 'Invoice', ship: '[Booking 1006]', bl: 'BL-SG-24006', ves: 'Vessel 01 / 012E', cus: '[Customer B]', pol: 'SGSIN', pod: 'SAJED', date: '2026-11-02', amt: 3900, stage: 'paid', receipt: 'not', dar: '—', fail: null },
      { id: 'd3', no: 'NSAOF2601044', doc: 'Invoice', ship: '[Booking 1005]', bl: 'BL-IN-24005', ves: 'Vessel 04 / 021S', cus: '[Customer C]', pol: 'INNSA', pod: 'SGSIN', date: '2026-11-03', amt: 1200, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'portal' },
      { id: 'd4', no: 'SINOD2600311CR', doc: 'Credit Note', ship: '[Booking 1004]', bl: 'BL-SG-24004', ves: 'Vessel 03 / 108N', cus: '[Customer D]', pol: 'SGSIN', pod: 'MYPKG', date: '2026-11-03', amt: -4200, stage: 'invoiced', receipt: 'not', dar: '[DAR no.]', fail: null },
      { id: 'd5', no: 'LCHOF2600318', doc: 'Invoice', ship: '[Booking 1007]', bl: 'BL-TH-24007', ves: 'Vessel 05 / 077E', cus: '[Customer E]', pol: 'THLCH', pod: 'SGSIN', date: '2026-11-04', amt: 5600, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'gfs' },
      { id: 'd6', no: '[Receipt no.]', doc: 'Receipt', ship: '[Booking 1001]', bl: 'BL-SG-24001', ves: 'Vessel 01 / 012E', cus: '[Customer A]', pol: 'SGSIN', pod: 'INNSA', date: '2026-11-04', amt: 2475, stage: 'paid', receipt: 'issued', dar: '—', fail: null },
      { id: 'd7', no: '—', doc: 'Invoice', ship: '[Booking 1003]', bl: 'BL-CN-24003', ves: 'Vessel 02 / 044W', cus: '[Customer F]', pol: 'CNSHA', pod: 'SGSIN', date: '2026-11-04', amt: 320, stage: 'yet', receipt: 'not', dar: '—', fail: null },
      { id: 'd8', no: 'SINOF2602298', doc: 'Invoice', ship: '[Booking 1009]', bl: 'BL-SG-24009', ves: 'Vessel 03 / 108N', cus: '[Customer G]', pol: 'SGSIN', pod: 'MYPKG', date: '2026-11-05', amt: 6120, stage: 'unpaid', receipt: 'not', dar: '—', fail: 'email' }
    ];
    const STAGE = { invoiced: 'Invoiced', yet: 'Yet to be invoiced', paid: 'Paid', unpaid: 'Unpaid' };
    const CHIP = { invoiced: 'background:#EAF4FB;color:#005C96', yet: 'background:#EEF1F5;color:#5A6170', paid: 'background:#E6F3EC;color:#1F6B45', unpaid: 'background:#FDF0E3;color:#8A4200' };
    const has = (v, q) => !q || String(v).toLowerCase().includes(String(q).toLowerCase());
    const inStage = (d, k) => k === 'issued' ? d.receipt === 'issued' : (k === 'notissued' ? d.receipt === 'not' : (k === 'invoiced' ? d.stage !== 'yet' : d.stage === k));
    const match = (d) => has(d.ship, f.ship) && (!f.doc || d.doc === f.doc) && has(d.bl, f.bl) && has(d.ves, f.ves) && has(d.cus, f.cus) && has(d.no, f.no)
      && (!f.idate || d.date === f.idate) && (!f.from || d.date >= f.from) && (!f.to || d.date <= f.to) && has(d.pol, f.pol) && has(d.pod, f.pod);
    const base = D.filter(match);
    const vis = base.filter((d) => !s.stage || inStage(d, s.stage));
    const fmtD = (iso) => iso.slice(8) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(iso.slice(5, 7)) - 1] + ' ' + iso.slice(0, 4);
    const selEdge = 'background:#EAF4FB;box-shadow:inset 3px 0 0 #0071B7;';
    const rows = vis.map((d) => {
      const on = s.selected === d.id;
      return { ...d, dateText: fmtD(d.date), amtText: (d.amt < 0 ? '− ' : '') + m(Math.abs(d.amt)), stageText: STAGE[d.stage], chip: CHIP[d.stage],
        cell: on ? 'background:#EAF4FB;' : '', edge: on ? selEdge : '', select: () => this.setState({ selected: d.id }) };
    });
    const stageDefs = [['invoiced', 'Invoiced'], ['yet', 'Yet to be invoiced'], ['paid', 'Paid'], ['unpaid', 'Unpaid'], ['issued', 'Receipt issued'], ['notissued', 'Receipt not issued']];
    const stages = stageDefs.map(([k, label]) => {
      const on = s.stage === k;
      return { label, value: base.filter((d) => inStage(d, k)).length, on: on ? 'true' : 'false', border: on ? '#0071B7' : '#DADDE3', shadow: on ? '0 0 0 1px #0071B7' : 'none',
        pick: () => this.setState({ stage: on ? null : k }) };
    });
    const sd = D.find((d) => d.id === s.selected) || D[0];
    const ok = ['Completed', 'background:#E6F3EC;color:#1F6B45'], pend = ['Pending', 'background:#EEF1F5;color:#5A6170'], bad = ['Failed', 'background:#FBEAEA;color:#A3262A'];
    const inv = sd.stage !== 'yet';
    const steps = [
      ['LMS charge', ok],
      ['Invoice', inv ? ok : pend],
      ['Tax validation', !inv ? pend : (sd.fail === 'portal' ? bad : ok)],
      ['Distribution', !inv ? pend : (sd.fail === 'email' ? bad : ok)],
      ['Payment', sd.stage === 'paid' ? ok : pend],
      ['Receipt', sd.receipt === 'issued' ? ok : pend]
    ];
    const trace = steps.map(([label, st]) => ({ label, state: st[0], chip: st[1], dot: st === ok ? '#1F8A55' : (st === bad ? '#B3363A' : '#C5CAD3'), fg: st === pend ? '#5A6170' : '#161A21' }));
    const failDefs = {
      portal: [['Government tax portal', 'Rejected', 'Schema validation failed: [error description from portal]']],
      gfs: [['GFS', 'Rejected', 'Journal posting rejected: [error description from GFS]']],
      email: [['Customer email', 'Bounced', 'Invoice email bounced: [delivery error description]']]
    };
    const fl = sd.fail ? failDefs[sd.fail] : [];
    const fails = fl.length ? fl.map(([sys, state, desc]) => ({ sys, state, desc, chip: bad[1], border: '#E9B7B9', bg: '#FFF8F8' }))
      : [{ sys: 'GIRS · GFS · Government portal · Third-party', state: 'No failures', desc: 'All validation checks passed for this record.', chip: ok[1], border: '#DADDE3', bg: '#fff' }];
    const audit = [
      { event: sd.doc + ' created', by: 'System · batch run', at: fmtD(sd.date) + ' 09:12' },
      { event: 'Tax computation', by: 'System', at: fmtD(sd.date) + ' 09:12' },
      { event: 'Email sent to customer', by: '[No-reply mailbox]', at: fmtD(sd.date) + ' 09:15' },
      { event: sd.fail === 'email' ? 'Email bounced' : 'Email delivered', by: 'Email delivery status', at: fmtD(sd.date) + ' 09:16' },
      { event: 'Status changed · ' + STAGE[sd.stage], by: '[User ID]', at: fmtD(sd.date) + ' 14:30' }
    ];
    const setF = (k) => (e) => this.setState({ f: { ...f, [k]: e.target.value } });
    const tabDefs = [['trace', 'Transaction trace'], ['fail', 'Failed transactions'], ['audit', 'Audit trail']];
    return {
      f: { ship: f.ship || '', doc: f.doc || '', bl: f.bl || '', ves: f.ves || '', cus: f.cus || '', no: f.no || '', idate: f.idate || '', from: f.from || '', to: f.to || '', pol: f.pol || '', pod: f.pod || '' },
      set: { ship: setF('ship'), doc: setF('doc'), bl: setF('bl'), ves: setF('ves'), cus: setF('cus'), no: setF('no'), idate: setF('idate'), from: setF('from'), to: setF('to'), pol: setF('pol'), pod: setF('pod') },
      clear: () => this.setState({ f: {}, stage: null }),
      stages, rows, rowCount: rows.length, empty: rows.length === 0,
      tabs: tabDefs.map(([k, label]) => ({ label, on: s.tab === k ? 'true' : 'false', fg: s.tab === k ? '#0071B7' : '#5A6170', line: s.tab === k ? '#0071B7' : 'transparent', pick: () => this.setState({ tab: k }) })),
      tabTrace: s.tab === 'trace', tabFail: s.tab === 'fail', tabAudit: s.tab === 'audit',
      sel: { no: sd.no === '—' ? sd.bl : sd.no, corr: 'CID-' + sd.bl.replace(/[^0-9]/g, '') + '-' + sd.id.toUpperCase() },
      trace, fails, audit,
      pendingText: '2 pending approvals · approvers notified by email',
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' }),
      exXls: () => this.setState({ notice: rows.length + ' records exported to Excel.' }),
      exCsv: () => this.setState({ notice: rows.length + ' records exported to CSV.' }),
      exPdf: () => this.setState({ notice: rows.length + ' records exported to PDF.' })
    };
  }
}
</script>

  constructor(p) {

  renderVals() {
    const s = this.state;

    const received = 49476;

      { id: 'f', no: 'SINOF2602312', bl: 'BL-SG-24012', amt: 640, conf: 72, factors: ['Virtual Account', 'Exact Amount'] },

      { id: 'j', no: 'SINOF2601799', bl: 'BL-SG-24019', amt: 12800, conf: 22, factors: ['Customer BDR'] }
    ];
    const isInc = (i) => (s.manual[i.id] !== undefined ? s.manual[i.id] : i.conf >= s.thr);
    const sel = inv.filter(isInc);
    const alloc = sel.reduce((a, i) => a + i.amt, 0);
    const diff = received - alloc;
    const refs = [
      { text: 'SINOF2602144', id: 'a', conf: 'Invoice ref · 99%' },
      { text: '02281  (prefix missing)', id: 'c', conf: 'Fuzzy · 88%' },
      { text: 'B/L BL-SG-24006', id: 'b', conf: 'B/L · 93%' }
    ];
    return {
      thr: s.thr,
      setThr: (e) => this.setState({ thr: Number(e.target.value), manual: {} }),
      rows: inv.map((i) => {
        const inc = isInc(i);
        const hi = i.conf >= 85, mid = i.conf >= 60;
        return { ...i, inc, amtText: m(i.amt), w: i.conf + '%',
          bar: hi ? 'var(--okbar)' : (mid ? 'var(--warnbar)' : 'var(--badbar)'),
          rowStyle: s.allocated && inc ? 'background:var(--okrow)' : (inc ? 'background:var(--tint2)' : ''),
          toggle: () => this.setState({ manual: { ...s.manual, [i.id]: !inc } }) };
      }),
      slipRefs: refs.map((r) => {
        const on = isInc(inv.find((i) => i.id === r.id));
        return { text: r.text, conf: r.conf, border: on ? 'var(--okbar)' : 'var(--bd)', bg: on ? 'rgba(46,139,87,.07)' : 'var(--surface)', fg: on ? 'var(--ok)' : 'var(--muted)' };
      }),
      allocText: m(alloc),
      diffText: (diff < 0 ? '− ' : '') + m(Math.abs(diff)),
      diffColor: diff === 0 ? 'var(--ok)' : (diff < 0 ? 'var(--bad)' : 'var(--warn)'),
      selCount: sel.length,
      overAlloc: diff < 0,
      cantAllocate: sel.length === 0 || diff < 0,
      allocated: s.allocated,
      notAllocated: !s.allocated,
      allocate: () => this.setState({ allocated: true }),
      undo: () => this.setState({ allocated: false })
    };
  }
}

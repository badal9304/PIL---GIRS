.mx-af{animation:none}.mx-dot.on::after{animation:mxFade .3s .6s both}
.mx-dw svg{animation:mxSpin .6s cubic-bezier(.2,.7,.2,1) both}

.mx-main.mx-ra .mx-dw svg{animation-name:mxSpin2}
.mx-side.mx-ra>*{animation-name:mxSide2}
.mx-t tbody tr{animation:mxFade .25s ease-out both}

<script type="text/x-dc" id="logic">
// ---------- MIS reports: sample data (deterministic per month) ----------
const MIS_R = (seed) => { let x = 0; for (const c of String(seed)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; };
const MIS_LOC = [['SGSIN', 'Singapore', 'SG', 'SG-SR-9', 9], ['MYPKG', 'Malaysia', 'MY', 'MY-SST-8', 8], ['INNSA', 'India', 'IN', 'IN-GST-18', 18], ['THLCH', 'Thailand', 'TH', 'TH-VAT-7', 7]];
const MIS_VSL = [['KOTA JUBAH', 'KCX'], ['KOTA SEJATI', 'CNS'], ['KOTA GEMILANG', 'RSS'], ['KOTA PERDANA', 'KCX'], ['KOTA LAYANG', 'IDS'], ['KOTA CAHAYA', 'MCS'], ['CMA CGM LEKKI', 'NZS'], ['CMA CGM KAURI', 'NZS'], ['KOTA SATRIA', 'RGX'], ['NORFOLK', 'NZS']];
const MIS_CUST = ['Straits Harbour Logistics', 'Meridian Agro Exports', 'Kinabalu Home Furnishings', 'Orchid Lane Polymers', 'Andaman Bay Traders', 'Lion City Forwarding'];
const MIS_UNINV = ['Data not received from LMS', 'ROE not received', 'Split-payer unconfirmed', 'Charge hold'];
const MIS_GFS = ['Accounting period closed for entity', 'No GFS tax mapping for tax code', 'Customer not found in GFS', 'GFS interface timeout'];
const MIS_FIELDS = [
  ['Consignee', (r) => { const a = MIS_CUST[Math.floor(r() * 6)], b = MIS_CUST[Math.floor(r() * 6)]; return [a, a === b ? MIS_CUST[(MIS_CUST.indexOf(a) + 1) % 6] : b]; }, 'Invoice to wrong party'],
  ['Gross weight (kg)', (r) => { const w = 8000 + Math.floor(r() * 18000); return [misN(w), misN(w - 200 - Math.floor(r() * 1500))]; }, 'Charge amount differs'],
  ['Container count', (r) => { const c = 1 + Math.floor(r() * 6); return [String(c), String(c - 1 || 2)]; }, 'Charge amount differs'],
  ['Payment term', () => ['Collect', 'Prepaid'], 'Invoice to wrong party'],
  ['Charge code', (r) => [['BAF', 'THC-O', 'DOC'][Math.floor(r() * 3)], '—'], 'Charge missing on invoice'],
  ['Commodity', () => ['Reefer · frozen seafood', 'General cargo'], 'Tax code may differ']
];
const MIS_TREE = [
  { g: 'User related', subs: [
    { t: 'Operational reports', items: [['lmsgirs', 'LMS Voyages vs GIRS Voyages', 'Voyages and B/L counts received from LMS against what GIRS holds'], ['vslbl', 'Vessel-wise B/L', 'B/Ls per vessel and how many are invoiced']] },
    { t: 'Financial reports', items: [['inv', 'Bookings Invoiced', 'Bookings fully invoiced in the period, with invoice value and tax'], ['uninv', 'Bookings Un-Invoiced', 'Bookings with B/Ls still to invoice, why, and for how long'], ['cn', 'CN related', 'Credit notes by reason, source and status'], ['tax', 'Period-wise Invoice and corresponding Tax Codes', 'Invoice value and tax by tax code for the period']] },
    { t: 'Exception reports', items: [['lmsdata', 'Data from LMS vs Data in GIRS', 'Booking and B/L fields where GIRS differs from what LMS sent'], ['gfs', 'Posting to GFS', 'Invoices and credit notes that failed to post to GFS']] }] },
  { g: 'Management reporting', subs: [
    { t: 'Strategic', items: [['ctry', 'Country-wise Revenue / Loss', 'Net revenue and revenue loss by country']] }] }
];
const MIS_ITEMS = MIS_TREE.flatMap((g) => g.subs.flatMap((sb) => sb.items.map(([k, t, d]) => ({ k, t, d, sub: sb.t, g: g.g }))));
const misFmt = (v) => (+v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const misK = (v) => { const a = Math.abs(+v || 0); return a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (v / 1e3).toFixed(1) + 'K' : misFmt(v); };
const misN = (v) => (+v || 0).toLocaleString('en-US');
const misMonths = () => { const out = []; const d = new Date(); for (let i = 0; i < 6; i++) out.push(new Date(d.getFullYear(), d.getMonth() - i, 1)); return out; };
const misMKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const misMLbl = (d) => d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
const misDay = (d) => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
const misPrev = (mk) => { const y = +mk.slice(0, 4), m = +mk.slice(5) - 1; return misMKey(new Date(y, m - 1, 1)); };
const MIS_CACHE = {};

function misData(mk) {
  if (MIS_CACHE[mk]) return MIS_CACHE[mk];
  const r = MIS_R('mis2' + mk), y = +mk.slice(0, 4), m = +mk.slice(5) - 1, days = new Date(y, m + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cur = y === today.getFullYear() && m === today.getMonth(), lastDay = cur ? today.getDate() : days;
  const voy = [], bkg = [], inv = [], mm = [];
  MIS_LOC.forEach(([port, ctry, cc, tcode, rate]) => {
    const n = 14 + Math.floor(r() * 10);
    for (let i = 0; i < n; i++) {
      const v = MIS_VSL[Math.floor(r() * MIS_VSL.length)], dir = r() < 0.5 ? 'E' : 'I';
      const no = String(Math.floor(r() * 9)) + v[0].slice(0, 1) + v[0].split(' ').pop().slice(0, 1) + String(1 + Math.floor(r() * 8)) + String.fromCharCode(65 + Math.floor(r() * 26)) + String.fromCharCode(65 + Math.floor(r() * 26)) + dir;
      const day = 1 + Math.floor(r() * lastDay), date = new Date(y, m, day), age = Math.round((today - date) / 864e5);
      const roll = r(), inG = roll > 0.04;
      const nb = 3 + Math.floor(r() * 5), books = [];
      let lms = 0, girs = 0;
      for (let k = 0; k < nb; k++) {

      userName: USER_NAME, initials: USER_INITIALS, curLogin: USER_NAME, curRole: (LOGINS[s.__lg] || LOGINS[0]).role + ' · ' + (LOGINS[s.__lg] || LOGINS[0]).code,
      exp: (e) => { const v = e.target.value; if (!v) return; e.target.value = ''; this.setState({ __toast: 'Export to ' + ({ xlsx: 'Excel', csv: 'CSV', pdf: 'PDF' })[v] + ' prepared — current filters applied.' }); },
      hasToast: !!s.__toast, toast: s.__toast, closeToast: () => this.setState({ __toast: '' }),
      elevate: () => this.setState({ __um: false, __toast: 'Elevated access request sent to your manager. Access is time-bound and needs MFA once approved.' }),
      signOut: () => this.setState({ __um: false, __toast: 'Signed out of GIRS (prototype — no session is ended).' })
    } });
  }
}

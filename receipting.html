<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIRS Receipting and Reconciliation</title>
<link rel="icon" href="pil-logo.png">
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#161A21;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:#0071B7}a:hover{color:#005C96}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:#3A4556;text-decoration:none;font-size:13px;font-weight:500}
.nav-item:hover{background:#F1F3F6;color:#161A21}
.nav-on,.nav-on:hover{background:#EAF4FB;color:#0071B7;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid #C5CAD3;background:#fff;color:#161A21;font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#F1F3F6}
.btn-sm{height:32px;padding:0 12px}
.btn-primary{background:#0071B7;border-color:#0071B7;color:#fff}
.btn-primary:hover{background:#005C96;border-color:#005C96}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:2px solid #0071B7;outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select:hover,.input:hover{border-color:#8C95A3}
.input{height:36px;padding:0 12px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:#fff;border:1px solid #DADDE3;border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid #DADDE3;box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:#5A6170}
.lbl{display:block;font-size:12px;font-weight:600;color:#5A6170;line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A6170;font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:#5A6170;padding:0 12px;border-bottom:1px solid #DADDE3;white-space:nowrap;background:#F7F8FA;box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid #ECEEF2;vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:#F7F9FC}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:#0071B7;cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:#0071B7;cursor:pointer}
.tile{background:#fff;border:1px solid #DADDE3;border-radius:8px;height:76px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:4px;box-sizing:border-box}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid #0071B7;outline-offset:2px}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <div aria-hidden="true" style="height: 3px; background: #E31D1A; flex: none"></div>
  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside style="flex: 1 0 240px; max-width: 240px; background: #fff; border-inline-end: 1px solid #DADDE3; display: flex; flex-direction: column; box-sizing: border-box">
      <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #ECEEF2; box-sizing: border-box">
        <img src="pil-logo.png" alt="PIL" style="height: 26px; width: auto; display: block">
        <span style="width: 1px; height: 20px; background: #DADDE3"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: #0071B7">GIRS</span>
      </div>
      <nav aria-label="Screens" style="display: flex; flex-direction: column; gap: 20px; padding: 16px 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Operations</div>
          <a href="index.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.3 19a10 10 0 1 1 17.4 0"></path><path d="M12 14l4-4"></path></svg>
            <span>Operations Cockpit</span>
          </a>
          <a href="charge-processing.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path><circle cx="19" cy="18" r="2"></circle></svg>
            <span>Charge Processing</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Invoicing</div>
          <a href="invoice-previewer.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
            <span>Invoice Previewer</span>
          </a>
          <a href="credit-notes.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15h6"></path></svg>
            <span>Credit Notes</span>
          </a>
          <a href="dar-console.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
            <span>DAR Console</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Receivables</div>
          <a href="receipting.html" class="nav-item nav-on" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h7"></path><path d="M15 17l2 2 4-4"></path></svg>
            <span>Receipting</span>
          </a>
          <a href="cashapp-workbench.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>
            <span>CashApp Workbench</span>
          </a>
          <a href="tolerance-coreor.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
            <span>Tolerance &amp; COREOR</span>
          </a>
          <a href="soa-aging.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
            <span>SOA &amp; Aging</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Enquiry</div>
          <a href="enquiry.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <span>Enquiry &amp; Monitoring</span>
          </a>
        </div>
      </nav>
    </aside>

    <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
      <header style="min-height: 64px; background: #fff; border-bottom: 1px solid #DADDE3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 24px; box-sizing: border-box">
        <div style="min-width: 0">
          <h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Receipting &amp; Reconciliation</h1>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5A6170">Bank and third-party payments matched to invoices · cleared-funds recognition · reconciliation across GIRS, GFS, bank and customer platforms</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <label for="src" style="font-size: 12px; font-weight: 600; color: #5A6170">Source</label>
          <div style="position: relative">
            <select id="src" class="select" value="{{src}}" onChange="{{setSrc}}" style="width: 200px">
              <option value="all">All sources</option>
              <option value="Bank · MT940">Bank · MT940</option>
              <option value="Bank · CAMT.053">Bank · CAMT.053</option>
              <option value="ODeX">ODeX</option>
              <option value="Qwiik">Qwiik</option>
              <option value="FAM">FAM</option>
              <option value="PocketApp">PocketApp</option>
              <option value="Bulk upload">Bulk upload</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 10px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn" onClick="{{bulk}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
            Bulk receipt upload
          </button>
        </div>
      </header>

      <main style="flex: 1 1 auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 8px; background: #EAF4FB; border: 1px solid #B9D9EE; color: #005C96; box-sizing: border-box">{{notice}}</div>
        </sc-if>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
            <div class="tile">
              <span style="font-size: 12px; font-weight: 500; color: #5A6170">{{k.label}}</span>
              <span class="mono" style="font-size: 24px; font-weight: 500; line-height: 32px; color: {{k.color}}">{{k.value}}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
          <section class="card" style="flex: 999 1 720px; min-width: 0; overflow: hidden">
            <div class="card-head"><h2 class="card-title">Incoming payments</h2><span class="card-meta">{{rowCount}} payments</span></div>
            <div style="overflow-x: auto">
              <table>
                <thead><tr><th>Payment ref.</th><th>Source</th><th>Payer</th><th>Remittance ref.</th><th class="r">Amount</th><th>Funds</th><th>Match</th><th>Status</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: #0071B7">{{r.id}}</button></td>
                      <td style="{{r.cell}}">{{r.src}}</td>
                      <td style="{{r.cell}}">{{r.payer}}</td>
                      <td class="mono" style="color: #3A4556; {{r.cell}}">{{r.ref}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.ccy}} {{r.amtText}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.fundsChip}}">{{r.funds}}</span></td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.matchChip}}">{{r.match}}</span></td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.stChip}}">{{r.status}}</span></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
          </section>

          <section class="card" style="flex: 1 1 400px; max-width: 440px; min-width: 0; overflow: hidden">
            <div class="card-head"><h2 class="card-title">Payment detail</h2><span class="chip" style="{{sel.stChip}}">{{sel.status}}</span></div>
            <div style="padding: 16px; border-bottom: 1px solid #ECEEF2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
              <div><div class="k">Payment ref.</div><div class="mono" style="margin-top: 2px">{{sel.id}}</div></div>
              <div><div class="k">Amount</div><div class="mono" style="margin-top: 2px">{{sel.ccy}} {{sel.amtText}}</div></div>
              <div><div class="k">Source</div><div style="margin-top: 2px">{{sel.src}}</div></div>
              <div><div class="k">Matched invoice</div><div class="mono" style="margin-top: 2px">{{sel.inv}}</div></div>
              <sc-if value="{{sel.cross}}" hint-placeholder-val="{{ false }}"><div style="grid-column: span 2"><span class="chip" style="background: #EAF4FB; color: #005C96">Cross-trade B/L · POL / POD notified on receipt</span></div></sc-if>
            </div>
            <div style="padding: 12px 16px 4px"><div class="k">Reconciliation</div></div>
            <ul style="list-style: none; margin: 0; padding: 0 16px 8px">
              <sc-for list="{{recon}}" as="c" hint-placeholder-count="4">
                <li style="display: flex; align-items: center; justify-content: space-between; height: 40px; border-bottom: 1px solid #ECEEF2"><span>{{c.label}}</span><span class="chip" style="{{c.chip}}">{{c.state}}</span></li>
              </sc-for>
            </ul>
            <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="padding: 12px 14px; border-radius: 6px; {{sel.noteStyle}}">{{sel.note}}</div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-if value="{{act.receipt}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{doReceipt}}">Create receipt</button></sc-if>
                <sc-if value="{{act.recon}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{doRecon}}">Run reconciliation</button></sc-if>
                <sc-if value="{{act.email}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{doEmail}}">Email customer open-invoice link</button></sc-if>
                <sc-if value="{{act.dup}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{doRefund}}">Route to refund</button></sc-if>
                <sc-if value="{{act.short}}" hint-placeholder-val="{{ false }}"><a class="btn" href="tolerance-coreor.html" style="text-decoration: none">Review in Tolerance &amp; COREOR</a></sc-if>
                <sc-if value="{{act.split}}" hint-placeholder-val="{{ false }}"><a class="btn" href="cashapp-workbench.html" style="text-decoration: none">Split allocation in CashApp</a></sc-if>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

</div>
</script>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { selected: 'P-0001', src: 'all', done: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const PAY = [
      { id: 'P-0001', src: 'Bank · MT940', payer: '[Customer A]', ref: 'SINOF2602401', ccy: 'USD', amt: 2475, cleared: true, match: 'matched', inv: 'SINOF2602401', platform: false },
      { id: 'P-0002', src: 'ODeX', payer: '[Customer B]', ref: 'SINOF2602405', ccy: 'USD', amt: 3900, cleared: true, match: 'matched', inv: 'SINOF2602405', platform: true, cross: true },
      { id: 'P-0003', src: 'Bank · CAMT.053', payer: '[Customer C]', ref: '—', ccy: 'USD', amt: 1520, cleared: true, match: 'noref', inv: '—', platform: false },
      { id: 'P-0004', src: 'Qwiik', payer: '[Customer D]', ref: 'SINOF2602310', ccy: 'USD', amt: 9750, cleared: true, match: 'dup', inv: 'SINOF2602310', platform: true },
      { id: 'P-0005', src: 'Bank · MT940', payer: '[Customer E]', ref: 'LCHOF2600318', ccy: 'USD', amt: 5600, cleared: false, match: 'matched', inv: 'LCHOF2600318', platform: false },
      { id: 'P-0006', src: 'PocketApp', payer: '[Customer F]', ref: 'SINOF2602298', ccy: 'USD', amt: 6100, cleared: true, match: 'short', inv: 'SINOF2602298', platform: true },
      { id: 'P-0007', src: 'FAM', payer: '[Customer G]', ref: 'NSAOF2601044', ccy: 'USD', amt: 1350, cleared: true, match: 'over', inv: 'NSAOF2601044', platform: true },
      { id: 'P-0008', src: 'Bulk upload', payer: '[Customer H]', ref: 'SINOF2602144 / 02281', ccy: 'USD', amt: 39726, cleared: true, match: 'multi', inv: '2 invoices', platform: false }
    ];
    const MATCH = {
      matched: ['Matched', 'background:#E6F3EC;color:#1F6B45'], noref: ['No reference', 'background:#FBEAEA;color:#A3262A'],
      dup: ['Duplicate', 'background:#FBEAEA;color:#A3262A'], short: ['Short payment', 'background:#FDF0E3;color:#8A4200'],
      over: ['Overpayment', 'background:#FDF0E3;color:#8A4200'], multi: ['Multiple invoices', 'background:#EAF4FB;color:#005C96']
    };
    const ST = {
      await: ['Awaiting clearance', 'background:#EEF1F5;color:#5A6170'], exc: ['Exception', 'background:#FDF0E3;color:#8A4200'],
      ready: ['Ready to receipt', 'background:#EAF4FB;color:#005C96'], receipted: ['Receipted', 'background:#E6F3EC;color:#1F6B45'],
      reconciled: ['Reconciled', 'background:#1F6B45;color:#fff'], emailed: ['Customer emailed', 'background:#EAF4FB;color:#005C96'],
      refund: ['Routed to refund', 'background:#EEF1F5;color:#5A6170']
    };
    const stOf = (p) => {
      const d = s.done[p.id];
      if (d) return d;
      if (!p.cleared) return 'await';
      if (p.match === 'matched') return 'ready';
      return 'exc';
    };
    const selEdge = 'background:#EAF4FB;box-shadow:inset 3px 0 0 #0071B7;';
    const vis = PAY.filter((p) => s.src === 'all' || p.src === s.src);
    const rows = vis.map((p) => {
      const st = stOf(p), on = s.selected === p.id;
      return { ...p, amtText: m(p.amt), funds: p.cleared ? 'Cleared' : 'Pending', fundsChip: p.cleared ? 'background:#E6F3EC;color:#1F6B45' : 'background:#EEF1F5;color:#5A6170',
        match: MATCH[p.match][0], matchChip: MATCH[p.match][1], status: ST[st][0], stChip: ST[st][1],
        cell: on ? 'background:#EAF4FB;' : '', edge: on ? selEdge : '', select: () => this.setState({ selected: p.id, notice: '' }) };
    });
    const p = PAY.find((x) => x.id === s.selected) || PAY[0];
    const st = stOf(p);
    const rec = st === 'receipted' || st === 'reconciled';
    const recon = [
      ['GIRS', rec ? 'Receipt created' : 'Pending', rec],
      ['GFS', st === 'reconciled' ? 'Posted · matched' : 'Pending', st === 'reconciled'],
      ['Bank transaction', p.cleared ? 'Cleared funds' : 'Not cleared', p.cleared],
      ['Receipt to customer', !p.platform ? (st === 'reconciled' ? 'Emailed' : 'Pending') : (st === 'reconciled' ? 'Retrievable on ' + p.src : 'Pending'), st === 'reconciled']
    ].map(([label, state, ok]) => ({ label, state, chip: state === 'Not applicable' ? 'background:#EEF1F5;color:#5A6170' : (ok ? 'background:#E6F3EC;color:#1F6B45' : 'background:#EEF1F5;color:#5A6170') }));
    const notes = {
      await: ['Receipting waits for cleared-funds confirmation from the bank.', 'background:#F4F5F7;color:#3A4556'],
      ready: ['Matched by invoice reference with cleared funds.', 'background:#E6F3EC;color:#1A5C3B'],
      receipted: ['Receipt created. Run reconciliation to confirm GFS posting and return the receipt to the customer channel.', 'background:#E6F3EC;color:#1A5C3B'],
      reconciled: ['Reconciled across GIRS, GFS, bank and customer platform.', 'background:#E6F3EC;color:#1A5C3B'],
      emailed: ['Customer emailed a link to their open invoices to select remittance line items.', 'background:#EAF4FB;color:#005C96'],
      refund: ['Duplicate payment routed to the refund workflow.', 'background:#F4F5F7;color:#3A4556'],
      exc: [{ noref: 'No reference or remittance details received.', dup: 'Payment duplicates an invoice that is already paid.', short: 'Short payment against the invoice.', over: 'Overpayment against the invoice.', multi: 'One payment covers multiple invoices.' }[p.match], 'background:#FDF0E3;color:#7A3A00']
    };
    const set = (k, msg) => this.setState({ done: { ...s.done, [p.id]: k }, notice: msg });
    const all = PAY.map(stOf);
    const kpis = [
      { label: 'Payments received', value: PAY.length, color: '#161A21' },
      { label: 'Auto-matched', value: PAY.filter((x) => x.match === 'matched').length, color: '#1F6B45' },
      { label: 'Exceptions', value: all.filter((x) => x === 'exc').length, color: '#8A4200' },
      { label: 'Reconciled', value: all.filter((x) => x === 'reconciled').length, color: '#005C96' }
    ];
    return {
      src: s.src, setSrc: (e) => this.setState({ src: e.target.value }),
      rows, rowCount: rows.length, kpis, recon,
      sel: { ...p, amtText: m(p.amt), status: ST[st][0], stChip: ST[st][1], note: notes[st][0], noteStyle: notes[st][1] },
      act: { receipt: st === 'ready', recon: st === 'receipted', email: st === 'exc' && p.match === 'noref', dup: st === 'exc' && p.match === 'dup',
        short: st === 'exc' && (p.match === 'short' || p.match === 'over'), split: st === 'exc' && p.match === 'multi' },
      doReceipt: () => set('receipted', 'Receipt created for ' + p.inv + '.' + (p.cross ? ' Cross-trade B/L: receipt notification emailed to POL / POD.' : '')),
      doRecon: () => set('reconciled', p.id + ' reconciled.'),
      doEmail: () => set('emailed', 'Open-invoice link emailed to ' + p.payer + '.'),
      doRefund: () => set('refund', p.id + ' routed to refund.'),
      hasNotice: !!s.notice, notice: s.notice,
      bulk: () => this.setState({ notice: 'Bulk receipt upload: select a CSV / Excel file using the receipt template.' })
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}

.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:76px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:4px;box-sizing:border-box}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { selected: 'P-0001', src: 'all', done: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const PAY = [
      { id: 'P-0001', src: 'Bank · MT940', payer: '[Customer A]', ref: 'SINOF2602401', ccy: 'USD', amt: 2475, cleared: true, match: 'matched', inv: 'SINOF2602401', platform: false },
      { id: 'P-0002', src: 'ODeX', payer: '[Customer B]', ref: 'SINOF2602405', ccy: 'USD', amt: 3900, cleared: true, match: 'matched', inv: 'SINOF2602405', platform: true, cross: true },
      { id: 'P-0003', src: 'Bank · CAMT.053', payer: '[Customer C]', ref: '—', ccy: 'USD', amt: 1520, cleared: true, match: 'noref', inv: '—', platform: false },
      { id: 'P-0004', src: 'Qwiik', payer: '[Customer D]', ref: 'SINOF2602310', ccy: 'USD', amt: 9750, cleared: true, match: 'dup', inv: 'SINOF2602310', platform: true },
      { id: 'P-0005', src: 'Bank · MT940', payer: '[Customer E]', ref: 'LCHOF2600318', ccy: 'USD', amt: 5600, cleared: false, match: 'matched', inv: 'LCHOF2600318', platform: false },
      { id: 'P-0006', src: 'PocketApp', payer: '[Customer F]', ref: 'SINOF2602298', ccy: 'USD', amt: 6100, cleared: true, match: 'short', inv: 'SINOF2602298', platform: true },
      { id: 'P-0007', src: 'FAM', payer: '[Customer G]', ref: 'NSAOF2601044', ccy: 'USD', amt: 1350, cleared: true, match: 'over', inv: 'NSAOF2601044', platform: true },
      { id: 'P-0009', src: 'Bank · MT940', payer: '[Customer J]', ref: 'SINIF2601177', ccy: 'USD', amt: 3148, cleared: true, match: 'short', inv: 'SINIF2601177', platform: false },
      { id: 'P-0010', src: 'FAM', payer: '[Customer L]', ref: 'SINOF2602312', ccy: 'USD', amt: 640, cleared: true, match: 'matched', inv: 'SINOF2602312', platform: true },
      { id: 'P-0011', src: 'Bank · CAMT.053', payer: '[Customer K]', ref: 'SINIF2601178', ccy: 'USD', amt: 4410, cleared: false, match: 'matched', inv: 'SINIF2601178', platform: false },
      { id: 'P-0012', src: 'Qwiik', payer: '[Customer M]', ref: '—', ccy: 'USD', amt: 980, cleared: true, match: 'noref', inv: '—', platform: true },
      { id: 'P-0008', src: 'Bulk upload', payer: '[Customer H]', ref: 'SINOF2602144 / 02281', ccy: 'USD', amt: 39726, cleared: true, match: 'multi', inv: '2 invoices', platform: false }
    ];
    const MATCH = {
      matched: ['Matched', 'background:var(--okbg);color:var(--ok)'], noref: ['No reference', 'background:var(--badbg);color:var(--bad)'],
      dup: ['Duplicate', 'background:var(--badbg);color:var(--bad)'], short: ['Short payment', 'background:var(--warnbg);color:var(--warn)'],
      over: ['Overpayment', 'background:var(--warnbg);color:var(--warn)'], multi: ['Multiple invoices', 'background:var(--tint);color:var(--accent2)']
    };
    const ST = {
      await: ['Awaiting clearance', 'background:var(--neutral);color:var(--muted)'], exc: ['Exception', 'background:var(--warnbg);color:var(--warn)'],
      ready: ['Ready to receipt', 'background:var(--tint);color:var(--accent2)'], receipted: ['Receipted', 'background:var(--okbg);color:var(--ok)'],
      reconciled: ['Reconciled', 'background:var(--ok);color:var(--onaccent)'], emailed: ['Customer emailed', 'background:var(--tint);color:var(--accent2)'],
      refund: ['Routed to refund', 'background:var(--neutral);color:var(--muted)'], credit: ['Credit balance', 'background:var(--tint);color:var(--accent2)']
    };
    const stOf = (p) => {
      const d = s.done[p.id];
      if (d) return d;
      if (!p.cleared) return 'await';
      if (p.match === 'matched') return 'ready';
      return 'exc';
    };
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const vis = PAY.filter((p) => s.src === 'all' || p.src === s.src);
    const rows = vis.map((p) => {
      const st = stOf(p), on = s.selected === p.id;
      return { ...p, amtText: m(p.amt), funds: p.cleared ? 'Cleared' : 'Pending', fundsChip: p.cleared ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--neutral);color:var(--muted)',
        match: MATCH[p.match][0], matchChip: MATCH[p.match][1], status: ST[st][0], stChip: ST[st][1],
        cell: on ? 'background:var(--tint);' : '', edge: on ? selEdge : '', select: () => this.setState({ selected: p.id, notice: '' }) };
    });
    const p = PAY.find((x) => x.id === s.selected) || PAY[0];
    const st = stOf(p);
    const rec = st === 'receipted' || st === 'reconciled';
    const recon = [
      ['GIRS', rec ? 'Receipt created' : 'Pending', rec],
      ['GFS', st === 'reconciled' ? 'Posted · matched' : 'Pending', st === 'reconciled'],
      ['Bank transaction', p.cleared ? 'Cleared funds' : 'Not cleared', p.cleared],
      ['Receipt to customer', !p.platform ? (st === 'reconciled' ? 'Emailed' : 'Pending') : (st === 'reconciled' ? 'Retrievable on ' + p.src : 'Pending'), st === 'reconciled']
    ].map(([label, state, ok]) => ({ label, state, chip: state === 'Not applicable' ? 'background:var(--neutral);color:var(--muted)' : (ok ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--neutral);color:var(--muted)') }));
    const notes = {
      await: ['Receipting waits for cleared-funds confirmation from the bank.', 'background:var(--bg);color:var(--muted2)'],
      ready: ['Matched by invoice reference with cleared funds.', 'background:var(--okbg);color:var(--ok2)'],
      receipted: ['Receipt created. Run reconciliation to confirm GFS posting and return the receipt to the customer channel.', 'background:var(--okbg);color:var(--ok2)'],
      reconciled: ['Reconciled across GIRS, GFS, bank and customer platform.', 'background:var(--okbg);color:var(--ok2)'],
      emailed: ['Customer emailed a link to their open invoices to select remittance line items.', 'background:var(--tint);color:var(--accent2)'],
      refund: ['Payment routed to the refund workflow.', 'background:var(--bg);color:var(--muted2)'],
      credit: ['Excess held as a customer credit balance, available for later allocation.', 'background:var(--tint);color:var(--accent2)'],
      exc: [{ noref: 'No reference or remittance details received.', dup: 'Payment duplicates an invoice that is already paid.', short: 'Short payment against the invoice.', over: 'Overpayment against the invoice.', multi: 'One payment covers multiple invoices.' }[p.match], 'background:var(--warnbg);color:var(--warn2)']
    };
    const set = (k, msg) => this.setState({ done: { ...s.done, [p.id]: k }, notice: msg });
    const all = PAY.map(stOf);
    const kpis = [
      { label: 'Payments received', value: PAY.length, color: 'var(--ink)' },
      { label: 'Auto-matched', value: PAY.filter((x) => x.match === 'matched').length, color: 'var(--ok)' },
      { label: 'Exceptions', value: all.filter((x) => x === 'exc').length, color: 'var(--warn)' },
      { label: 'Reconciled', value: all.filter((x) => x === 'reconciled').length, color: 'var(--accent2)' }
    ];
    return {
      src: s.src, setSrc: (e) => this.setState({ src: e.target.value }),
      rows, rowCount: rows.length, kpis, recon,
      sel: { ...p, amtText: m(p.amt), status: ST[st][0], stChip: ST[st][1], note: notes[st][0], noteStyle: notes[st][1] },
      act: { receipt: st === 'ready', recon: st === 'receipted', email: st === 'exc' && p.match === 'noref', dup: st === 'exc' && p.match === 'dup',
        short: st === 'exc' && (p.match === 'short' || p.match === 'over'), over: st === 'exc' && p.match === 'over', split: st === 'exc' && p.match === 'multi' },
      doReceipt: () => set('receipted', 'Receipt created for ' + p.inv + '.' + (p.cross ? ' Cross-trade B/L: receipt notification emailed to POL / POD.' : '')),
      doRecon: () => set('reconciled', p.id + ' reconciled.'),
      doEmail: () => set('emailed', 'Open-invoice link emailed to ' + p.payer + '.'),
      doRefund: () => set('refund', p.id + ' routed to refund.'),
      doCredit: () => set('credit', 'Excess on ' + p.id + ' held as a credit balance for ' + p.payer + '.'),
      hasNotice: !!s.notice, notice: s.notice,
      bulk: () => this.setState({ notice: 'Bulk receipt upload: select a CSV / Excel file using the receipt template.' })
    };
  }
}

      setLight: () => { save('girs.th', 'light'); this.setState({ __th: 'light' }); },

      hub: s.__hub, setHub: (e) => { save('girs.hub', e.target.value); this.setState({ __hub: e.target.value }); },

      curLogin: '[Login ' + (s.__lg + 1) + ']', curRole: '[Role ' + (s.__lg + 1) + ']',

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIRS Detention and Demurrage Engine</title>
<link rel="icon" href="pil-logo.png">
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root,.theme{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#8A919E;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96}
.theme[data-theme=dark]{--ink:#E6E9EE;--muted:#9AA3B2;--muted2:#C3CAD5;--muted3:#C3CAD5;--muted4:#6B7485;--line:#2C333E;--line2:#232A34;--bd:#3A4350;--bdh:#5D6878;--line3:#3A4350;--bg:#0E1116;--sub:#1B212A;--hover:#222934;--hover2:#1A2029;--hover3:#1A2029;--neutral:#262D38;--canvas:#0B0E13;--accent:#2A86CC;--accent2:#7DBDEE;--tint:#13263A;--tintbd:#1F4566;--tint2:#14222F;--ok:#5FC896;--okbg:#12291E;--ok2:#7AD3A6;--okdot:#3FB97A;--okbar:#3FB97A;--okbd:#1F4A33;--okrow:#132219;--warn:#F0A35C;--warnbg:#2E1F10;--warn2:#F5B37A;--warnbar:#E08A2E;--warnbd:#5A3A17;--bad:#F08A8C;--badbg:#321718;--badbar:#E0575B;--bad2:#F5A3A5;--badbd:#5C2A2C;--badrow:#24181A;--aibg:#241C38;--ai:#B9A4F2;--surface:#161B22;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#1F6FAE;color-scheme:dark}
.theme[data-theme=dark] .paper,.paper{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#8A919E;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96;color-scheme:light;color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}

.select:focus,.select:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.select:active{background:var(--sub)}
.select:disabled{background:var(--bg);color:var(--muted4);border-color:var(--line);cursor:not-allowed}
.input:focus,.input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
@supports (appearance: base-select){
.select,.select::picker(select){appearance:base-select}
.select{display:inline-flex;align-items:center;line-height:normal}
.select::picker-icon{display:none}
.select::picker(select){margin-top:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 10px 28px rgba(22,26,33,.16);max-height:min(360px,60vh);min-width:anchor-size(width)}
.select option{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px;border-radius:6px;color:var(--ink);font-size:13px;line-height:18px;cursor:pointer;outline:none}
.select option::checkmark{order:2;margin-inline-start:auto;color:var(--accent);font-weight:700}
.select option:hover{background:var(--hover)}
.select option:focus-visible{background:var(--hover);box-shadow:inset 0 0 0 2px var(--accent)}
.select option:active{background:var(--neutral)}
.select option:checked{background:var(--tint);color:var(--accent2);font-weight:600}
.select option:disabled{color:var(--muted4);cursor:not-allowed}
.select:open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.select:open + svg{transform:rotate(180deg)}
}
.select + svg{transition:transform .15s ease}
.menu{position:absolute;top:44px;inset-inline-end:0;z-index:30;width:296px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(22,26,33,.16);padding:6px;box-sizing:border-box}
.menu-sep{height:1px;background:var(--line2);margin:6px 4px}
.mi{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 10px;border-radius:6px;color:var(--ink);font-size:13px;line-height:18px;cursor:pointer;text-decoration:none;text-align:start}
.mi:hover{background:var(--hover);color:var(--ink)}
.mi:active{background:var(--neutral)}
.mi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mi[aria-checked=true]{background:var(--tint);color:var(--accent2)}
.mi[aria-checked=true] .mi-sub{color:var(--accent2)}
.mi svg{flex:none;color:var(--muted)}
.mi[aria-checked=true] svg{color:var(--accent)}
.mi-txt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.mi-lbl{font-weight:500;white-space:normal}
.mi-sub{font-size:12px;line-height:16px;color:var(--muted);white-space:normal}
.mi-danger{color:var(--bad)}.mi-danger svg{color:var(--bad)}.mi-danger:hover{background:var(--badbg);color:var(--bad)}
.ubtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 4px;border:1px solid var(--line);border-radius:18px;box-sizing:border-box;transition:background .12s,border-color .12s}
.ubtn:hover{background:var(--hover);border-color:var(--bd)}
.ubtn:active{background:var(--neutral)}
.ubtn[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.ubtn[aria-expanded=true] .uchev{transform:rotate(180deg)}
.ubtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uchev{transition:transform .15s ease}
tr[data-found=true] td{animation:gfound 2.8s ease-out 1}
@keyframes gfound{0%,40%{background:rgba(255,190,0,.30)}100%{background:transparent}}
.gfind{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 8px 0 14px;border-radius:8px;background:var(--tint);border:1px solid var(--tintbd);color:var(--accent2);box-sizing:border-box;flex-wrap:wrap}
.gmenu,.gdclose{display:none}
.gdctx{display:none}
.gscrim{display:none}
.gutxt span{white-space:nowrap}
@media (max-width:1439px){
.gperiod,.gtl{display:none !important}
.card{overflow-x:auto !important}
}
@media (max-width:1279px){
.r-col{max-width:none !important}
.gutxt{display:none !important}
}
@media (max-width:1023px){
.groot{height:100vh;height:100dvh !important;min-height:0 !important}
.gmenu{display:inline-flex;flex:none}
.gside{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:60;width:288px !important;max-width:86vw;transform:translateX(-100%);transition:transform .22s ease,box-shadow .22s ease;visibility:hidden}
.theme[dir=rtl] .gside{transform:translateX(100%)}
.gside[data-drawer=open]{transform:none !important;visibility:visible;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.gside .nav-item{height:40px}
.gsbfoot{display:none !important}
.gdclose{display:inline-flex}
.gscrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(14,17,22,.45)}
.gtop{padding:0 12px !important;gap:8px !important}
.gperiod,.gtl,.gutxt{display:none !important}
.gsearch{flex:1 1 auto !important;min-width:120px !important}
.ghead{padding:10px 12px !important}
.gmain{padding:12px !important;gap:12px !important}
.r-col{flex:1 1 100% !important}
.card{overflow-x:auto !important}
.r-g5,.r-g6{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
.r-mh{min-height:0 !important}
.r-mxh{max-height:none !important}
.r-gdoc{grid-template-columns:minmax(0,1fr) !important}
.r-gdoc > *{border-inline-end:0 !important}
}
@media (max-width:767px){
.gctx,.gtheme{display:none !important}
.gdctx{display:flex}
.gsearch .input{font-size:16px}
.r-g4,.r-g5,.r-g6{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.r-g3a,.r-gs,.r-g3:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g4:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g3a > *,.r-gs > *,.r-g3:has(input,select,textarea) > *,.r-g4:has(input,select,textarea) > *{grid-column:1/-1 !important}
section:has(> .r-paper){justify-content:flex-start !important;padding:12px !important;overflow-x:auto}
.r-paper{zoom:.505}
.r-g3a > :first-child{border-inline-end:0 !important;padding:12px 16px 0 !important}
.r-g3a br{display:none}
.r-g3a > a{border-inline-end:0 !important;border-top:1px solid var(--line2)}
.r-w{max-width:100% !important}
.card-head{flex-wrap:wrap;padding-block:8px}
.ghead h1{font-size:16px !important}
.ghead p{font-size:11.5px !important}
.gright{width:100%;gap:8px !important}
.gright .select,.gright .input{max-width:100%}
.r-wrap,.opt{flex-wrap:wrap !important;row-gap:8px !important}
.ifc .r-wrap,.tile .r-wrap,[role=tablist]{flex-wrap:nowrap !important}
[role=tablist]{overflow-x:auto;scrollbar-width:none;gap:20px !important}
[role=tablist]::-webkit-scrollbar{display:none}
.r-g4 > *,.r-g5 > *,.r-g6 > *{height:auto !important;min-height:68px;padding-block:10px !important}
.r-g4 > * > :last-child{font-size:19px !important;line-height:26px !important;word-break:break-word}
.gtoast{inset-inline:12px !important;bottom:12px !important;max-width:none !important}
.paper{max-width:none}
}
@media (max-width:420px){
.r-g2m:has(input,select,textarea),.r-g2:has(input,select,textarea){grid-template-columns:minmax(0,1fr) !important}
.r-g2m:has(input,select,textarea) > *,.r-g2:has(input,select,textarea) > *{grid-column:1/-1 !important}
}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:500}
.seg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cfg{display:flex;flex-direction:column;gap:6px;padding:0 16px;border-inline-start:1px solid var(--line2)}</style>
</helmet>
<div class="theme groot" data-theme="{{shell.theme}}"  style="height: 100vh; min-height: 640px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="height: 3px; background: var(--brand); flex: none"></div>
  <div style="flex: 1 1 auto; min-height: 0; display: flex">
    <sc-if value="{{shell.drawerOpen}}" hint-placeholder-val="{{ false }}"><div class="gscrim" onClick="{{shell.closeDrawer}}" aria-hidden="true"></div></sc-if>
    <aside id="gside" class="gside" data-drawer="{{shell.drawer}}" aria-label="Side panel" style="flex: none; width: {{shell.sbW}}; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; transition: width .18s ease">
      <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line2); box-sizing: border-box; {{shell.logoRow}}">
        <span style="display: inline-flex; background: white; border-radius: 4px; padding: 2px 4px"><img src="pil-logo.png" alt="PIL" style="display: block; {{shell.logo}}"></span>
        <span style="width: 1px; height: 20px; background: var(--line); {{shell.hide}}"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); {{shell.hide}}">GIRS</span>
        <button class="btn btn-icon btn-sm gdclose" onClick="{{shell.closeDrawer}}" aria-label="Close menu" style="margin-inline-start: auto; width: 32px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="gdctx" style="flex: none; flex-direction: column; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line2)">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px">
          <div style="position: relative"><label for="dhub" class="sr">Hub</label><select id="dhub" class="select select-sm" value="{{shell.hub}}" onChange="{{shell.setHub}}" style="width: 100%"><option value="SIN">Singapore · SIN</option><option value="NSA">India · NSA</option><option value="LCH">Thailand · LCH</option><option value="PKG">Malaysia · PKG</option><option value="JED">Saudi Arabia · JED</option><option value="ZLO">Mexico · ZLO</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          <div style="position: relative"><label for="dent" class="sr">Entity</label><select id="dent" class="select select-sm" value="{{shell.ent}}" onChange="{{shell.setEnt}}" style="width: 100%"><option value="PIL">PIL</option><option value="MELL">MELL</option><option value="MSC">MSC</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span class="chip" title="Fiscal period" style="background: var(--okbg); color: var(--ok); height: 28px; border-radius: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--okdot)"></span>[Fiscal period] · Open</span>
          <div role="radiogroup" aria-label="Theme" style="display: flex; gap: 2px; height: 32px; padding: 2px; border-radius: 6px; background: var(--neutral); box-sizing: border-box">
            <button role="radio" aria-checked="{{shell.lightOn}}" onClick="{{shell.setLight}}" aria-label="Light theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 4px; background: {{shell.lightBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
            <button role="radio" aria-checked="{{shell.darkOn}}" onClick="{{shell.setDark}}" aria-label="Dark theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 4px; background: {{shell.darkBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
          </div>
        </div>

        <div class="ghead" style="min-height: 56px; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box">

          <div style="position: relative">
            <label for="gexp" class="sr">Export</label>
            <select id="gexp" class="select" value="" onChange="{{shell.exp}}" style="width: 112px">
              <option value="">Export</option>
              <option value="xlsx">Excel</option>

            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>

          </div>
        </div>
      </div>
      <main class="gmain" style="flex: 1 0 auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div class="r-wrap" role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--tint); border: 1px solid var(--tintbd); color: var(--accent2); box-sizing: border-box">{{notice}}<button class="btn btn-sm" onClick="{{closeNotice}}">Close</button></div>
        </sc-if>

        <section class="card" aria-label="Country D&amp;D configuration" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 0; padding: 12px 0">
          <div class="cfg" style="border-inline-start: 0">
            <span class="k">Invoicing mode · per country</span>
            <div role="radiogroup" aria-label="Invoicing mode" style="display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--neutral); width: max-content">

          <div class="cfg">
            <label class="k" for="intv">Recurring interval</label>
            <div style="position: relative"><select id="intv" class="select select-sm r-w" value="{{interval}}" onChange="{{setInterval}}" style="width: 150px"><option value="Monthly">Monthly</option><option value="Fortnightly">Fortnightly</option><option value="Weekly">Weekly</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          </div>
          <div class="cfg">
            <label class="k" for="ftb">Free-time basis</label>
            <div style="position: relative"><select id="ftb" class="select select-sm r-w" value="{{basis}}" onChange="{{setBasis}}" style="width: 196px"><option value="sep">Separate DET and DEM</option><option value="comb">Combined DET + DEM</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          </div>
          <div class="cfg">
            <label class="k" for="dct">Day count</label>
            <div style="position: relative"><select id="dct" class="select select-sm r-w" value="{{dayCount}}" onChange="{{setDayCount}}" style="width: 220px"><option value="cal">Calendar days</option><option value="work">Working days · port holiday calendar</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          </div>
          <div class="cfg"><span class="k">Guardrails</span><span class="mono">Min [n] · Max [n] invoices</span></div>
          <div class="cfg">
            <span class="k">Admin fee per DD invoice</span>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked="{{fee}}" onChange="{{toggleFee}}"><span class="mono">[Admin fee] · where entity requires</span></label>
          </div>
          <div class="cfg"><span class="k">Stop triggers</span><span>Returned empty · Sold · Damaged · Abandoned · Customs hold</span></div>
        </section>

        <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section class="card r-col" style="flex: 999 1 760px; min-width: 0; overflow: hidden">
            <div class="card-head"><h2 class="card-title">Containers in D&amp;D</h2><span class="card-meta">Clock starts at OP (picked up) · ends at MT (returned)</span></div>
            <div style="overflow-x: auto">
              <table>
                <thead><tr><th>Container</th><th>B/L #</th><th>Type</th><th>Status</th><th>Clock start</th><th class="r">Free days</th><th class="r">Days used</th><th>Invoiced to</th><th class="r">Unbilled days</th><th>Next action</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: var(--accent)">{{r.no}}</button></td>
                      <td class="mono" style="{{r.cell}}">{{r.bl}}</td>
                      <td style="{{r.cell}}">{{r.kind}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.stChip}}">{{r.stText}}</span></td>
                      <td class="mono" style="{{r.cell}}">{{r.startText}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.free}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.used}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.toText}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.unbilled}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.actChip}}">{{r.act}}</span></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
          </section>

          <section class="card r-col" style="flex: 1 1 420px; max-width: 460px; min-width: 0; overflow: hidden; display: flex; flex-direction: column">
            <div class="card-head"><h2 class="card-title">{{sel.no}}</h2><span class="chip" style="{{sel.stChip}}">{{sel.stText}}</span></div>
            <div class="r-g3" style="padding: 12px 16px; border-bottom: 1px solid var(--line2); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px">
              <div><div class="k">B/L #</div><div class="mono">{{sel.bl}}</div></div>
              <div><div class="k">Free days</div><div class="mono">{{sel.free}}</div></div>
              <div><div class="k">Days used</div><div class="mono">{{sel.used}}</div></div>
            </div>
            <div style="padding: 10px 16px 8px; border-bottom: 1px solid var(--line2)">
              <div class="r-wrap" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px"><span class="k">Equipment milestones · from LMS</span><sc-if value="{{clash}}" hint-placeholder-val="{{ false }}"><span class="chip" style="height: 20px; font-size: 11px; background: var(--badbg); color: var(--bad)">Milestone clash</span></sc-if></div>
              <div class="r-g4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
                <sc-for list="{{miles}}" as="ms" hint-placeholder-count="4">
                  <div style="display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 6px; background: {{ms.bg}}">
                    <span style="font-size: 11px; line-height: 14px; color: var(--muted)">{{ms.label}}</span>
                    <span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 500; color: {{ms.fg}}">{{ms.at}}</span>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{clash}}" hint-placeholder-val="{{ false }}">
                <div class="r-wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: var(--badbg); color: var(--bad2); font-size: 12px; line-height: 16px"><span>{{clashText}}</span><button class="btn btn-sm" onClick="{{resolveClash}}">Resolve</button></div>
              </sc-if>
            </div>
            <div class="r-wrap" style="padding: 12px 16px 4px; display: flex; justify-content: space-between; align-items: center"><span class="k">Tariff tiers</span><span class="chip" style="background: var(--warnbg); color: var(--warn)">Sample tariff — rates to be provided by PIL</span></div>
            <ul style="list-style: none; margin: 0; padding: 0 16px 8px">
              <sc-for list="{{tiers}}" as="t" hint-placeholder-count="4">
                <li style="display: grid; grid-template-columns: 1fr 64px 96px; gap: 8px; align-items: center; height: 36px; border-bottom: 1px solid var(--line2)">
                  <span>{{t.label}}<span style="color: var(--muted); font-size: 12px"> · {{t.band}}</span></span>
                  <span class="mono r">{{t.days}} d</span>
                  <span class="mono r">{{t.amt}}</span>
                </li>
              </sc-for>
              <li style="display: grid; grid-template-columns: 1fr 64px 96px; gap: 8px; align-items: center; height: 36px; font-weight: 600"><span>Total D&amp;D to date</span><span></span><span class="mono r">{{sel.totalText}}</span></li>
            </ul>
            <div style="padding: 8px 16px 4px"><span class="k">D&amp;D invoices</span></div>
            <ul style="list-style: none; margin: 0; padding: 0 16px 8px">
              <sc-for list="{{invs}}" as="v" hint-placeholder-count="2">
                <li class="r-wrap" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--line2)">
                  <span style="display: flex; flex-direction: column; line-height: 16px"><span class="mono" style="font-weight: 500">{{v.no}}</span><span style="font-size: 11px; color: var(--muted)">{{v.kind}} · {{v.period}}</span></span>
                  <span class="mono">{{v.amt}}</span>
                </li>
              </sc-for>
              <sc-if value="{{noInvs}}" hint-placeholder-val="{{ false }}"><li style="height: 40px; display: flex; align-items: center; color: var(--muted)">No D&amp;D invoices yet.</li></sc-if>
            </ul>
            <div style="margin-top: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line2)">
              <div style="padding: 10px 12px; border-radius: 6px; {{sel.noteStyle}}">{{sel.note}}</div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-if value="{{canProg}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{runProg}}">{{progLabel}}</button></sc-if>
                <sc-if value="{{canFinal}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{runFinal}}">Raise final DD invoice</button></sc-if>
                <sc-if value="{{canCharge}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{addLolo}}">Add charge (e.g. LOLO)</button></sc-if>
                <sc-if value="{{canDamage}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{addDamage}}">Link container damage fee</button></sc-if>
                <sc-if value="{{canConvert}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{convert}}">Convert proforma to final (paid)</button></sc-if>
                <sc-if value="{{canAdv}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{addAdv}}">Add advance DD / container deposit</button></sc-if>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="gtoast" style="position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 520px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box">{{shell.toast}}<button class="btn btn-sm" onClick="{{shell.closeToast}}">Close</button></div>
  </sc-if>
</div>
</script>
<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { mode: 'prog', interval: 'Monthly', fee: true, selected: 'd1', done: {}, lolo: {}, adv: {}, conv: {}, dmg: {}, fixed: {}, basis: 'sep', dayCount: 'cal', notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => 'USD ' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const TODAY = Date.parse('2026-11-05');
    const day = 864e5;
    const fmt = (t) => { const d = new Date(t); return String(d.getUTCDate()).padStart(2, '0') + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
    const TIERS = [['Tier 1', 'Standard', 1, 7, 20], ['Tier 2', 'Escalation', 8, 14, 40], ['Tier 3', 'Punitive', 15, 9999, 80]];
    const C = [
      { id: 'd1', no: 'CONT 400002', bl: 'BL-SG-24004', kind: 'Demurrage', st: 'OP', start: '2026-09-20', free: 10, invTo: '2026-10-20', ret: null, invs: [['SINOD2602150', 'Progressive', '30 Sep – 20 Oct 2026']] },
      { id: 'd2', no: 'CONT 900001', bl: 'BL-MY-24010', kind: 'Detention', st: 'MT', start: '2026-09-15', free: 14, invTo: '2026-10-15', ret: '2026-11-02', invs: [['PKGID2600702', 'Progressive', '29 Sep – 15 Oct 2026']] },
      { id: 'd3', no: 'CONT 100002', bl: 'BL-SG-24001', kind: 'Detention', st: 'OP', start: '2026-10-22', free: 7, invTo: null, ret: null, invs: [] },
      { id: 'd4', no: 'CONT 300002', bl: 'BL-SG-24006', kind: 'Demurrage', st: 'OP', start: '2026-10-01', free: 5, invTo: null, ret: null, invs: [] },
      { id: 'd5', no: 'CONT 600001', bl: 'BL-SG-24009', kind: 'Detention', st: 'SOLD', start: '2026-08-10', free: 14, invTo: '2026-10-10', ret: '2026-10-28', invs: [['SINID2600655', 'Progressive', '24 Aug – 10 Oct 2026']] },
      { id: 'd6', no: 'CONT 700001', bl: 'BL-SG-24005', kind: 'Demurrage', st: 'CUS', start: '2026-10-12', free: 7, invTo: null, ret: '2026-10-30', invs: [] },
      { id: 'd7', no: 'CONT 110001', bl: 'BL-SG-24003', kind: 'Detention', st: 'OP', start: '2026-10-30', free: 10, invTo: null, ret: null, invs: [] },
      { id: 'd8', no: 'CONT 800001', bl: 'BL-SG-24011', kind: 'Demurrage', st: 'MT', start: '2026-10-05', free: 7, invTo: null, ret: '2026-10-20', invs: [] },
      { id: 'd9', no: 'CONT 120001', bl: 'BL-SG-24012', kind: 'Detention', st: 'OP', start: '2026-10-08', free: 10, invTo: null, ret: null, invs: [] },
      { id: 'd10', no: 'CONT 130001', bl: 'BL-IN-24013', kind: 'Demurrage', st: 'OP', start: '2026-10-25', free: 5, invTo: null, ret: null, invs: [] },
      { id: 'd11', no: 'CONT 140001', bl: 'BL-TH-24014', kind: 'Detention', st: 'MT', start: '2026-09-28', free: 10, invTo: '2026-10-25', ret: '2026-11-04', invs: [['LCHID2600212', 'Progressive', '15 Oct – 25 Oct 2026']] },
      { id: 'd12', no: 'CONT 150001', bl: 'BL-SG-24015', kind: 'Demurrage', st: 'OP', start: '2026-11-01', free: 7, invTo: null, ret: null, invs: [] },
      { id: 'd13', no: 'CONT 160001', bl: 'BL-MY-24016', kind: 'Detention', st: 'OP', start: '2026-09-05', free: 14, invTo: '2026-10-19', ret: null, invs: [['PKGID2600688', 'Progressive', '26 Sep – 19 Oct 2026']] },
      { id: 'd14', no: 'CONT 170001', bl: 'BL-SG-24017', kind: 'Demurrage', st: 'OP', start: '2026-10-18', free: 10, invTo: null, ret: null, invs: [] }
    ];
    const ST = { OP: ['OP · picked up', 'background:var(--tint);color:var(--accent2)'], MT: ['MT · returned empty', 'background:var(--okbg);color:var(--ok)'], SOLD: ['Sold', 'background:var(--neutral);color:var(--muted2)'], CUS: ['Customs hold', 'background:var(--warnbg);color:var(--warn)'] };
    const calc = (c) => {
      const end = c.ret ? Date.parse(c.ret) : TODAY;
      const used = Math.max(0, Math.round((end - Date.parse(c.start)) / day));
      const bill = Math.max(0, used - c.free);
      const tiers = TIERS.map(([label, band, a, b, rate]) => { const d = Math.max(0, Math.min(bill, b) - a + 1); return { label, band: b > 999 ? 'day ' + a + '+' : 'days ' + a + '–' + b, days: d, amt: m(d * rate), v: d * rate }; });
      const total = tiers.reduce((x, t) => x + t.v, 0);
      const invEnd = s.done[c.id] === 'final' ? end : (s.done[c.id] === 'prog' ? TODAY : (c.invTo ? Date.parse(c.invTo) : null));
      const billedDays = invEnd ? Math.max(0, Math.round((invEnd - Date.parse(c.start)) / day) - c.free) : 0;
      const unbilled = Math.max(0, bill - billedDays);
      const stopped = c.st === 'SOLD' || c.st === 'CUS';
      let act = ['—', 'background:var(--neutral);color:var(--muted)'];
      if (s.done[c.id] === 'final') act = ['Final invoiced', 'background:var(--okbg);color:var(--ok)'];
      else if (stopped) act = ['Invoicing stopped', 'background:var(--neutral);color:var(--muted)'];
      else if (c.st === 'MT' && unbilled > 0) act = ['Final DD due', 'background:var(--warnbg);color:var(--warn)'];
      else if (c.st === 'OP' && used >= c.free + 7 && unbilled > 0) act = [s.mode === 'prog' ? 'Progressive due' : 'Proforma due', 'background:var(--warnbg);color:var(--warn)'];
      else if (c.st === 'OP' && used < c.free) act = ['In free time', 'background:var(--okbg);color:var(--ok)'];
      else if (c.st === 'OP') act = ['Before start point', 'background:var(--neutral);color:var(--muted)'];
      if ((c.id === 'd9' || c.id === 'd14') && !s.fixed[c.id]) act = ['Milestone clash', 'background:var(--badbg);color:var(--bad)'];
      return { used, bill, tiers, total, unbilled, act, stopped, invEnd };
    };
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const rows = C.map((c) => { const k = calc(c), on = s.selected === c.id; return { ...c, used: k.used, unbilled: k.unbilled, startText: fmt(Date.parse(c.start)),
      toText: k.invEnd ? fmt(k.invEnd) : '—', stText: ST[c.st][0], stChip: ST[c.st][1], act: k.act[0], actChip: k.act[1],
      cell: on ? 'background:var(--tint);' : '', edge: on ? selEdge : '', select: () => this.setState({ selected: c.id }) }; });
    const c = C.find((x) => x.id === s.selected) || C[0];
    const k = calc(c);
    const extra = (s.lolo[c.id] ? [['[LOLO charge]', 'Additional charge', '—']] : []).concat(s.dmg[c.id] ? [['[Damage fee]', 'Container damage recovery', '—']] : []).concat(s.adv[c.id] ? [['[Advance DD / deposit]', 'Advance before VD status', '—']] : []);
    const doneInv = s.done[c.id] === 'prog' ? [['SINOD26' + String(2700 + C.indexOf(c)).padStart(5, '0'), s.mode === 'prog' ? 'Progressive' : (s.conv[c.id] ? 'Proforma → final (paid)' : 'Proforma'), 'to ' + fmt(TODAY)]] : (s.done[c.id] === 'final' ? [['SINOD26' + String(2750 + C.indexOf(c)).padStart(5, '0'), 'Final', 'to ' + fmt(Date.parse(c.ret))]] : []);
    const invs = c.invs.concat(doneInv).map(([no, kind, period]) => ({ no, kind, period, amt: '' })).concat(extra.map(([no, kind]) => ({ no, kind, period: 'added to next DD invoice', amt: '' })));
    const CLASH = ['d9', 'd14'];
    const clash = CLASH.indexOf(c.id) >= 0 && !s.fixed[c.id];
    const st0 = Date.parse(c.start);
    const MS = c.kind === 'Demurrage'
      ? [['Discharge', clash ? null : st0 - 2 * day], ['Gate-out full', st0], ['Gate-in empty', c.ret ? Date.parse(c.ret) : null], ['Clock', c.ret ? 'Stopped' : 'Running']]
      : [['Discharge', clash ? null : st0 - 1 * day], ['Gate-out full', st0], ['Gate-in empty', c.ret ? Date.parse(c.ret) : null], ['Clock', c.ret ? 'Stopped' : 'Running']];
    const miles = MS.map(([label, v]) => { const missing = v === null; const txt = typeof v === 'string' ? v : (missing ? (label === 'Discharge' && clash ? 'Missing' : 'Pending') : fmt(v));

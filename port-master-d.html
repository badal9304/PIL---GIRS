.kf .input,.kf .select{width:100%;padding-inline-start:12px;background:var(--surface)}
.kf textarea.input{height:auto;min-height:72px;padding:8px 12px;resize:vertical;line-height:20px}

.kf .kh{font-size:12px;color:var(--muted)}
.kf .ke{font-size:12px;color:var(--bad);font-weight:500}
.kf.bad .input,.kf.bad .select{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.kbanner{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;padding:10px 14px;border-radius:8px;background:var(--tint);color:var(--accent2);font-size:13px;line-height:18px}
.kbanner.err{background:var(--badbg);color:var(--bad)}
.kbtn-danger{background:var(--bad);border-color:var(--bad);color:var(--onaccent)}

body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:4px;font-size:13px;font-weight:500}</style>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { type: 'MISC', reason: 'misc', bl: 'BL-SG-24011', dir: 'O', ccy: 'SGD', idate: 'today', bp: 'shipper', lines: [['Lift on / lift off (LOLO)', 'Catalogue', '180.00'], ['[Ancillary charge A]', 'Catalogue', '']], notice: '', done: 0 };
  }
  renderVals() {
    const s = this.state;
    const T = [['Freight', 'F'], ['DET / DEM', 'D'], ['MISC', 'F'], ['Proforma', 'F']];
    const types = T.map(([k]) => ({ label: k, on: s.type === k ? 'true' : 'false', bg: s.type === k ? 'var(--surface)' : 'transparent', pick: () => this.setState({ type: k }) }));
    const ct = (T.find((x) => x[0] === s.type) || T[0])[1];
    const num = 'SIN' + s.dir + ct + '26' + String(2420 + s.done).padStart(5, '0') + (s.type === 'Proforma' ? 'PRF' : '');
    const lines = s.lines.map(([desc, src, amt], i) => ({ desc, src, amt,
      setAmt: (e) => { const L = s.lines.slice(); L[i] = [desc, src, e.target.value]; this.setState({ lines: L }); },
      remove: () => this.setState({ lines: s.lines.filter((_, j) => j !== i) }) }));
    const sum = s.lines.reduce((a, l) => a + (parseFloat(l[2]) || 0), 0);
    const missingAmt = s.lines.some((l) => !(parseFloat(l[2]) > 0));
    const C = [
      ['Exchange rate available', true], ['Billing party customer code', true], ['Customer details valid', true], ['Tax structure resolved', true],
      ['No Generic PC linked on B/L', true], ['Charges available with amounts', s.lines.length > 0 && !missingAmt], ['Credit status · no hold', true]
    ];
    const checks = C.map(([label, ok]) => ({ label, state: ok ? 'Passed' : 'Missing', icon: ok ? '✓' : '×', bg: ok ? 'var(--okbg)' : 'var(--badbg)', fg: ok ? 'var(--ok)' : 'var(--bad)' }))
      .concat([{ label: 'Sanction / blacklist screening', state: 'Clear', icon: '✓', bg: 'var(--okbg)', fg: 'var(--ok)' }]);
    const blocked = C.some((c) => !c[1]);
    const ccyLabel = s.ccy === 'THIRD' ? '[Third currency]' : s.ccy;
    return {
      types, numPreview: num, reason: s.reason, setReason: (e) => this.setState({ reason: e.target.value, type: e.target.value === 'misc' ? 'MISC' : s.type }),
      bl: s.bl, setBl: (e) => this.setState({ bl: e.target.value }), dir: s.dir, setDir: (e) => this.setState({ dir: e.target.value }),
      ccy: s.ccy, setCcy: (e) => this.setState({ ccy: e.target.value }), ccyLabel, idate: s.idate, setIdate: (e) => this.setState({ idate: e.target.value }), isBack: s.idate === 'back',
      bp: s.bp, setBp: (e) => this.setState({ bp: e.target.value }),
      lines, noLines: lines.length === 0, subtotal: sum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      addCharge: (e) => { const v = e.target.value; if (!v) return; e.target.value = ''; this.setState({ lines: s.lines.concat([[v, 'Catalogue', '']]) }); },
      checks, blocked, preText: blocked ? 'Not ready' : 'Ready', preChip: blocked ? 'background:var(--badbg);color:var(--bad)' : 'background:var(--okbg);color:var(--ok)',
      draft: () => this.setState({ notice: 'Draft saved for ' + s.bl + '.' }),
      generate: () => this.setState({ done: s.done + 1, notice: num + ' generated for ' + s.bl + (s.idate === 'back' ? ' (dated 09 Nov 2026 · 1-day backdate for GFS).' : '.') + ' Sent for distribution.' }),
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' })
    };
  }
}

class Component extends GirsPage {
  constructor(p) {
    super(p);
    let sb = false, th = 'light', hub = 'SIN', ent = 'PIL';
    try { sb = localStorage.getItem('girs.sb') === '1'; th = localStorage.getItem('girs.th') || 'light'; hub = localStorage.getItem('girs.hub') || 'SIN'; ent = localStorage.getItem('girs.ent') || 'PIL'; } catch (e) {}
    let lg = 0; try { lg = +(localStorage.getItem('girs.lg') || 0); } catch (e) {}
    this.state = Object.assign({}, this.state, { __sb: sb, __th: th, __hub: hub, __ent: ent, __q: '', __um: false, __lg: lg, __toast: '' });
  }
  renderVals() {
    const v = super.renderVals();

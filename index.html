/* v4 */
.hm-nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hm-dn{display:flex;align-items:center;gap:8px}
.hm-dp{position:relative}
.hm-dpb{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:280px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.hm-dpb span{flex:1 1 auto}
.hm-dpb svg{color:var(--muted)}
.hm-dpb:hover{border-color:var(--bdh)}
.hm-dpb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hm-dpb[aria-expanded=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hm-cal{position:absolute;z-index:60;top:calc(100% + 6px);inset-inline-start:0;display:grid;grid-template-columns:160px 240px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 12px 32px rgba(22,26,33,.18);overflow:hidden}
.hm-pre{list-style:none;margin:0;padding:6px;border-inline-end:1px solid var(--line2);background:var(--sub)}
.hm-pre button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 10px;border-radius:4px;font-size:13px;cursor:pointer}
.hm-pre button:hover{background:var(--hover2)}
.hm-pre button[aria-pressed=true]{background:var(--tint);color:var(--accent2);font-weight:500}
.hm-cust{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.hm-ch{font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:2px}
.hm-cust .input{height:32px}
.hm-cust p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.hm-ov{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:0;height:36px;padding:0 14px;border:1px solid var(--warnbd);border-radius:6px;background:var(--warnbg);font-size:13px;cursor:pointer}
.hm-ov b{color:var(--warn)}
.hm-ov .mu{font-size:12px}
.hm-ovd{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-inline-end:8px}
.hm-ov:hover{border-color:var(--warn)}
.hm-ov:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hm-ov.on{box-shadow:inset 0 0 0 1px var(--warn)}
.hm-ov.none{border-color:var(--line);background:var(--surface)}
.hm-ov.none b,.hm-ov.none .hm-ovd{color:var(--muted);background:var(--line)}
.hm-rib{display:flex;align-items:stretch;padding:6px}
.hm-ra{all:unset;box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;width:32px;border-radius:6px;color:var(--muted);cursor:pointer}
.hm-ra:hover{background:var(--hover2);color:var(--ink)}
.hm-ra:focus-visible{outline:2px solid var(--accent)}
.hm-rds{flex:1 1 auto;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px}
.hm-rd{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:6px;cursor:pointer;min-width:0;position:relative}
.hm-rd:hover{background:var(--hover2)}
.hm-rd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hm-rw{font-size:11px;color:var(--muted)}
.hm-rd b{font-size:13px;font-weight:600;line-height:18px}
.hm-rd small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hm-rbx{display:flex;align-items:flex-end;width:100%;height:22px;margin:4px 0 2px;border-bottom:1px solid var(--line2)}
.hm-rb{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--accent);opacity:.85}
.hm-rb.late{background:var(--warn)}
.hm-rb.done{background:var(--ok)}
.hm-rb.fut{background:var(--line)}
.hm-rd.wk{background:var(--sub)}
.hm-rs{width:100%;height:6px;margin:6px 0 4px}
.hm-rd.today .hm-rw{color:var(--accent2);font-weight:600}
.hm-rd.late small{color:var(--warn)}
.hm-rd.on{background:var(--tint2);box-shadow:inset 0 0 0 1px var(--accent)}
.hm-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.hm-main{min-width:0;overflow:hidden}
.hm-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.hm-th{display:flex;align-items:center;gap:12px;padding:12px 16px}
.hm-th .card-title{margin-inline-end:auto}
.hm-chips{display:flex;align-items:center;gap:8px;padding:0 16px 12px}
.hm-chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:14px;font-size:12px;font-weight:500;color:var(--muted2);cursor:pointer}
.hm-chip span{font-weight:600;color:var(--ink)}
.hm-chip:hover{border-color:var(--bdh)}
.hm-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hm-chip[aria-pressed=true]{border-color:var(--accent);background:var(--tint2);color:var(--accent2)}
.hm-gt{margin:0 0 0 auto;font-size:13px}
.hm-bulk{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--tint2);border-bottom:1px solid var(--tintbd)}
.hm-bulk b{font-size:13px;margin-inline-end:8px}
.hm-tw{overflow:auto;border-top:1px solid var(--line2)}
.hm-vtab{width:100%}
.hm-vtab td{vertical-align:top;padding-top:10px;padding-bottom:10px}
.hm-cb{width:36px;padding-inline:12px 4px !important}
.hm-sb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit}
.hm-sb span{font-size:11px;color:var(--accent2)}
.hm-sb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.r .hm-sb{flex-direction:row}
.hm-gh th{padding:8px 12px !important;background:var(--sub);text-align:start;font-weight:400;border-top:1px solid var(--line2)}
.hm-gh b{font-size:13px;font-weight:600;margin-inline-end:10px}
.hm-gh span{font-size:12px;color:var(--muted)}
.hm-iv{display:block;font-size:13px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.hm-vtab .hm-stk{height:6px}
.hm-due.nd{color:var(--muted);font-size:13px}
.hm-vw{font-size:12px}
.lst tr.on td{background:var(--tint2)}
.hm-rh{display:flex;flex-direction:column;gap:2px;padding:14px 16px 10px}
.hm-rh h2{margin:0;font-size:14px;font-weight:600}
.hm-rh span{font-size:12px;color:var(--muted)}
.hm-gll{list-style:none;margin:0;padding:0 16px}
.hm-gll li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;padding:7px 0;border-top:1px solid var(--line2);font-size:13px}
.hm-gll li span{display:inline-flex;align-items:center;gap:8px;color:var(--muted2)}
.hm-gll li b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hm-gll li small{grid-column:1 / -1;font-size:12px;color:var(--muted);padding-inline-start:16px}
.hm-gl .hm-stk.lg{margin:8px 16px 0;height:8px}
.hm-pct{margin:6px 16px 0;font-size:12px;color:var(--muted)}
.hm-full{display:flex;width:calc(100% - 32px);margin:12px 16px 16px;justify-content:center}
.hm-rsn{list-style:none;margin:0;padding:0 0 4px}
.hm-rsn li{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-top:1px solid var(--line2)}
.hm-rt{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hm-rt b{font-weight:500}
.hm-rt span{font-weight:600;color:var(--warn);font-variant-numeric:tabular-nums}
.hm-rm{font-size:12px;color:var(--muted)}
.hm-ra2{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:4px}
.hm-ra2 .hm-fs{margin-inline-end:auto;color:var(--ok)}
.hm-ds4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hm-ds4 div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.hm-ds4 span{font-size:12px;color:var(--muted)}
.hm-ds4 b{font-size:18px;font-weight:600}
.hm-srch.wide{width:100%;margin-bottom:10px}
.hm-dpg{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.hm-dpg span:first-child{margin-inline-end:auto}
.hm-drw{width:820px}

.bm-st{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:500}
.bm-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;margin-inline-end:4px;border-radius:10px;font-size:12px;font-weight:500;background:var(--tint);color:var(--accent2)}
.bm-tag.p-pay{background:var(--neutral);color:var(--ink)}
.bm-tag.p-inv{background:var(--okbg);color:var(--ok)}
.bm-tag.p-ref{background:var(--aibg);color:var(--ai)}
.bm-gapc{flex:none;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--warnbg);color:var(--warn)}
.bm-okc{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:10px;background:var(--okbg);color:var(--ok)}
.bm1-cc{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:24px;border-radius:4px;background:var(--neutral);font-size:12px;font-weight:600;color:var(--ink)}
.bm1-cn{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;gap:2px}
.bm1-cn b{font-size:14px;font-weight:500;line-height:18px}
.bm1-cn small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm1{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.bm1-side{position:sticky;top:16px;padding:0;overflow:hidden}
.bm1-sh{padding:12px;border-bottom:1px solid var(--line2)}
.bm1-srch{position:relative}
.bm1-srch svg{position:absolute;inset-inline-start:10px;top:50%;margin-top:-8px;color:var(--muted)}
.bm1-srch .input{padding-inline-start:34px}
.bm1-list{list-style:none;margin:0;padding:6px}
.bm1-c{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:6px;cursor:pointer}
.bm1-c:hover{background:var(--hover2)}
.bm1-c:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bm1-c[aria-current=true]{background:var(--tint2);box-shadow:inset 3px 0 0 var(--accent)}
.bm1-c[aria-current=true] .bm1-cc{background:var(--accent);color:var(--onaccent)}
.bm1-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bm1-head{display:flex;align-items:center;gap:12px}
.bm1-head h2{margin:0;font-size:18px;font-weight:600;line-height:24px}
.bm1-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.bm1-head p.true{color:var(--warn)}
.bm-mx{width:100%;table-layout:fixed}
.bm-mx th small{display:block;margin-top:2px;font-size:11px;font-weight:400;color:var(--muted);white-space:normal}
.bm-mx td{vertical-align:top;padding:10px 12px;white-space:normal}
.bm-mx thead th{vertical-align:top;padding-top:10px;padding-bottom:10px}
.bm-ccy{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:start;vertical-align:top;padding:16px 12px !important}
.bm-asg{display:flex;flex-direction:column;gap:4px}
.bm-asg small{font-size:12px;color:var(--muted)}
.bm-asg.gap .select{border-color:var(--warnbd);background:var(--warnbg)}
.bm-asg.gap small{color:var(--warn);font-weight:500}
.bm2-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.bm2-stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.bm2-stat span{font-size:12px;color:var(--muted)}
.bm2-stat b{font-size:24px;font-weight:600;line-height:30px}
.bm2-stat.warn{box-shadow:inset 3px 0 0 var(--warn)}
.bm2-stat.warn b{color:var(--warn)}
.bm2-fil{display:flex;align-items:center;gap:10px}
.bm2-fil .cm2-sel{width:190px}
.bm2-fil .cm2-ck{margin:0}
.bm2-mx td{padding:8px}
.bm2-mx tr.bm2-grp > *{border-top:1px solid var(--line)}
.bm2-mx tbody tr:first-child > *{border-top:0}
.bm2-cty{vertical-align:top;text-align:start;padding:12px !important;background:var(--surface)}
.bm2-cty{display:table-cell}
.bm2-cty .bm1-cc{margin-bottom:6px}
.bm2-cell{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;min-height:62px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer}
.bm2-cell:hover{border-color:var(--accent);background:var(--tint2)}
.bm2-cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bm2-cell b{font-size:13px;font-weight:500;line-height:18px}
.bm2-cell span{font-size:12px;color:var(--muted2)}
.bm2-cell i{font-style:normal;font-size:11px;color:var(--accent2)}
.bm2-cell.gap{justify-content:center;border-style:dashed;border-color:var(--warnbd);background:var(--warnbg)}
.bm2-cell.gap b{color:var(--warn)}
.bm2-cell.gap span{color:var(--warn)}
.bm-pm{width:min(640px,calc(100vw - 64px))}
.bm-pms{margin:2px 0 0;font-size:12px;color:var(--muted)}
.bm-opts{display:flex;flex-direction:column;gap:8px}
.bm-opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer}
.bm-opt:hover{border-color:var(--bdh)}
.bm-opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bm-opt[aria-checked=true]{border-color:var(--accent);background:var(--tint2);box-shadow:inset 0 0 0 1px var(--accent)}
.bm-rd{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bdh);box-sizing:border-box}
.bm-opt[aria-checked=true] .bm-rd{border:5px solid var(--accent)}
.bm-ob{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.bm-ob b{font-size:14px;font-weight:500}
.bm-ob small{font-size:12px;color:var(--muted)}
.bm-ob .bm-also{color:var(--muted2)}
.bm-oa{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px}
.bm-oa i{font-style:normal;font-size:11px;color:var(--accent2)}
.bm-empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

.bm-row4{grid-template-columns:repeat(2,minmax(0,1fr))}
.cmc-alias{padding:0;overflow:hidden}
.cmc-alias .cmc-at{margin:0;border:0;border-radius:0}
.cmc-alias .cm2-ah{padding:14px 16px;font-size:14px}
.cmc-alias .cm2-man{margin:0;padding:12px 16px;border-top:1px solid var(--line2);display:flex}

/* View/Update popup */
.cmc-bd{all:unset;position:fixed;inset:0;z-index:200;background:transparent}
.cmc-modal{position:fixed;z-index:201;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1480px,calc(100vw - 64px));max-height:calc(100% - 64px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 0 0 200vmax rgba(22,26,33,.45),0 24px 64px rgba(22,26,33,.28);overflow:hidden}
.theme[data-theme=dark] .cmc-modal{box-shadow:0 0 0 200vmax rgba(0,0,0,.55),0 24px 64px rgba(0,0,0,.6)}
.cmc-mh{flex:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 12px 0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.cmc-mh h2{margin:0;font-size:16px;font-weight:600;line-height:22px}
.cmc-x{margin-inline-start:auto;width:32px}
.cmc-mb{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 20px}
.cmc-mf{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line)}
.cmc-mf .btn{min-width:96px}
</style>
</helmet>
<div class="theme groot" data-theme="{{shell.theme}}"  style="zoom: {{shell.zoom}}; height: {{shell.rootH}}; min-height: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="height: 3px; background: var(--brand); flex: none"></div>
  <div style="flex: 1 1 auto; min-height: 0; display: flex">
    <sc-if value="{{shell.drawerOpen}}" hint-placeholder-val="{{ false }}"><div class="gscrim" onClick="{{shell.closeDrawer}}" aria-hidden="true"></div></sc-if>
    <aside id="gside" class="gside" data-drawer="{{shell.drawer}}" aria-label="Side panel" style="flex: none; width: {{shell.sbW}}; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; transition: width .18s ease">
      <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line2); box-sizing: border-box; {{shell.logoRow}}">
        <span class="glogo" style="display: inline-flex; border-radius: 4px; padding: 2px 4px"><img src="pil-logo.png" alt="PIL" style="display: block; {{shell.logo}}"></span>
        <span style="width: 1px; height: 20px; background: var(--line); {{shell.hide}}"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); {{shell.hide}}">GIRS</span>
        <button class="btn btn-icon btn-sm gdclose" onClick="{{shell.closeDrawer}}" aria-label="Close menu" style="margin-inline-start: auto; width: 32px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="gdctx" style="flex: none; flex-direction: column; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line2)">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px">
          <div style="position: relative"><label for="dhub" class="sr">Hub</label><select id="dhub" class="select select-sm" value="{{shell.hub}}" onChange="{{shell.setHub}}" style="width: 100%"><option value="SIN">Singapore · SIN</option><option value="NSA">India · NSA</option><option value="LCH">Thailand · LCH</option><option value="PKG">Malaysia · PKG</option><option value="JED">Saudi Arabia · JED</option><option value="ZLO">Mexico · ZLO</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          <div style="position: relative"><label for="dent" class="sr">Entity</label><select id="dent" class="select select-sm" value="{{shell.ent}}" onChange="{{shell.setEnt}}" style="width: 100%"><option value="PIL">PIL</option><option value="MELL">MELL</option><option value="MSC">MSC</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span class="chip" title="Fiscal period" style="background: var(--okbg); color: var(--ok); height: 28px; border-radius: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--okdot)"></span>[Fiscal period] · Open</span>
        </div>
      </div>
      <nav aria-label="Screens" data-c="{{shell.cA}}" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 16px">
        <sc-if value="{{shell.flyOn}}" hint-placeholder-val="{{ false }}"><div class="ng-bd" onClick="{{shell.flyClose}}" aria-hidden="true"></div></sc-if>
        <a href="index.html" class="nav-grp nav-grp-on" aria-current="page" title="{{shell.l.nHome}}" style="{{shell.grp}}"><svg class="ng-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"></path></svg><span class="ng-l" style="{{shell.hide}}">{{shell.l.nHome}}</span></a>

          <p><span class="mono">{{drw.route}}</span> · {{drw.date}}</p>
        </div>
        <button class="btn btn-icon btn-sm" aria-label="Close" onClick="{{drw.close}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div class="hm-db">
        <div class="hm-ds4"><sc-for list="{{drw.stats}}" as="t" hint-placeholder-count="4"><div><span>{{t.l}}</span><b>{{t.v}}</b></div></sc-for></div>
        <div class="hm-stk lg" aria-hidden="true"><i class="inv" style="{{drw.bI}}"></i><i class="rdy" style="{{drw.bR}}"></i><i class="blk" style="{{drw.bB}}"></i></div>

          </div>
        </sc-if>
        <div class="hm-dsec">
          <div class="hm-dsh"><h3>B/Ls</h3>
            <div class="hm-seg sm" role="group" aria-label="Filter B/Ls"><sc-for list="{{drw.filters}}" as="f" hint-placeholder-count="4"><button aria-pressed="{{f.cur}}" onClick="{{f.pick}}">{{f.l}}<span>{{f.n}}</span></button></sc-for></div>
          </div>
          <div class="hm-srch wide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input class="input" placeholder="Search B/L no. or billing party" aria-label="Search B/Ls" value="{{drw.q}}" onInput="{{drw.onQ}}" autocomplete="off" spellcheck="false"></div>
          <table class="lst hm-blt">
            <thead><tr><th scope="col">B/L No.</th><th scope="col">Billing party</th><th scope="col" class="r">Ctr</th><th scope="col" class="r">Amount</th><th scope="col">Status</th></tr></thead>
            <tbody><sc-for list="{{drw.bls}}" as="b" hint-placeholder-count="8"><tr><td class="mono">{{b.bl}}</td><td>{{b.cust}}</td><td class="r">{{b.ctr}}</td><td class="r">{{b.amt}}</td><td><span class="{{b.stC}}">{{b.st}}</span><small class="hm-sub">{{b.note}}</small></td></tr></sc-for></tbody>
          </table>
          <sc-if value="{{drw.noBls}}" hint-placeholder-val="{{ false }}"><div class="hm-empty">{{drw.noBlsL}}</div></sc-if>
          <sc-if value="{{drw.pg.show}}" hint-placeholder-val="{{ false }}"><div class="hm-dpg"><span>{{drw.pg.text}}</span><button class="btn btn-sm pbtn" aria-label="Previous page" disabled="{{drw.pg.prevDis}}" onClick="{{drw.pg.prev}}">‹</button><span class="mono">{{drw.pg.pos}}</span><button class="btn btn-sm pbtn" aria-label="Next page" disabled="{{drw.pg.nextDis}}" onClick="{{drw.pg.next}}">›</button></div></sc-if>
        </div>
      </div>
      <div class="cmc-mf">
        <a class="btn" href="{{drw.list}}" style="margin-inline-end: auto; text-decoration: none">Open in Invoice List</a>
        <button class="btn" onClick="{{drw.close}}">Close</button>
        <sc-if value="{{drw.canGen}}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary" onClick="{{drw.gen}}">{{drw.genL}}</button></sc-if>
      </div>
    </aside>
  </sc-if>
  <sc-if value="{{cf.show}}" hint-placeholder-val="{{ false }}">
    <button class="cmc-bd" tabindex="-1" aria-label="Close" onClick="{{cf.cancel}}" style="z-index: 210"></button>
    <div class="cmc-modal hm-cfm" role="dialog" aria-modal="true" aria-labelledby="hm-ct">
      <div class="cmc-mh"><h2 id="hm-ct">{{cf.title}}</h2></div>
      <div class="cmc-mb">
        <dl class="hm-dl"><sc-for list="{{cf.rows}}" as="r" hint-placeholder-count="4"><dt>{{r.l}}</dt><dd>{{r.v}}</dd></sc-for></dl>
        <p class="hm-cn">{{cf.note}}</p>
      </div>
      <div class="cmc-mf"><button class="btn" onClick="{{cf.cancel}}">Cancel</button><button class="btn btn-primary" onClick="{{cf.ok}}">Generate</button></div>
    </div>
  </sc-if>

  <sc-if value="{{rate.show}}" hint-placeholder-val="{{ false }}">
    <button class="cmc-bd" tabindex="-1" aria-label="Close" onClick="{{rate.cancel}}" style="z-index: 210"></button>
    <div class="cmc-modal hm-cfm" role="dialog" aria-modal="true" aria-labelledby="hm-rt">
      <div class="cmc-mh"><h2 id="hm-rt">Enter rate of exchange</h2></div>
      <div class="cmc-mb">
        <dl class="hm-dl"><dt>Currency pair</dt><dd>{{rate.pair}}</dd><dt>Rate date</dt><dd>{{rate.date}}</dd></dl>
        <label class="lbl" for="hm-rv">Rate received from Treasury</label>
        <input id="hm-rv" class="input" inputmode="decimal" placeholder="e.g. 1.6842" value="{{rate.val}}" onInput="{{rate.on}}" autocomplete="off">
        <p class="hm-cn">{{rate.info}} Entering a rate manually is recorded in the audit trail.</p>
      </div>
      <div class="cmc-mf"><button class="btn" onClick="{{rate.cancel}}">Cancel</button><button class="btn btn-primary" onClick="{{rate.ok}}">Apply rate</button></div>
    </div>
  </sc-if>

  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="gtoast" style="position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 520px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box">{{shell.toast}}<button class="btn btn-sm" onClick="{{shell.closeToast}}">Close</button></div>
  </sc-if>
</div>
</script>
<script type="text/x-dc" id="logic">
// Home — port / office invoicing workspace. Shipment data arrives from LMS.
// Voyage Invoicing: export voyages (…E) loading at my port and import voyages (…I) discharging at my port, any date.
// D&D Billing: containers given to customers; detention / demurrage to invoice.
// Sample data is generated per location and date, so any date can be opened. "Today" is fixed for the prototype.
const HM_TODAY = '2026-11-20';
const HM_HUB = { SIN: ['Singapore', 'SGSIN', 'SG', 11], NSA: ['India', 'INNSA', 'IN', 7], LCH: ['Thailand', 'THLCH', 'TH', 5], PKG: ['Malaysia', 'MYPKG', 'MY', 6], JED: ['Saudi Arabia', 'SAJED', 'SA', 4], ZLO: ['Mexico', 'MXZLO', 'MX', 3] };
const HM_CCY = { SG: 'SGD', NZ: 'NZD', MY: 'MYR', CN: 'CNY', IN: 'INR', TH: 'THB', SA: 'SAR', MX: 'MXN', AE: 'AED', ID: 'IDR', VN: 'VND', KR: 'KRW', JP: 'JPY', AU: 'AUD', HK: 'HKD', LK: 'LKR', BD: 'BDT' };
const HM_PORTS = ['NZAKL', 'CNSHA', 'INNSA', 'MYPKG', 'THLCH', 'SAJED', 'AEJEA', 'IDJKT', 'VNSGN', 'KRPUS', 'JPTYO', 'AUSYD', 'HKHKG', 'LKCMB', 'BDCGP', 'CNNGB', 'SGSIN'];
const HM_VSL = [['CMA CGM LEKKI', 'LK', 'NZS'], ['KOTA LEMBAH', 'KL', 'NZS'], ['NORFOLK', 'NF', 'NZS'], ['KOTA PEMIMPIN', 'KP', 'IAX'], ['KOTA SEJATI', 'KS', 'CNS'], ['KOTA MAKMUR', 'KM', 'RGX'], ['KOTA GEMILANG', 'KG', 'RSS'], ['KOTA HAKIM', 'KH', 'IAX'], ['KOTA CAHAYA', 'KC', 'MCS'], ['CMA CGM KAURI', 'KR', 'NZS'], ['KOTA PERDANA', 'PD', 'KCX'], ['KOTA RAKYAT', 'RK', 'CNS'], ['KOTA SATRIA', 'ST', 'RGX'], ['KOTA LAYANG', 'LY', 'IDS'], ['KOTA NASRAT', 'NS', 'RSS'], ['KOTA JUBAH', 'JB', 'KCX']];
const HM_CUST = ['Straits Harbour Logistics', 'Meridian Agro Exports', 'Andaman Bay Traders', 'Kinabalu Home Furnishings', 'Orchid Lane Polymers', 'Southern Cross Timber', 'Harbourline Foods', 'Pacific Rim Textiles', 'Lion City Electronics', 'Tasman Dairy Co-op', 'Mekong Rice Traders', 'Coral Sea Chemicals'];
const HM_MISS = ['Charges', 'Billing party', 'Customer tax ID', 'Cargo / EDI message'];
const HM_BLST = { inv: ['Invoiced', 'done'], ready: ['Ready to generate', 'ok'], roe: ['ROE not received', 'warn'], nod: ['Data not received', 'warn'], hold: ['Split-payer unconfirmed', 'warn'] };
// fixed figures from the client scenario (PDF): invoiced, ready, roe missing, data not received, split-payer
const HM_FIX = { SGSIN: [['0LK5SS', 'E', 'NZAKL', 1000, 1850, [0, 935, 25, 40, 0]], ['1KP8RR', 'I', 'INNSA', 520, 620, [310, 154, 30, 20, 6]]] };

const hmN = (n) => Math.round(n).toLocaleString('en-US');
const hmUsd = (v) => 'USD ' + (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e4 ? (v / 1e3).toFixed(1) + 'K' : hmN(v));
const hmD = (iso) => new Date(iso + 'T00:00:00');
const hmIso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hmAdd = (iso, n) => { const d = hmD(iso); d.setDate(d.getDate() + n); return hmIso(d); };
const hmDiff = (a, b) => Math.round((hmD(b) - hmD(a)) / 864e5);
const hmFmt = (iso, o) => hmD(iso).toLocaleDateString('en-GB', o || { weekday: 'short', day: 'numeric', month: 'short' });
const hmRnd = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; };
const hmTime = () => { try { return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
const HM_CACHE = {};
// Voyages that load (E) or discharge (I) at a port on a date.
const hmDay = (port, date) => {
  const key = port + date;
  if (HM_CACHE[key]) return HM_CACHE[key];
  const hub = Object.values(HM_HUB).find((h) => h[1] === port) || HM_HUB.SIN, rnd = hmRnd(key), dow = hmD(date).getDay();
  const n = Math.max(1, Math.round(hub[3] * (dow === 0 || dow === 6 ? 0.55 : 1) * (0.7 + rnd() * 0.6)));
  const age = hmDiff(date, HM_TODAY);
  const list = [];
  const make = (base, dir, other, bls, avg, fixed, vsl) => {
    const r = hmRnd(base + dir + date);
    let st;
    if (fixed) st = fixed.slice();
    else if (age > 0) {
      const left = age > 7 || r() < 0.72 ? 0 : Math.max(1, Math.round(bls * (0.01 + r() * 0.06)));
      const roe = Math.round(left * r() * 0.6), hold = r() < 0.15 ? Math.min(left - roe, 1 + Math.round(r() * 4)) : 0, ready = Math.round((left - roe - hold) * r() * 0.4);
      st = [bls - left, ready, roe, left - roe - hold - ready, hold];
    } else if (age === 0) {
      const inv = Math.round(bls * r() * 0.55), roe = Math.round(bls * r() * 0.04), nod = Math.round(bls * r() * 0.06), hold = r() < 0.2 ? Math.round(r() * 6) : 0;
      st = [inv, Math.max(0, bls - inv - roe - nod - hold), roe, nod, hold];
    } else st = [0, 0, 0, 0, 0];
    const here = port, pol = dir === 'E' ? here : other, pod = dir === 'E' ? other : here;
    const ccy = HM_CCY[here.slice(0, 2)] || 'USD';
    const ent = r() < 0.86 ? 'PIL' : r() < 0.7 ? 'MELL' : 'MSC';
    list.push({ id: base + dir + '@' + date, no: base + dir, dir, vessel: vsl[0], svc: vsl[2], ent: fixed ? 'PIL' : ent, pol, pod, here, other, date, bls, avg, st, pair: 'USD → ' + ccy });
  };
  if (date === HM_TODAY && HM_FIX[port]) HM_FIX[port].forEach(([b, dir, other, bls, avg, f]) => make(b, dir, other, bls, avg, f, HM_VSL.find((v) => v[1] === b.slice(1, 3)) || HM_VSL[0]));
  for (let i = 0; i < n; i++) {
    const v = HM_VSL[Math.floor(rnd() * HM_VSL.length)], other = HM_PORTS.filter((x) => x !== port)[Math.floor(rnd() * (HM_PORTS.length - 1))];
    const base = String(Math.floor(rnd() * 9)) + v[1] + String(1 + Math.floor(rnd() * 8)) + String.fromCharCode(65 + Math.floor(rnd() * 26)) + String.fromCharCode(65 + Math.floor(rnd() * 26));
    make(base, rnd() < 0.5 ? 'E' : 'I', other, 120 + Math.round(rnd() * 980), 500 + Math.round(rnd() * 1600), null, v);
  }
  HM_CACHE[key] = list;
  return list;
};

// D&D containers (snapshot)
const HM_SLAB = { '20GP': [[5, 25], [99, 45]], '40HC': [[5, 40], [99, 75]], '40RF': [[3, 90], [99, 140]] };
const HM_DDST = { ready: ['Ready to invoice', 'ok'], roe: ['ROE not received', 'warn'], tariff: ['D&D tariff missing', 'warn'], milestone: ['Milestone conflict', 'warn'], waiver: ['Waiver approval pending', 'warn'], out: ['With customer', 'info'], invoiced: ['Invoiced', 'done'] };
const HM_DDR = { roe: ['Treasury · ROE feed', 'Request ROE'], tariff: ['Pricing · tariff set-up', 'Request tariff'], milestone: ['Equipment control · LMS', 'Raise LMS check'], waiver: ['Credit control · approver', 'Chase approval'] };
const hmSlab = (sz, over) => { let left = over, amt = 0; const parts = []; (HM_SLAB[sz] || [[99, 50]]).forEach(([d, r]) => { const n = Math.min(left, d); if (n > 0) { amt += n * r; parts.push(n + ' d × ' + r); left -= n; } }); return { amt, txt: parts.join(' + ') }; };
const hmDD = (cc) => {
  const key = 'dd' + cc;
  if (HM_CACHE[key]) return HM_CACHE[key];
  const rnd = hmRnd(key), out = [], sizes = ['20GP', '40HC', '40HC', '40RF'], pre = ['PCIU', 'PCIU', 'TGHU', 'TCLU'];
  const pickSt = (x) => (x < 0.22 ? 'ready' : x < 0.27 ? 'roe' : x < 0.31 ? 'tariff' : x < 0.34 ? 'milestone' : x < 0.38 ? 'waiver' : x < 0.78 ? 'out' : 'invoiced');
  let bl = 23800;
  for (let i = 0; i < 140; i++) {
    if (i % 3 === 0 || rnd() < 0.4) bl += 1 + Math.floor(rnd() * 7);
    const sz = sizes[Math.floor(rnd() * sizes.length)], st = pickSt(rnd()), gate = hmAdd(HM_TODAY, -(5 + Math.floor(rnd() * 40)));
    const back = st === 'out' ? '' : hmAdd(gate, 6 + Math.floor(rnd() * Math.max(1, hmDiff(gate, HM_TODAY) - 5)));
    out.push({ cn: pre[i % 4] + ' ' + String(100000 + Math.floor(rnd() * 899999)) + '-' + Math.floor(rnd() * 10), sz, cust: HM_CUST[Math.floor(rnd() * HM_CUST.length)], dir: rnd() < 0.6 ? 'I' : 'E',
      bl: 'BL-' + cc + '-' + bl, out: gate, back: back > HM_TODAY ? HM_TODAY : back, free: sz === '40RF' ? 4 : rnd() < 0.5 ? 5 : 7, type: ['Detention', 'Demurrage', 'Combined'][Math.floor(rnd() * 3)], st });
  }
  HM_CACHE[key] = out;
  return out;
};

class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('girs.home') || '{}') || {}; } catch (e) {}
    this.state = {
      tab: 'voy', from: HM_TODAY, to: HM_TODAY, view: 'range', win: hmAdd(HM_TODAY, -6), cal: false,
      dir: 'all', stf: 'all', q: '', sort: 'urgency', sdir: 1, grp: true, pg: 1, psz: 25, sel: {},
      gen: saved.gen || {}, fu: saved.fu || {}, roeReq: saved.roeReq || {}, roeSet: saved.roeSet || {}, ddGen: saved.ddGen || {}, ddAct: saved.ddAct || {},
      drw: '', drwF: '', drwQ: '', drwPg: 1, confirm: null, rateFor: '', rateVal: '', done: null, alertOff: false,
      ddF: 'all', ddQ: '', ddPg: 1
    };
    try { document.addEventListener('keydown', (e) => { if (e.key === 'Escape') this.setState({ drw: '', confirm: null, rateFor: '', cal: false }); }); } catch (e) {}
  }
  save(patch) {
    const s = Object.assign({}, this.state, patch);
    try { localStorage.setItem('girs.home', JSON.stringify({ gen: s.gen, fu: s.fu, roeReq: s.roeReq, roeSet: s.roeSet, ddGen: s.ddGen, ddAct: s.ddAct })); } catch (e) {}
    this.setState(patch);
  }
  renderVals() {
    const s = this.state, self = this;
    const hub = s.__hub || 'SIN', [cty, port, cc] = HM_HUB[hub] || HM_HUB.SIN, ent = s.__ent || 'PIL';
    const hr = (() => { try { return new Date().getHours(); } catch (e) { return 9; } })();
    const greet = (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', ' + (typeof USER_NAME === 'string' ? USER_NAME.split(' ')[0] : 'Daniel');

    const live = (v) => {
      const g = s.gen[v.id] || 0, roeOk = !!s.roeSet[v.pair];
      let [inv, ready, roe, nod, hold] = v.st;
      if (roeOk && v.date <= HM_TODAY) { ready += roe; roe = 0; }
      ready = Math.max(0, ready - g); inv += g;
      const notDue = v.date > HM_TODAY, blocked = roe + nod + hold, open = notDue ? 0 : v.bls - inv;
      const late = v.date < HM_TODAY && open > 0;
      const status = notDue ? 'notdue' : open === 0 ? 'done' : ready ? 'ready' : 'blocked';
      return Object.assign({}, v, { inv, ready, roe, nod, hold, blocked, open, notDue, late, status, overdueBy: late ? hmDiff(v.date, HM_TODAY) : 0 });
    };
    const day = (d) => hmDay(port, d).filter((v) => v.ent === ent).map(live);
    const tally = (vs, k) => vs.reduce((a, v) => a + v[k], 0);
    // overdue = past 14 days with open invoices
    const overdue = [];
    for (let i = 1; i <= 14; i++) day(hmAdd(HM_TODAY, -i)).forEach((v) => { if (v.late) overdue.push(v); });

    // ---------- ribbon (14 days, movable)
    const span = s.view === 'overdue' ? [] : (() => { const a = []; for (let d = s.from; d <= s.to; d = hmAdd(d, 1)) a.push(d); return a; })();
    const rib = [];
    for (let i = 0; i < 14; i++) rib.push(hmAdd(s.win, i));
    const ribData = rib.map((d) => { const vs = day(d), E = Math.max(1, tally(vs, 'bls')); return { d, vs, open: d > HM_TODAY ? tally(vs, 'bls') : tally(vs, 'open'), sI: 'width: ' + (tally(vs, 'inv') / E) * 100 + '%', sR: 'width: ' + (d > HM_TODAY ? 0 : tally(vs, 'ready') / E) * 100 + '%', sB: 'width: ' + (d > HM_TODAY ? 0 : tally(vs, 'blocked') / E) * 100 + '%' }; });
    const ribMax = Math.max(1, ...ribData.map((x) => x.open));
    const ribbon = ribData.map(({ d, vs, open, sI, sR, sB }) => {
      const inR = s.view === 'range' && d >= s.from && d <= s.to, late = vs.some((v) => v.late), fut = d > HM_TODAY, wk = [0, 6].includes(hmD(d).getDay());
      return {
        w: d === HM_TODAY ? 'Today' : hmFmt(d, { weekday: 'short' }), d: hmFmt(d, { day: 'numeric', month: 'short' }), n: vs.length + (vs.length === 1 ? ' voyage' : ' voyages'),
        open: fut ? 'Not due' : open ? hmN(open) + ' open' : 'All invoiced',
        cls: 'hm-rd' + (inR ? ' on' : '') + (d === HM_TODAY ? ' today' : '') + (late ? ' late' : '') + (fut ? ' fut' : '') + (wk ? ' wk' : '') + (inR && d === s.from ? ' first' : '') + (inR && d === s.to ? ' last' : ''),
        sI, sR, sB, bar: '', barC: 'hm-rb' + (fut ? ' fut' : late ? ' late' : open ? '' : ' done'),
        cur: inR ? 'true' : 'false', aria: hmFmt(d, { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + vs.length + ' voyages, ' + (fut ? 'not due' : hmN(open) + ' invoices open'),
        pick: (e) => {
          if (e && e.shiftKey && s.view === 'range') { const a = d < s.from ? d : s.from, b = d < s.from ? s.to : d; self.setState({ from: a, to: b, pg: 1, sel: {} }); }
          else self.setState({ view: 'range', from: d, to: d, pg: 1, sel: {} });
        }
      };
    });
    const setRange = (a, b, keep) => self.setState({ view: 'range', from: a, to: b, win: hmAdd(a, -Math.max(0, Math.min(6, 13 - hmDiff(a, b)))), pg: 1, sel: {}, cal: !!keep });
    const step = s.view === 'range' ? hmDiff(s.from, s.to) + 1 : 1;
    const rangeL = s.view === 'overdue' ? 'Overdue · last 14 days' : s.from === s.to ? (s.from === HM_TODAY ? 'Today, ' : '') + hmFmt(s.from, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : hmFmt(s.from) + ' – ' + hmFmt(s.to, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const nav = {
      label: rangeL, cal: s.cal, toggleCal: () => self.setState({ cal: !s.cal }), closeCal: () => self.setState({ cal: false }),
      prev: () => (s.view === 'overdue' ? setRange(hmAdd(HM_TODAY, -1), hmAdd(HM_TODAY, -1)) : setRange(hmAdd(s.from, -step), hmAdd(s.to, -step))),
      next: () => (s.view === 'overdue' ? setRange(HM_TODAY, HM_TODAY) : setRange(hmAdd(s.from, step), hmAdd(s.to, step))),
      prevL: step > 1 ? 'Previous ' + step + ' days' : 'Previous day', nextL: step > 1 ? 'Next ' + step + ' days' : 'Next day',
      today: () => setRange(HM_TODAY, HM_TODAY), isToday: s.view === 'range' && s.from === HM_TODAY && s.to === HM_TODAY,
      winPrev: () => self.setState({ win: hmAdd(s.win, -7) }), winNext: () => self.setState({ win: hmAdd(s.win, 7) }),
      winL: hmFmt(rib[0], { day: 'numeric', month: 'short' }) + ' – ' + hmFmt(rib[13], { day: 'numeric', month: 'short', year: 'numeric' }),

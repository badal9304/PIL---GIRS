/* ---- Charge Master (revamp) ---- */
/* shared components, same rules as Invoice List: tabs, table, docked pagination, links, checkbox */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabb[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.lnk:focus-visible,.tabb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.lnk:hover{text-decoration:underline}
.mu{color:var(--muted)}

.pager{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 4px 0;font-size:13px;color:var(--muted2)}

.card + .pager{margin-top:-17px;min-height:48px;padding:6px 8px 6px 16px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-top-color:var(--line2);border-radius:0 0 8px 8px}

.lst{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}

.lst .c-act{position:sticky;inset-inline-end:0;z-index:1;width:1%;padding-inline:16px;text-align:center;background:var(--surface);box-shadow:inset 1px 0 0 var(--line2)}

.lst tr.on td,.lst tr.on .c-no,.lst tr.on .c-act{background:var(--tint2)}
.cm2-acts{display:inline-flex;align-items:center;gap:0;padding:0 4px}
.cm2-acts .cm2-bar{width:1px;height:14px;padding:0;margin:0 10px;background:var(--line)}
/* Search tab fits the window like the Invoice List: the results table scrolls inside its card, pagination stays in view */
.gmain:has(#bm-p1){flex:1 1 0 !important;min-height:0 !important}
/* non-editable fields are grey; editable fields are white */
.input[readonly]{background:var(--sub);color:var(--ink);cursor:default}
.input[readonly]:hover{border-color:var(--bd)}
.input[readonly]:focus{border-color:var(--bd);box-shadow:none}

.card-meta{font-size:12px;color:var(--muted)}

.cm2-bottom{position:sticky;bottom:0;z-index:5;margin:auto -20px -20px;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:64px;padding:0 20px;box-sizing:border-box;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgba(22,26,33,.06)}

.cmc-crit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end;padding:12px 16px 16px}

    </div>
  </div>


  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="gtoast" style="position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 520px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box">{{shell.toast}}<button class="btn btn-sm" onClick="{{shell.closeToast}}">Close</button></div>
  </sc-if>
</div>
</script>
<script type="text/x-dc" id="logic">
// Home — landing workspace for a port / office user. Data arrives from LMS.
// 1) Voyage Invoicing: voyages loading (Export, …E) or discharging (Import, …I) at my port, invoice readiness and blockers.
// 2) D&D Billing: containers given to customers, detention / demurrage to invoice, and why amounts are pending.
// Sample data (Singapore view; other locations swap the port code and scale counts).
const HM_HUB = { SIN: ['Singapore', 'SGSIN', 'SGD', 1], NSA: ['India', 'INNSA', 'INR', 0.6], LCH: ['Thailand', 'THLCH', 'THB', 0.45], PKG: ['Malaysia', 'MYPKG', 'MYR', 0.55], JED: ['Saudi Arabia', 'SAJED', 'SAR', 0.4], ZLO: ['Mexico', 'MXZLO', 'MXN', 0.3] };
const HM_TODAY = '2026-11-20';
const HM_DAYS = ['2026-11-17', '2026-11-18', '2026-11-19', '2026-11-20', '2026-11-21', '2026-11-22', '2026-11-23', '2026-11-24'];
// date, vessel, voyage no., dir (E/I), other port, expected, invoiced, ready, roe missing, data not received, other hold, ROE pair, avg USD per B/L
const HM_VOY = [
  ['2026-11-17', 'KOTA LEMBAH', '0KL2MME', 'E', 'NZAKL', 820, 790, 12, 0, 18, 0, '', 1850],
  ['2026-11-18', 'KOTA SEJATI', '2KS4NNI', 'I', 'CNSHA', 640, 602, 10, 22, 6, 0, 'USD → SGD', 640],
  ['2026-11-19', 'NORFOLK', '0NF7QQI', 'I', 'NZTRG', 410, 388, 0, 14, 8, 0, 'NZD → SGD', 610],
  ['2026-11-20', 'CMA CGM LEKKI', '0LK5SSE', 'E', 'NZAKL', 1000, 0, 935, 25, 40, 0, 'USD → NZD', 1850],
  ['2026-11-20', 'KOTA PEMIMPIN', '1KP8RRI', 'I', 'INNSA', 520, 310, 154, 30, 20, 6, 'USD → SGD', 620],
  ['2026-11-21', 'NORFOLK', '0NF8SSE', 'E', 'NZAKL', 700, 0, 0, 0, 700, 0, '', 1850],
  ['2026-11-21', 'KOTA LEMBAH', '0KL3PPE', 'E', 'MYPKG', 380, 0, 0, 0, 380, 0, '', 980],
  ['2026-11-23', 'KOTA SEJATI', '2KS5TTE', 'E', 'CNSHA', 560, 0, 0, 0, 560, 0, '', 1420],
  ['2026-11-24', 'CMA CGM KAURI', '0KR1AAI', 'I', 'NZTRG', 450, 0, 0, 0, 450, 0, '', 610]
];
// container, size, customer, I/E, B/L, gate-out, returned, free days, D&D type, USD per day over, status
const HM_DD = [
  ['PCIU 812044-7', '40HC', 'Straits Harbour Logistics', 'I', 'BL-SG-23871', '2026-10-28', '2026-11-18', 7, 'Detention', 75, 'ready'],
  ['PCIU 733120-2', '20GP', 'Meridian Agro Exports', 'E', 'BL-SG-23902', '2026-10-30', '2026-11-17', 5, 'Demurrage', 45, 'ready'],
  ['TGHU 551902-0', '40HC', 'Andaman Bay Traders', 'I', 'BL-SG-23944', '2026-11-02', '2026-11-19', 7, 'Detention', 75, 'roe'],
  ['PCIU 690377-5', '40RF', 'Orchid Lane Polymers', 'I', 'BL-SG-23950', '2026-11-01', '2026-11-16', 4, 'Combined', 140, 'tariff'],
  ['PCIU 802211-9', '20GP', 'Kinabalu Home Furnishings', 'E', 'BL-SG-23961', '2026-11-03', '2026-11-18', 5, 'Detention', 40, 'milestone'],
  ['TCLU 418820-3', '40HC', 'Straits Harbour Logistics', 'I', 'BL-SG-23977', '2026-11-04', '2026-11-19', 7, 'Detention', 75, 'waiver'],
  ['PCIU 920014-6', '40HC', 'Meridian Agro Exports', 'I', 'BL-SG-24010', '2026-11-05', '', 7, 'Detention', 75, 'out'],
  ['PCIU 771536-1', '20GP', 'Andaman Bay Traders', 'E', 'BL-SG-24018', '2026-11-08', '', 5, 'Demurrage', 45, 'out'],
  ['TGHU 300417-8', '40RF', 'Orchid Lane Polymers', 'I', 'BL-SG-24021', '2026-11-12', '', 4, 'Combined', 140, 'out'],
  ['PCIU 655801-4', '40HC', 'Kinabalu Home Furnishings', 'I', 'BL-SG-24026', '2026-11-15', '', 7, 'Detention', 75, 'out'],
  ['PCIU 588190-3', '20GP', 'Straits Harbour Logistics', 'E', 'BL-SG-23890', '2026-10-25', '2026-11-12', 5, 'Demurrage', 45, 'invoiced']
];
const HM_DDST = {
  ready: ['Ready to invoice', 'ok'], roe: ['ROE not received', 'warn'], tariff: ['D&D tariff missing', 'warn'], milestone: ['Milestone conflict', 'warn'],
  waiver: ['Waiver approval pending', 'warn'], out: ['Still with customer', 'info'], invoiced: ['Invoiced', 'done']
};
const HM_DDOWN = { roe: 'Treasury · ROE feed', tariff: 'Pricing · tariff set-up', milestone: 'Equipment control · LMS', waiver: 'Approver · Credit control' };
const hmN = (n) => Math.round(n).toLocaleString('en-US');
const hmUsd = (v) => 'USD ' + (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : hmN(v));
const hmDay = (d) => { const t = new Date(d + 'T00:00:00'); return { w: t.toLocaleDateString('en-GB', { weekday: 'short' }), d: t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) }; };
const hmDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);

class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tab: 'voy', day: HM_TODAY, voy: '', gen: {}, asked: {}, ddGen: {}, ddF: 'all', alertOff: false };
  }
  renderVals() {
    const s = this.state, self = this;
    const hub = s.__hub || 'SIN', [cty, port, lcy, f] = HM_HUB[hub] || HM_HUB.SIN;
    const sc = (n) => (n ? Math.max(1, Math.round(n * f)) : 0);
    const hr = (() => { try { return new Date().getHours(); } catch (e) { return 9; } })();
    const greet = (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', ' + (typeof USER_NAME === 'string' ? USER_NAME.split(' ')[0] : 'Daniel');

    // ---------- Voyages
    const V = HM_VOY.map(([date, vessel, no, dir, other, exp, inv, ready, roe, nod, hold, pair, avg]) => {
      const g = s.gen[no] || 0; // generated in this session
      const r = { date, vessel, no, dir, exp: sc(exp), inv: sc(inv) + g, ready: Math.max(0, sc(ready) - g), roe: sc(roe), nod: sc(nod), hold: sc(hold), pair: pair.replace('SGD', lcy), avg };
      r.leg = dir === 'E' ? port + ' → ' + other : other + ' → ' + port;
      r.past = date < HM_TODAY; r.future = date > HM_TODAY;
      r.blocked = r.roe + r.nod + r.hold; r.open = r.exp - r.inv;
      return r;
    });
    const days = HM_DAYS.map((d) => {
      const vs = V.filter((v) => v.date === d), open = vs.reduce((a, v) => a + v.open, 0), t = hmDay(d);
      return { k: d, w: d === HM_TODAY ? 'Today' : t.w, d: t.d, sub: vs.length ? vs.length + (vs.length === 1 ? ' voyage' : ' voyages') + ' · ' + hmN(open) + ' open' : 'No voyages',
        cls: 'hm-day' + (d === s.day ? ' on' : '') + (d < HM_TODAY && open ? ' late' : '') + (!vs.length ? ' none' : ''), cur: d === s.day ? 'true' : 'false',
        pick: () => self.setState({ day: d, voy: '' }) };
    });
    const missed = V.filter((v) => v.past && v.open > 0);
    const missChip = { n: missed.length, sub: hmN(missed.reduce((a, v) => a + v.open, 0)) + ' invoices still open', cls: 'hm-day miss' + (s.day === 'missed' ? ' on' : ''), cur: s.day === 'missed' ? 'true' : 'false', pick: () => self.setState({ day: 'missed', voy: '' }) };
    const scope = s.day === 'missed' ? missed : V.filter((v) => v.date === s.day);
    const sel = s.voy ? scope.filter((v) => v.no === s.voy) : scope;
    const sum = (k) => sel.reduce((a, v) => a + v[k], 0);
    const E = sum('exp'), I = sum('inv'), R = sum('ready'), B = sum('blocked');
    const scopeL = s.voy ? 'Voyage ' + s.voy : s.day === 'missed' ? 'Missed voyages (past dates)' : (s.day === HM_TODAY ? 'Today, ' : '') + hmDay(s.day).w + ' ' + hmDay(s.day).d;
    const vk = [
      ['Expected invoices', hmN(E), sel.length + (sel.length === 1 ? ' voyage' : ' voyages'), ''],
      ['Invoiced', hmN(I), E ? Math.round((I / E) * 100) + '% of expected' : '—', 'ok'],
      ['Ready to invoice', hmN(R), 'Data and ROE received', 'info'],
      ['ROE not received', hmN(sum('roe')), 'Exchange rate missing', sum('roe') ? 'warn' : ''],
      ['Data not received', hmN(sum('nod')), 'Not yet sent by LMS', sum('nod') ? 'warn' : ''],
      ['Pending amount', hmUsd(sel.reduce((a, v) => a + v.blocked * v.avg, 0)), 'Blocked from invoicing', B ? 'bad' : '']
    ].map(([l, v, sub, tone]) => ({ l, v, sub, cls: 'card hm-k ' + tone }));
    const pct = (n, e) => (e ? (n / e) * 100 : 0);
    const rows = scope.map((v) => {
      const rd = v.exp ? Math.round(((v.inv + v.ready) / v.exp) * 100) : 0;
      return {
        no: v.no, vessel: v.vessel, leg: v.leg, dirL: v.dir === 'E' ? 'Export' : 'Import', dirC: 'hm-dir ' + v.dir, date: hmDay(v.date).w + ' ' + hmDay(v.date).d, dateL: v.dir === 'E' ? 'ETD' : 'ETA',
        exp: hmN(v.exp), inv: hmN(v.inv), ready: hmN(v.ready), roe: v.roe ? hmN(v.roe) : '—', nod: v.nod ? hmN(v.nod) : '—', roeC: v.roe ? 'r hm-wn' : 'r mu', nodC: v.nod ? 'r hm-wn' : 'r mu',
        bI: 'width: ' + pct(v.inv, v.exp) + '%', bR: 'width: ' + pct(v.ready, v.exp) + '%', bB: 'width: ' + pct(v.blocked, v.exp) + '%', rd: rd + '%', rdC: 'hm-rd ' + (rd >= 90 ? 'ok' : rd >= 80 ? 'warn' : 'bad'),
        cls: (v.no === s.voy ? 'on ' : '') + 'cmc-row', pickV: () => self.setState({ voy: s.voy === v.no ? '' : v.no }),
        canGen: v.ready > 0, noGen: v.ready === 0, genL: 'Generate ' + hmN(v.ready), noGenL: v.open === 0 ? 'All invoiced' : v.future && !v.ready ? 'Awaiting data' : 'Nothing ready',
        gen: () => self.setState({ gen: Object.assign({}, s.gen, { [v.no]: (s.gen[v.no] || 0) + v.ready }), __toast: hmN(v.ready) + ' invoices generated for voyage ' + v.no + '.' })
      };
    });
    // Blockers for the current scope
    const blk = [];
    const nodV = sel.filter((v) => v.nod), roeV = sel.filter((v) => v.roe), holdV = sel.filter((v) => v.hold);
    if (nodV.length) {
      const n = nodV.reduce((a, v) => a + v.nod, 0), key = 'nod:' + s.day + ':' + s.voy;
      blk.push({ r: 'Data not received from LMS', d: nodV.map((v) => v.no + ' (' + hmN(v.nod) + ')').join(', '), own: 'Port agency · Documentation', n: hmN(n), amt: hmUsd(nodV.reduce((a, v) => a + v.nod * v.avg, 0)),
        act: s.asked[key] ? 'Follow-up sent' : 'Send follow-up', done: !!s.asked[key], go: () => self.setState({ asked: Object.assign({}, s.asked, { [key]: 1 }), __toast: 'Follow-up sent to the port agency for ' + hmN(n) + ' B/Ls.' }) });
    }
    const pairs = {};
    roeV.forEach((v) => { pairs[v.pair] = pairs[v.pair] || []; pairs[v.pair].push(v); });
    Object.keys(pairs).forEach((pr) => {
      const vs = pairs[pr], n = vs.reduce((a, v) => a + v.roe, 0), key = 'roe:' + pr;
      blk.push({ r: 'ROE not received · ' + pr, d: vs.map((v) => v.no + ' (' + hmN(v.roe) + ')').join(', '), own: 'Treasury · ROE feed', n: hmN(n), amt: hmUsd(vs.reduce((a, v) => a + v.roe * v.avg, 0)),
        act: s.asked[key] ? 'ROE requested' : 'Request ROE', done: !!s.asked[key], go: () => self.setState({ asked: Object.assign({}, s.asked, { [key]: 1 }), __toast: 'ROE requested for ' + pr + ' — clears ' + hmN(n) + ' invoices once received.' }) });
    });
    if (holdV.length) {
      const n = holdV.reduce((a, v) => a + v.hold, 0);
      blk.push({ r: 'Split-payer unconfirmed', d: holdV.map((v) => v.no + ' (' + hmN(v.hold) + ')').join(', '), own: 'Customer service', n: hmN(n), amt: hmUsd(holdV.reduce((a, v) => a + v.hold * v.avg, 0)),
        act: 'Open Split Billing', done: false, href: 'split-billing.html', go: () => { try { location.href = 'split-billing.html'; } catch (e) {} } });
    }

    // ---------- D&D
    const dd = HM_DD.map(([cn, sz, cust, dir, bl, out, back, free, type, rate, st]) => {
      const end = back || HM_TODAY, used = hmDiff(out, end), over = Math.max(0, used - free);
      const status = s.ddGen[cn] ? 'invoiced' : st;
      return { cn, sz, cust, dir, bl, out, back, free, type, rate, used, over, amt: over * rate * (st === 'out' ? 1 : 1), status };
    });
    const cnt = (k) => dd.filter((c) => c.status === k).length;
    const blockedDD = dd.filter((c) => ['roe', 'tariff', 'milestone', 'waiver'].includes(c.status));
    const outDD = dd.filter((c) => c.status === 'out'), readyDD = dd.filter((c) => c.status === 'ready');
    const ddk = [
      ['Containers with customers', String(outDD.length), outDD.filter((c) => c.over > 0).length + ' beyond free time', ''],

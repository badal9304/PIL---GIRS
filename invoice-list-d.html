.conf ul{margin:0;padding-inline-start:18px;text-align:start;font-weight:500;display:flex;flex-direction:column;gap:4px}
.amenu{position:fixed;z-index:81;width:264px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(14,17,22,.16)}
.amenu .mi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;padding:7px 10px;border-radius:6px;font-size:13px;line-height:18px;color:var(--ink);cursor:pointer}
.amenu .mi:hover:not([disabled]),.amenu .mi:focus-visible{background:var(--hover)}
.amenu .mi[disabled]{cursor:not-allowed;color:var(--muted)}
.amenu .mi small{font-size:11px;line-height:14px;color:var(--muted)}
.amenu .mi.d{color:var(--bad)}
.amenu .mi.d[disabled]{color:#C9A0A2}
.amenu .sep{height:1px;margin:4px 0;background:var(--line2)}
.mback{position:fixed;inset:0;z-index:80;background:transparent;border:0;padding:0;margin:0;cursor:default}
.dbtn-danger{background:var(--bad);border-color:var(--bad);color:var(--onaccent)}
.dbtn-danger:hover:not(:disabled){background:#8A1F23;border-color:#8A1F23;color:var(--onaccent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.at{width:100%;border-collapse:collapse}
.cfoot{flex:none;border-top:1px solid var(--line);padding:4px 12px 6px;background:var(--sub)}
.cfoot .pager{padding:0;flex-wrap:wrap;row-gap:4px}
.pager{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 4px 0;font-size:13px;color:var(--muted2)}
.pbtn{min-width:32px;justify-content:center;font-size:15px}
.seg2{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--neutral)}
.seg2 button{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted2)}
.seg2 button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(22,26,33,.12)}
.seg2 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:17px;background:var(--surface);font-size:13px;font-weight:500;color:var(--muted2)}
.chipb:hover{border-color:#A9B0BC}
.chipb[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.chipb .cnt{font-size:12px;font-weight:600;opacity:.8}
.chipb.w:not([aria-pressed=true]) .cnt{color:var(--bad);opacity:1}
.chipb:focus-visible,.ili:focus-visible,.qitem:focus-visible,.icard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.callout{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:10px;background:var(--tint);border:1px solid var(--tintbd)}
.callout .ci{width:40px;height:40px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.callout b{display:block;font-size:15px;color:var(--ink)}
.callout span{font-size:13px;color:var(--muted2)}
.ili{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px;width:100%;padding:14px 18px;border-bottom:1px solid var(--line2);border-inline-start:3px solid transparent}
.ili:hover{background:var(--hover2)}
.ili[aria-current=true]{background:#EEF6FC;border-inline-start-color:var(--accent)}
.ili .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.ili .r{text-align:end;font-weight:600;font-size:14px}
.ili .m{font-size:13px;color:var(--muted2)}
.ili .s{font-size:12px;color:var(--muted);text-align:end}
.dsec{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-top:1px solid var(--line2)}
.dsec h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.kv2 div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv2 .l{font-size:12px;color:var(--muted)}
.kv2 .v{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.qitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink)}
.qitem:hover{background:var(--hover)}
.qitem[aria-current=true]{background:var(--tint);color:var(--accent2)}
.qitem .n{font-size:13px;font-weight:600;color:var(--muted)}
.qitem.w .n{color:var(--bad)}
.qitem small{grid-column:1 / -1;font-size:12px;font-weight:400;color:var(--muted)}
.qhead{padding:14px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-content:start}
.icard{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.icard:hover{border-color:#A9B0BC;box-shadow:0 2px 8px rgba(14,17,22,.06)}
.icard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icard .amt{font-size:22px;line-height:28px;font-weight:600}
.icard .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.icard .foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line2);margin-top:2px}
.at td,.at th{white-space:normal;vertical-align:top}
.lay{white-space:nowrap;display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.lay[aria-current=page]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(22,26,33,.12)}.lay.rec{gap:5px}.lay.rec .recst{color:#C77700;font-size:12px;line-height:1}.lay.rec:not([aria-current=page]){color:var(--muted2);font-weight:600}nav[aria-label='Layout options']:has(.lay.rec)::after{content:'\2605  Present first';font-size:12px;font-weight:600;color:var(--warn);white-space:nowrap;padding-left:2px}</style>
</helmet>

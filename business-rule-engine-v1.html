                      <td>{{r.scope}}</td>
                      <td class="mono" style="font-size: 12px">{{r.eff}}</td>
                      <td><span class="chip {{r.stc}}">{{r.st}}</span></td>

  <sc-if value="{{ed.on}}" hint-placeholder-val="{{ false }}">

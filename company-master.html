.kmt{display:flex;flex-direction:column;gap:2px;min-width:0}
.kmt>span{font-weight:500}
.kmt small{font-size:12px;line-height:16px;color:var(--muted);font-weight:400}
.kmi-d{color:var(--bad)}
.kmi-d:hover:not(:disabled){background:var(--badbg)}
.kmi:disabled{cursor:not-allowed;color:var(--bad);opacity:.55}
.kmenu.up{top:auto;bottom:calc(100% + 6px)}

.fct .v{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:20px}
.dcol .kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 20px}
table:not(.ktbl):not(.rt) tr:has(> td > div[style*="flex-direction: column"]) > td{height:auto;padding-block:8px}
.kib{width:32px;padding:0}
.kdanger{color:var(--bad)}
.kdanger:hover:not(:disabled){background:var(--badbg);border-color:var(--badbd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ktool{display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--line2);background:var(--hover2);font-size:12px;color:var(--muted)}
.ktbl{width:100%;border-collapse:collapse;table-layout:fixed}
.ktbl th{height:36px;padding:0 12px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);background:var(--sub);border-bottom:1px solid var(--line)}
.ktbl td{white-space:normal;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13px;line-height:18px;overflow-wrap:anywhere;vertical-align:top}
.ktbl tr:first-child td{font-weight:500}
.kfs{border:0;margin:0 0 22px;padding:0}
.kfs legend{padding:0;margin-bottom:12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.kf{display:flex;flex-direction:column;gap:5px;min-width:0}
.kf.w{grid-column:span 2}
.kf .kl{font-size:12px;font-weight:500;color:var(--muted2)}
.kf .kl b{color:var(--bad);font-weight:600;margin-inline-start:2px}
.kf .input,.kf .select{width:100%;padding-inline-start:12px;background:var(--surface)}
.kf textarea.input{height:auto;min-height:72px;padding:8px 12px;resize:vertical;line-height:20px}
.kf .kro{min-height:36px;display:flex;align-items:center;padding:0 12px;border-radius:6px;background:var(--sub);border:1px dashed var(--bd);color:var(--muted2);font-size:13px;box-sizing:border-box}

.kf .ke{font-size:12px;color:var(--bad);font-weight:500}

.kbtn-danger:hover:not(:disabled){background:#8A1F23;border-color:#8A1F23;color:var(--onaccent)}

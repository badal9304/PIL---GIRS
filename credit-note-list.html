.cn2-src{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600}
.src-a{background:#EEF0FF;color:#3B3FB5}.src-m{background:var(--neutral);color:var(--muted2)}
.cn2-st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.cn2-st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{background:var(--okbg);color:var(--ok)}.st-bad{background:var(--badbg);color:var(--bad)}.st-warn{background:var(--warnbg);color:var(--warn)}.st-bad2{background:var(--neutral);color:var(--bad)}.st-mu{background:var(--neutral);color:var(--muted2)}
.cn2-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px;color:var(--muted)}.cn2-empty b{color:var(--ink)}
.cn2-scrim{all:unset;position:fixed;inset:0;z-index:60;background:rgba(16,20,28,.28)}
.cn2-dr{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(720px,100vw);background:var(--surface);box-shadow:-8px 0 32px rgba(22,26,33,.18);display:flex;flex-direction:column;color:var(--ink)}
.cn2-dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px 12px}
.cn2-dh1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cn2-dh h2{margin:0;font-size:18px;font-weight:600}.cn2-dh p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.cn2-tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.cn2-tabs button{all:unset;cursor:pointer;height:40px;padding:0 10px;font-size:13px;font-weight:500;color:var(--muted2);border-bottom:2px solid transparent}
.cn2-tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.cn2-db{flex:1;overflow:auto;padding:18px 22px 24px;display:flex;flex-direction:column;gap:18px}
.cn2-exc{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:var(--badbg);border:1px solid var(--badbd,#f1c2c2)}
.cn2-exc b{color:var(--bad);font-size:13.5px}.cn2-exc span{font-size:13px}.cn2-exc div{display:flex;gap:8px;margin-top:4px}
.cn2-sec h3{margin:0;font-size:14px;font-weight:600}.cn2-sub{margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.cn2-fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cn2-fl li{position:relative;display:flex;gap:12px;padding-bottom:14px}
.cn2-fl li:not(:last-child)::after{content:'';position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
.cn2-fl li.fl-done:not(:last-child)::after{background:var(--ok)}
.cn2-mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:2px solid var(--bd);background:var(--surface);color:var(--muted);box-sizing:border-box;z-index:1}
.fl-done .cn2-mk{background:var(--ok);border-color:var(--ok);color:#fff}.fl-fail .cn2-mk{background:var(--bad);border-color:var(--bad);color:#fff}.fl-now .cn2-mk{border-color:var(--warn);color:var(--warn)}
.cn2-fl li > div{display:flex;flex-direction:column;gap:1px;padding-top:1px}.cn2-fl b{font-size:13px}.cn2-fl span:not(.cn2-mk){font-size:12.5px;color:var(--muted2)}
.fl-fail b,.fl-fail span:not(.cn2-mk){color:var(--bad) !important}.fl-wait b{color:var(--muted)}
.cn2-kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin:10px 0 0}.cn2-kv dt{font-size:11.5px;color:var(--muted)}.cn2-kv dd{margin:2px 0 0;font-size:13px;font-weight:500;word-break:break-word}
.cn2-rm{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--sub)}.cn2-rm span{font-size:11.5px;color:var(--muted)}.cn2-rm p{margin:2px 0 0;font-size:13px}
.cn2-lt{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cn2-lt th{height:34px;padding:0 10px;text-align:start;font-size:12px;font-weight:600;color:var(--muted2);background:var(--sub);border-bottom:1px solid var(--line)}
.cn2-lt td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}.cn2-lt .num{text-align:end;font-variant-numeric:tabular-nums}
.cn2-lt small{display:block;font-size:12px;color:var(--muted)}.cn2-lt tfoot td{background:var(--sub);border-bottom:0}.cn2-g{font-weight:700;color:var(--accent2);white-space:nowrap}
.cn2-info{margin:0;padding:10px 12px;border-radius:8px;background:var(--tint);color:var(--accent2);font-size:13px}
.cn2-ap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cn2-ap li{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;border-left:3px solid var(--bd);font-size:13px}
.cn2-ap1{display:flex;justify-content:space-between;gap:8px}.cn2-apr{font-size:12px;font-weight:600}
.ap-approved{border-left-color:var(--ok) !important}.ap-approved .cn2-apr{color:var(--ok)}.ap-rejected{border-left-color:var(--bad) !important}.ap-rejected .cn2-apr{color:var(--bad)}
.ap-pending{border-left-color:var(--warn) !important}.ap-pending .cn2-apr{color:var(--warn)}.ap-not-reached .cn2-apr{color:var(--muted)}
.cn2-ap q{display:block;margin-top:2px;font-style:italic;color:var(--muted2);quotes:none}
.cn2-act{display:flex;flex-direction:column;gap:6px}.cn2-l{font-size:13px;font-weight:500}.cn2-act textarea{height:70px;padding-top:8px;resize:vertical}
.cn2-ab{display:flex;justify-content:flex-end;gap:8px}.cn2-rej{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.cn2-dr{animation:cn2in .18s ease-out}@keyframes cn2in{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

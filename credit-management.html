body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:8px;height:72px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: 'all', sel: 'c6', req: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US');
    const C = [
      ['c1', '[Customer A] group', 250000, 118400], ['c2', '[Customer B] group', 120000, 34200], ['c3', '[Customer C] group', 300000, 262500], ['c4', '[Customer D] group', 80000, 42000],
      ['c5', '[Customer E] group', 60000, 5600], ['c6', '[Customer F] group', 150000, 163900], ['c7', '[Customer H] group', 200000, 191000], ['c8', '[Customer I] group', 90000, 13700],
      ['c9', '[Customer J] group', 50000, 3150], ['c10', '[Customer L] group', 100000, 104300], ['c11', '[Customer K] group', 70000, 4410], ['c12', '[Customer M] group', 40000, 1980]
    ];
    const ST = { ok: ['Within limit', 'background:var(--okbg);color:var(--ok)', 'var(--okbar)'], warn: ['Warning', 'background:var(--warnbg);color:var(--warn)', 'var(--warnbar)'], hold: ['Credit hold', 'background:var(--badbg);color:var(--bad)', 'var(--badbar)'], pend: ['Release requested', 'background:var(--tint);color:var(--accent2)', 'var(--accent)'] };
    const stOf = (c) => { if (s.req[c[0]]) return 'pend'; const u = c[3] / c[2]; return u > 1 ? 'hold' : (u >= 0.85 ? 'warn' : 'ok'); };
    const T = [['hold', 'Credit hold'], ['warn', 'Warning'], ['pend', 'Release requested'], ['ok', 'Within limit']];
    const tiles = T.map(([k, label]) => { const on = s.filter === k; return { label, value: C.filter((c) => stOf(c) === k).length, color: ST[k][2], on: on ? 'true' : 'false',
      border: on ? 'var(--accent)' : 'var(--line)', shadow: on ? '0 0 0 1px var(--accent)' : 'none', pick: () => this.setState({ filter: on ? 'all' : k }) }; });
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const rows = C.filter((c) => s.filter === 'all' || stOf(c) === s.filter).map((c) => { const k = stOf(c), u = c[3] / c[2], on = s.sel === c[0];
      return { name: c[1], limitText: m(c[2]), expText: m(c[3]), pct: Math.round(u * 100) + '%', w: Math.min(100, Math.round(u * 100)) + '%', bar: ST[k === 'pend' ? 'hold' : k][2], st: ST[k][0], chip: ST[k][1],
        edge: on ? selEdge : '', cell: on ? 'background:var(--tint);' : '', pick: () => this.setState({ sel: c[0] }) }; });
    const c = C.find((x) => x[0] === s.sel) || C[0];
    const k = stOf(c);
    const held = k === 'hold' || k === 'pend';
    const impact = [
      { k: 'New invoice issuance', v: held ? 'Blocked' : (k === 'warn' ? 'Allowed · warning' : 'Allowed'), chip: held ? ST.hold[1] : (k === 'warn' ? ST.warn[1] : ST.ok[1]) },
      { k: 'Shipment-related billing', v: held ? 'Restricted' : 'Allowed', chip: held ? ST.hold[1] : ST.ok[1] },
      { k: 'Receipt allocation', v: held ? 'Pending review' : 'Allowed', chip: held ? ST.warn[1] : ST.ok[1] }
    ];
    const audit = [{ e: 'Credit status refreshed', by: 'Credit Management System', at: '10 Nov 08:00' }]
      .concat(c[3] > c[2] ? [{ e: 'Credit hold applied · limit exceeded', by: 'System', at: '10 Nov 08:00' }] : [])
      .concat(s.req[c[0]] ? [{ e: 'Release requested', by: '[User ID]', at: '10 Nov 12:05' }] : []);
    return {
      tiles, rows, listTitle: s.filter === 'all' ? 'Customer credit position' : T.find((t) => t[0] === s.filter)[1],
      sel: { name: c[1], limitText: m(c[2]), expText: m(c[3]), st: ST[k][0], chip: ST[k][1], reason: c[3] > c[2] ? 'Exposure exceeds approved credit limit' : (k === 'warn' ? 'Exposure near approved limit' : '—') },
      impact, audit, canAct: k === 'hold', pending: k === 'pend',
      request: () => this.setState({ req: { ...s.req, [c[0]]: true }, notice: 'Release request for ' + c[1] + ' sent to the credit approver. Notified by email.' }),
      override: () => this.setState({ req: { ...s.req, [c[0]]: true }, notice: 'Override request for ' + c[1] + ' sent to the credit approver.' }),
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' })
    };
  }
}

      um: s.__um, toggleUm: () => this.setState({ __um: !s.__um }), closeUm: () => this.setState({ __um: false }),
      logins: [0, 1].map((i) => ({ label: '[Login ' + (i + 1) + ']', role: '[Role ' + (i + 1) + ']', on: s.__lg === i ? 'true' : 'false', mark: s.__lg === i ? '✓' : '',
        pick: () => { save('girs.lg', String(i)); this.setState({ __lg: i, __um: false, __toast: 'Switched to [Login ' + (i + 1) + '] · [Role ' + (i + 1) + ']. Screens and actions follow that role.' }); } })),
      curLogin: '[Login ' + (s.__lg + 1) + ']', curRole: '[Role ' + (s.__lg + 1) + ']',
      exp: (e) => { const v = e.target.value; if (!v) return; e.target.value = ''; this.setState({ __toast: 'Export to ' + ({ xlsx: 'Excel', csv: 'CSV', pdf: 'PDF' })[v] + ' prepared — current filters applied.' }); },
      hasToast: !!s.__toast, toast: s.__toast, closeToast: () => this.setState({ __toast: '' }),
      signOut: () => this.setState({ __um: false, __toast: 'Signed out of GIRS (prototype — no session is ended).' })
    } });
  }
}

</script>
<script src="runtime.js"></script>
</body>

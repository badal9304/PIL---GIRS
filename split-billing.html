          <div class="r-col" style="flex: 999 1 860px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <section class="card" style="overflow: hidden">
              <div class="card-head">
                <h2 class="card-title">Charge split · <span class="mono">{{sel.bl}}</span></h2>
                <div style="display: flex; align-items: center; gap: 10px">
                  <label for="basis" class="lbl" style="margin: 0">Allocation basis</label>
                  <div style="position: relative"><select id="basis" class="select select-sm r-w" value="{{basis}}" onChange="{{setBasis}}" style="width: 180px"><option value="cntr">Container count</option><option value="cbm">Cargo volume (CBM)</option><option value="kg">Gross weight (kg)</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
                </div>
              </div>
              <table>
                <thead><tr><th>Party</th><th>Role</th><th class="r" style="{{h.cntr}}">Containers</th><th class="r" style="{{h.cbm}}">CBM</th><th class="r" style="{{h.kg}}">Weight (kg)</th><th class="r">Share</th><th class="r">Amount (USD)</th><th>Child invoice</th><th>Payment</th><th>Release in LMS</th></tr></thead>
                <tbody>

              </table>
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--sub); font-size: 12px">
                <span>Master <span class="mono">{{sel.bl}}</span> · USD <strong class="mono">{{sel.totalText}}</strong> · split total USD <strong class="mono">{{splitTotal}}</strong></span>
                <span class="chip" style="{{balChip}}">{{balText}}</span>

            <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">

                      <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{t.label}}</span><span style="display: block; font-size: 12px; line-height: 16px; color: var(--muted)">{{t.val}}</span></span>

                </div>

            </div>
          </div>
        </div>
      </main>
    </div>

  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">

  </sc-if>
</div>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { sel: 'b1', basis: 'cntr', gen: {}, amend: {}, bt: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const B = [
      { id: 'b1', bl: 'BL-SG-24020', total: 10000, conflict: false, parties: [['[Buyer A]', 'Primary booking debtor', 3, 61.5, 54000, 'paid'], ['[Buyer B]', 'Split buyer', 3, 58.2, 51800, 'unpaid'], ['[Buyer C]', 'Split buyer', 1, 22.4, 19600, 'paid']] },
      { id: 'b2', bl: 'BL-SG-24021', total: 100, conflict: false, parties: [['[Buyer D]', 'Primary booking debtor', 1, 20, 18000, 'unpaid'], ['[Buyer E]', 'Split buyer', 1, 20, 18000, 'unpaid'], ['[Buyer F]', 'Split buyer', 1, 20, 18000, 'unpaid']] },
      { id: 'b3', bl: 'BL-IN-24022', total: 7350, conflict: true, parties: [['[Buyer G]', 'Primary booking debtor', 2, 40.1, 36200, 'paid'], ['[Buyer H]', 'Split buyer', 2, 44.8, 40100, 'paid']] },
      { id: 'b4', bl: 'BL-TH-24023', total: 12480, conflict: false, parties: [['[Buyer J]', 'Primary booking debtor', 4, 88, 80000, 'partial'], ['[Buyer K]', 'Split buyer', 2, 41, 39000, 'unpaid'], ['[Buyer L]', 'Split buyer', 2, 45, 41500, 'paid'], ['[Buyer M]', 'Split buyer', 1, 20, 18700, 'unpaid']] },
      { id: 'b5', bl: 'BL-MY-24024', total: 5200, conflict: false, parties: [['[Buyer N]', 'Primary booking debtor', 1, 21, 19000, 'unpaid'], ['[Buyer P]', 'Split buyer', 1, 23, 21400, 'unpaid']] },
      { id: 'b6', bl: 'BL-SG-24025', total: 8890, conflict: false, parties: [['[Buyer Q]', 'Primary booking debtor', 2, 44, 41000, 'paid'], ['[Buyer R]', 'Split buyer', 3, 60, 57000, 'paid']] }
    ];
    const idx = { cntr: 2, cbm: 3, kg: 4 }[s.basis];
    const bankers = (x) => { const c = x * 100; const f = Math.floor(c); const d = c - f; const r = Math.abs(d - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(c); return r / 100; };
    const calc = (b) => {
      const T = s.amend[b.id] ? Math.round(b.total * 105) / 100 : b.total;
      const base = b.parties.reduce((a, p) => a + p[idx], 0);
      const raw = b.parties.map((p) => bankers(T * p[idx] / base));
      const sum = raw.reduce((a, v) => a + v, 0);
      const resid = Math.round((T - sum) * 100) / 100;
      raw[0] = Math.round((raw[0] + resid) * 100) / 100;
      return { base, amts: raw, resid, T };
    };
    const ST = { done: ['Split invoiced', 'background:var(--okbg);color:var(--ok)'], ready: ['Ready to split', 'background:var(--tint);color:var(--accent2)'], conflict: ['Billed-to conflict', 'background:var(--warnbg);color:var(--warn)'] };
    const stOf = (b) => s.gen[b.id] ? 'done' : (b.conflict && !s.bt[b.id] ? 'conflict' : 'ready');
    const bls = B.map((b) => { const on = s.sel === b.id; const k = stOf(b); return { bl: b.bl, parties: b.parties.length, cntrs: b.parties.reduce((a, p) => a + p[2], 0), totalText: m(b.total), state: ST[k][0], chip: ST[k][1],
      on: on ? 'true' : 'false', border: on ? 'var(--accent)' : 'var(--line)', bg: on ? 'var(--tint)' : 'var(--surface)', pick: () => this.setState({ sel: b.id }) }; });
    const b = B.find((x) => x.id === s.sel) || B[0];
    const k = calc(b), done = !!s.gen[b.id];
    const PAY = { paid: ['Paid', 'background:var(--okbg);color:var(--ok)'], unpaid: ['Unpaid', 'background:var(--warnbg);color:var(--warn)'], partial: ['Partially paid', 'background:var(--tint);color:var(--accent2)'] };
    const UNIT = { cntr: 'Containers', cbm: 'CBM', kg: 'Weight (kg)' };
    const rows = b.parties.map((p, i) => {
      const pay = done ? p[5] : 'unpaid';
      const amd = s.amend[b.id];
      return { party: p[0], role: p[1], cn: p[2], cbm: p[3].toFixed(1), kg: p[4].toLocaleString('en-US'),
        pct: (p[idx] / k.base * 100).toFixed(2) + '%', amtText: m(k.amts[i]), resid: i === 0 && k.resid !== 0 ? (k.resid > 0 ? '+' : '') + k.resid.toFixed(2) + ' rounding' : '',
        inv: done ? b.bl.replace('BL-', '').replace('-', '').slice(0, 3) + 'OF26' + String(2500 + i + B.indexOf(b) * 5).padStart(5, '0') + (amd ? ' (re-issued)' : '') : '—',
        pay: done ? PAY[pay][0] : 'Not invoiced', payChip: done ? PAY[pay][1] : 'background:var(--neutral);color:var(--muted)',
        rel: done && pay === 'paid' ? p[2] + ' of ' + p[2] + ' released' : 'Held', relChip: done && pay === 'paid' ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--badbg);color:var(--bad)' };
    });
    const sumAmt = k.amts.reduce((a, v) => a + v, 0);
    const bal = Math.abs(sumAmt - k.T) < 0.005;
    const conflict = b.conflict && !s.bt[b.id];
    const chosen = s.bt[b.id];
    const steps = [
      ['Contract override', 'No contract override for this B/L', false],
      ['B/L term (prepaid / collect)', b.conflict ? 'Prepaid by shipper on the B/L manifest' : 'Collect · billed to consignee', !b.conflict || chosen === 'bl'],
      ['Booking-specific debtor', b.conflict ? 'Agency booking note: collect by consignee' : 'Split buyers named on the booking', chosen === 'agency' || (!b.conflict)],
      ['Default consignee', 'Used only when no earlier rule applies', false]
    ].map(([label, val, hit], i) => ({ n: i + 1, label, val, res: hit ? 'Applied' : (i === 0 ? 'Not set' : (conflict && (i === 1 || i === 2) ? 'Conflict' : 'Skipped')),
      chip: hit ? 'background:var(--okbg);color:var(--ok)' : (conflict && (i === 1 || i === 2) ? 'background:var(--warnbg);color:var(--warn)' : 'background:var(--neutral);color:var(--muted)'),
      bg: hit ? 'var(--okbg)' : 'var(--neutral)', fg: hit ? 'var(--ok)' : 'var(--muted)' }));
    return {
      bls, blCount: B.length + ' B/Ls', sel: { bl: b.bl, totalText: m(k.T) }, rows, h: { cntr: s.basis === 'cntr' ? 'color:var(--accent);font-weight:600' : '', cbm: s.basis === 'cbm' ? 'color:var(--accent);font-weight:600' : '', kg: s.basis === 'kg' ? 'color:var(--accent);font-weight:600' : '' }, basis: s.basis, setBasis: (e) => this.setState({ basis: e.target.value }),
      splitTotal: m(sumAmt), balText: bal ? 'Balanced to the cent' : 'Out of balance', balChip: bal ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--badbg);color:var(--bad)',
      steps, bt: { conflict, state: conflict ? 'Conflict' : (chosen ? 'Resolved' : 'Determined'), chip: conflict ? 'background:var(--warnbg);color:var(--warn)' : 'background:var(--okbg);color:var(--ok)',
        conflictText: 'B/L manifest says prepaid by shipper, but the agency booking note says collect by consignee. Choose the rule to apply before splitting.' },
      useBl: () => this.setState({ bt: { ...s.bt, [b.id]: 'bl' }, notice: 'B/L term applied for ' + b.bl + '. Decision recorded in the audit trail.' }),
      useAgency: () => this.setState({ bt: { ...s.bt, [b.id]: 'agency' }, notice: 'Agency booking note applied for ' + b.bl + '. Decision recorded in the audit trail.' }),
      cantGen: conflict || done, genLabel: done ? 'Split invoices generated' : 'Generate ' + b.parties.length + ' split invoices',
      generate: () => this.setState({ gen: { ...s.gen, [b.id]: true }, notice: b.parties.length + ' child invoices generated for ' + b.bl + ', linked to the master. Release codes go to LMS only for paid containers.' }),
      amd: { noAmend: !done || !!s.amend[b.id], text: s.amend[b.id] ? 'Master charges increased 5% (sample). Child invoices credited and re-issued with the new shares.' : (done ? 'No amendment since the split invoices were sent.' : 'Generate the split invoices first.'),
        style: s.amend[b.id] ? 'background:var(--okbg);color:var(--ok2)' : 'background:var(--neutral);color:var(--muted2)' },
      amend: () => this.setState({ amend: { ...s.amend, [b.id]: true }, notice: 'Master amendment applied to ' + b.bl + '. Affected child invoices credited and re-issued.' }),
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' })
    };
  }
}

      sbW: c ? '64px' : '240px', hide: c ? 'display:none' : '', item: c ? 'justify-content:center;padding-inline:0' : '',

<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:8px;height:76px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tile:hover{background:var(--hover3)}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>
</helmet>

          <div role="radiogroup" aria-label="Theme" style="display: flex; gap: 2px; height: 32px; padding: 2px; border-radius: 6px; background: var(--neutral); box-sizing: border-box">
            <button role="radio" aria-checked="{{shell.lightOn}}" onClick="{{shell.setLight}}" title="Light theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 4px; font-size: 12px; font-weight: 500; background: {{shell.lightBg}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Light
            </button>
            <button role="radio" aria-checked="{{shell.darkOn}}" onClick="{{shell.setDark}}" title="Dark theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 4px; font-size: 12px; font-weight: 500; background: {{shell.darkBg}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Dark
            </button>
          </div>
          <a href="approvals-inbox.html" class="btn btn-icon" aria-label="{{shell.pending}} pending approvals" title="{{shell.pending}} pending approvals" style="position: relative; text-decoration: none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
            <span class="mono" style="position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand); color: var(--onaccent); font-size: 11px; line-height: 18px; text-align: center; box-sizing: border-box">{{shell.pending}}</span>
          </a>
          <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 4px; border: 1px solid var(--line); border-radius: 18px; box-sizing: border-box">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--onaccent); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">U</span>
            <span style="display: flex; flex-direction: column; line-height: 14px"><span style="font-size: 12px; font-weight: 600">[User ID]</span><span style="font-size: 11px; color: var(--muted)">[Role]</span></span>
          </div>
        </div>
        <div style="min-height: 56px; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box">
          <div style="min-width: 0">
            <h1 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 22px">Charge Processing</h1>
            <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted)">Charges received from LMS · pre-generation validation, invoice holds and sanction screening before invoice generation</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <span style="display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            Batch run: [Timing anchor] + [n] days · configured per country
          </span>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: var(--line)"></span>
          <label for="itype" style="font-size: 12px; font-weight: 600; color: var(--muted)">Invoice type</label>
          <div style="position: relative">
            <select id="itype" class="select" value="{{itype}}" onChange="{{setType}}" style="width: 176px">
              <option value="Freight">Freight</option>
              <option value="Detention / Demurrage">Detention / Demurrage</option>
              <option value="Miscellaneous">Miscellaneous</option>
              <option value="Proforma">Proforma</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn btn-primary" onClick="{{generate}}" disabled="{{noReady}}">Generate invoices ({{readyCount}} eligible)</button>
          </div>
        </div>
      </div>
      <main style="flex: 1 0 auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 8px; background: var(--okbg); border: 1px solid var(--okbd); color: var(--ok2); box-sizing: border-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            {{notice}}
          </div>
        </sc-if>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{tiles}}" as="k" hint-placeholder-count="4">
            <button class="tile" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="border: 1px solid {{k.border}}; box-shadow: {{k.shadow}}">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{k.dot}}"></span>{{k.label}}</span>
              <span class="mono" style="font-size: 24px; font-weight: 500; line-height: 32px; color: {{k.color}}">{{k.value}}</span>
            </button>
          </sc-for>
        </div>

        <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section class="card" style="flex: 999 1 720px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">{{tableTitle}}</h2>
              <span class="card-meta">Status · Invoice Ready</span>
            </div>
            <div style="overflow-x: auto">
              <table>
                <thead><tr><th>B/L #</th><th>Customer</th><th>Charge</th><th>Ccy</th><th class="r">Amount</th><th>Sub-status</th><th>Reason</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: var(--accent)">{{r.bl}}</button></td>
                      <td style="{{r.cell}}">{{r.cust}}</td>
                      <td style="{{r.cell}}">{{r.charge}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.ccy}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.amt}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.chip}}">{{r.status}}</span></td>
                      <td style="color: var(--muted); {{r.cell}}">{{r.reason}}</td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; padding: 32px 16px; text-align: center; color: var(--muted)">No charges with this sub-status.</p>
              </sc-if>
            </div>
          </section>

          <section class="card" style="flex: 1 1 400px; max-width: 440px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">Pre-generation validation</h2>
              <span class="chip" style="{{sel.chip}}">{{sel.status}}</span>
            </div>
            <div style="padding: 16px; border-bottom: 1px solid var(--line2)">
              <div class="mono" style="font-size: 16px; font-weight: 500; line-height: 24px">{{sel.bl}}</div>
              <div style="margin-top: 2px; color: var(--muted)">{{sel.charge}} · {{sel.ccy}} {{sel.amt}} · {{sel.cust}}</div>
            </div>
            <ul style="list-style: none; margin: 0; padding: 4px 16px">
              <sc-for list="{{checks}}" as="c" hint-placeholder-count="10">
                <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; border-bottom: 1px solid var(--line2)">
                  <span style="display: flex; align-items: center; gap: 10px">
                    <span style="width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; background: {{c.dotBg}}; color: {{c.dotFg}}; font-size: 12px; font-weight: 700">{{c.icon}}</span>
                    <span>{{c.label}}</span>
                  </span>
                  <span class="chip" style="{{c.chip}}">{{c.state}}</span>
                </li>
              </sc-for>
            </ul>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="padding: 12px 14px; border-radius: 6px; {{sel.noteStyle}}">{{sel.note}}</div>
              <sc-if value="{{canCorrect}}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-primary" onClick="{{correct}}" style="align-self: flex-start">Correct data &amp; release hold</button>
              </sc-if>
              <sc-if value="{{canManual}}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-primary" onClick="{{manual}}" style="align-self: flex-start">Raise manual invoice</button>
              </sc-if>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

</div>
</script>
<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: 'all', selected: 'c3', fixed: {}, invoiced: {}, manualInv: {}, itype: 'Freight', notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const CHECKS = [
      ['roe', 'Exchange rate available'],
      ['party', 'Billing party customer code'],
      ['local', 'Local information present'],
      ['tax', 'Tax structure resolved'],
      ['payable', 'Bills payable matched to manifest'],
      ['fca', 'No pending FCA'],
      ['cancel', 'Booking not cancelled'],
      ['pc', 'No Generic PC linked on B/L'],
      ['charges', 'Charges available'],
      ['sanction', 'Sanction / blacklist screening']
    ];
    const reasonText = { roe: 'Exchange rate not available', party: 'Billing party customer code missing', local: 'Local information missing', tax: 'Tax structure not resolved', payable: 'Bills payable not matched to manifest', fca: 'Pending FCA', cancel: 'Cancelled booking — excluded from batch', pc: 'Generic PC linked on B/L', charges: 'No charges available' };
    const charges = [
      { id: 'c1', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Ocean Freight', ccy: 'USD', amt: 1850, fail: null },
      { id: 'c2', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Terminal Handling (THC)', ccy: 'SGD', amt: 410, fail: null },
      { id: 'c3', bl: 'BL-SG-24004', cust: '[Customer B]', charge: 'Ocean Freight', ccy: 'USD', amt: 2300, fail: 'party' },
      { id: 'c4', bl: 'BL-IN-24005', cust: '[Customer C]', charge: 'Documentation Fee', ccy: 'INR', amt: 2800, fail: 'tax' },
      { id: 'c5', bl: 'BL-CN-24003', cust: '[Customer D]', charge: 'Bunker / Environmental Surcharge', ccy: 'USD', amt: 320, fail: 'roe' },
      { id: 'c6', bl: 'BL-SG-24006', cust: '[Customer E]', charge: 'Demurrage', ccy: 'USD', amt: 380, fail: null, sanction: 'warn' },
      { id: 'c7', bl: 'BL-TH-24007', cust: '[Customer F]', charge: 'Ocean Freight', ccy: 'USD', amt: 1600, fail: 'fca' },
      { id: 'c8', bl: 'BL-SG-24002', cust: '[Customer G]', charge: 'Ocean Freight', ccy: 'USD', amt: 2100, fail: 'pc' },
      { id: 'c9', bl: 'BL-MY-24010', cust: '[Customer H]', charge: 'Lift on / lift off (LOLO)', ccy: 'MYR', amt: 180, fail: 'cancel' }
    ];
    const statusOf = (c) => {
      if (s.invoiced[c.id]) return 'inv';
      if (c.fail && !s.fixed[c.id]) return 'blocked';
      if (c.sanction === 'warn') return 'warning';
      return 'ready';
    };
    const META = {
      ready: { label: 'READY', chip: 'background:var(--okbg);color:var(--ok)', dot: 'var(--okdot)', color: 'var(--ok)' },
      warning: { label: 'WARNING', chip: 'background:var(--warnbg);color:var(--warn)', dot: 'var(--warnbar)', color: 'var(--warn)' },
      blocked: { label: 'BLOCKED', chip: 'background:var(--badbg);color:var(--bad)', dot: 'var(--badbar)', color: 'var(--bad)' },
      inv: { label: 'Invoiced', chip: 'background:var(--tint);color:var(--accent2)', dot: 'var(--accent)', color: 'var(--accent2)' }
    };
    const reasonOf = (c) => {
      const st = statusOf(c);
      if (st === 'inv') return s.manualInv[c.id] ? 'Manual invoice raised' : 'Invoice generated';
      if (st === 'blocked') return (c.fail === 'cancel' ? '' : 'On hold · ') + reasonText[c.fail];
      if (st === 'warning') return 'Sanction / blacklist match — warning, invoice can proceed';
      if (s.fixed[c.id]) return 'Hold released after correction';
      return '—';
    };
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const visible = charges.filter((c) => s.filter === 'all' || statusOf(c) === s.filter);
    const rows = visible.map((c) => {
      const st = statusOf(c), on = s.selected === c.id;
      return { ...c, amt: m(c.amt), status: META[st].label, chip: META[st].chip, reason: reasonOf(c),
        cell: on ? 'background:var(--tint);' : '', edge: on ? selEdge : '',
        select: () => this.setState({ selected: c.id }) };
    });
    const count = (k) => charges.filter((c) => statusOf(c) === k).length;
    const tiles = ['ready', 'warning', 'blocked', 'inv'].map((k) => {
      const on = s.filter === k;
      return { label: META[k].label, value: count(k), dot: META[k].dot, color: META[k].color, on: on ? 'true' : 'false',
        border: on ? 'var(--accent)' : 'var(--line)', shadow: on ? '0 0 0 1px var(--accent)' : 'none',
        pick: () => this.setState({ filter: on ? 'all' : k }) };
    });
    const sc = charges.find((c) => c.id === s.selected) || charges[0];
    const sst = statusOf(sc);
    const checks = CHECKS.map(([k, label]) => {
      let state = 'Passed', chip = META.ready.chip, icon = '✓', dotBg = 'var(--okbg)', dotFg = 'var(--ok)';
      if (k === 'sanction') {
        if (sc.sanction === 'warn') { state = 'Match · warning'; chip = META.warning.chip; icon = '!'; dotBg = 'var(--warnbg)'; dotFg = 'var(--warn)'; }
        else state = 'Clear';
      } else if (sc.fail === k && !s.fixed[sc.id]) { state = 'Failed'; chip = META.blocked.chip; icon = '×'; dotBg = 'var(--badbg)'; dotFg = 'var(--bad)'; }
      return { label, state, chip, icon, dotBg, dotFg };
    });
    const notes = {
      ready: ['All validations passed — eligible for invoice generation.', 'background:var(--okbg);color:var(--ok2)'],
      warning: ['Sanction / blacklist match raised as a warning. The invoice can still proceed.', 'background:var(--warnbg);color:var(--warn2)'],
      blocked: [sc.fail === 'cancel' ? 'Cancelled booking — not included in automatic invoicing. A manual invoice can be raised where charges apply.' : 'Invoice on hold — prerequisite not met. Correct the data to release the hold.', 'background:var(--badbg);color:var(--bad2)'],
      inv: ['Invoice generated for this charge.', 'background:var(--tint);color:var(--accent2)']
    };
    const readyIds = charges.filter((c) => statusOf(c) === 'ready' || statusOf(c) === 'warning').map((c) => c.id);
    return {
      itype: s.itype,
      setType: (e) => this.setState({ itype: e.target.value }),
      tiles, rows, empty: rows.length === 0, checks,
      tableTitle: s.filter === 'all' ? 'Charges received from LMS' : META[s.filter].label + ' charges',
      sel: { ...sc, amt: m(sc.amt), status: META[sst].label, chip: META[sst].chip, note: notes[sst][0], noteStyle: notes[sst][1] },
      canCorrect: sst === 'blocked' && sc.fail !== 'cancel',
      canManual: sst === 'blocked' && sc.fail === 'cancel',
      correct: () => this.setState({ fixed: { ...s.fixed, [sc.id]: true } }),
      manual: () => this.setState({ invoiced: { ...s.invoiced, [sc.id]: true }, manualInv: { ...s.manualInv, [sc.id]: true }, notice: 'Manual invoice raised for ' + sc.bl + ' (cancelled booking).' }),
      readyCount: readyIds.length, noReady: readyIds.length === 0,
      hasNotice: !!s.notice, notice: s.notice,
      generate: () => {
        const inv = { ...s.invoiced };
        readyIds.forEach((id) => { inv[id] = true; });
        this.setState({ invoiced: inv, notice: readyIds.length + ' ' + s.itype.toLowerCase() + ' charge(s) sent for invoice generation.' });
      }
    };
  }
}

class Component extends GirsPage {
  constructor(p) {
    super(p);
    let sb = false, th = 'light', hub = 'SIN', ent = 'PIL';
    try { sb = localStorage.getItem('girs.sb') === '1'; th = localStorage.getItem('girs.th') || 'light'; hub = localStorage.getItem('girs.hub') || 'SIN'; ent = localStorage.getItem('girs.ent') || 'PIL'; } catch (e) {}
    this.state = Object.assign({}, this.state, { __sb: sb, __th: th, __hub: hub, __ent: ent, __q: '' });
  }
  renderVals() {
    const v = super.renderVals();
    const s = this.state;
    const save = (k, val) => { try { localStorage.setItem(k, val); } catch (e) {} };
    const L = Object.assign({}, {"g0": "Operations", "nMain": "Operations Cockpit", "nChargeProcessing": "Charge Processing", "nDDEngine": "D&D Engine", "g1": "Invoicing", "nInvoicesHub": "Invoices Hub", "nInvoicePreviewer": "Invoice Previewer", "nCreditNotes": "Credit Notes", "nDARConsole": "DAR Console", "g2": "Receivables", "nReceipting": "Receipting", "nCashAppWorkbench": "CashApp Workbench", "nToleranceCOREOR": "Tolerance & COREOR", "nSOADashboard": "SOA & Aging", "g3": "Control", "nApprovalsInbox": "Approvals Inbox", "nEnquiry": "Enquiry & Monitoring", "g4": "Configure", "nTaxRules": "Tax Rules"}, v.navT || {});
    const c = s.__sb;
    return Object.assign({}, v, { shell: {
      theme: s.__th, dark: s.__th === 'dark',
      sbW: c ? '64px' : '240px', hide: c ? 'display:none' : '', item: c ? 'justify-content:center;padding-inline:0' : '',
      logo: c ? 'height:26px;width:30px;object-fit:cover;object-position:left center' : 'height:26px;width:auto',
      logoRow: c ? 'justify-content:center;padding:0' : 'padding:0 20px',
      sbLabel: c ? 'Expand side panel' : 'Collapse side panel', sbIcon: c ? 'M9 6l6 6-6 6' : 'M15 6l-6 6 6 6',
      toggleSb: () => { save('girs.sb', c ? '0' : '1'); this.setState({ __sb: !c }); },
      lightOn: s.__th === 'dark' ? 'false' : 'true', darkOn: s.__th === 'dark' ? 'true' : 'false',
      lightBg: s.__th === 'dark' ? 'transparent;color:var(--muted)' : 'var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)', darkBg: s.__th === 'dark' ? 'var(--tint);color:var(--accent2)' : 'transparent;color:var(--muted)',
      setLight: () => { save('girs.th', 'light'); this.setState({ __th: 'light' }); },
      setDark: () => { save('girs.th', 'dark'); this.setState({ __th: 'dark' }); },
      hub: s.__hub, setHub: (e) => { save('girs.hub', e.target.value); this.setState({ __hub: e.target.value }); },
      ent: s.__ent, setEnt: (e) => { save('girs.ent', e.target.value); this.setState({ __ent: e.target.value }); },
      q: s.__q, setQ: (e) => this.setState({ __q: e.target.value }), hasQ: !!s.__q, clearQ: () => this.setState({ __q: '' }),
      pending: 10, l: L
    } });
  }
}

</script>
<script src="runtime.js"></script>
</body>
</html>

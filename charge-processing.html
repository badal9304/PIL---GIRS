                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
                  <span class="mi-txt"><span class="mi-lbl">Language</span><span class="mi-sub" translate="no">{{shell.langName}}</span></span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--muted)"><path d="M9 6l6 6-6 6"></path></svg>
                </button>
                <div class="mi ap-row" role="none">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18" ></path><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path></svg>
                  <span class="mi-txt"><span class="mi-lbl">Appearance</span></span>
                  <div class="ap-seg" role="radiogroup" aria-label="Theme">
                    <button role="radio" aria-checked="{{shell.lightOn}}" onClick="{{shell.setLight}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span>Light</span></button>
                    <button role="radio" aria-checked="{{shell.darkOn}}" onClick="{{shell.setDark}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg><span>Dark</span></button>
                  </div>
                </div>
                <div class="menu-sep"></div>
                <button class="mi mi-danger" role="menuitem" onClick="{{shell.signOut}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg>
                  <span class="mi-lbl">Sign out</span>
                </button>
                </sc-if>
                <sc-if value="{{shell.langOpen}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px">
                    <button class="btn btn-icon btn-sm" aria-label="Back to profile menu" onClick="{{shell.toggleLang}}" style="width: 32px; padding: 0; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
                    <span style="font-weight: 600">Language</span>
                  </div>
                  <div style="padding: 0 6px 6px"><input class="input lg-q" style="width: 100%; height: 34px" placeholder="Search language" aria-label="Search language" autocomplete="off" value="{{shell.lgQ}}" onInput="{{shell.setLgQ}}"></div>
                  <div class="lg-list" role="group" aria-label="Languages" translate="no">
                    <sc-for list="{{shell.langs}}" as="g" hint-placeholder-count="4">
                      <button class="mi" role="menuitemradio" aria-checked="{{g.on}}" onClick="{{g.pick}}">
                        <span class="mi-txt"><span class="mi-lbl" lang="{{g.code}}">{{g.label}}</span><span class="mi-sub">{{g.en}}</span></span>
                        <span aria-hidden="true" style="flex: none; width: 16px; color: var(--accent); font-weight: 700; text-align: center">{{g.mark}}</span>
                      </button>
                    </sc-for>
                    <sc-if value="{{shell.lgNone}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 10px; color: var(--muted)">No language matches “{{shell.lgQ}}”</div></sc-if>
                  </div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </div>
        <div class="ghead" style="min-height: 56px; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box">
          <div style="min-width: 0">
            <h1 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 22px">Charge Processing</h1>
            <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted)">Charges received from LMS · pre-generation validation, invoice holds and sanction screening before invoice generation</p>
          </div>
          <div class="gright" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-inline-start: auto">
          <span style="display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            Batch run: [Timing anchor] + [n] days · configured per country
          </span>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: var(--line)"></span>
          <label for="itype" style="font-size: 12px; font-weight: 600; color: var(--muted)">Invoice type</label>
          <div style="position: relative">
            <select id="itype" class="select r-w" value="{{itype}}" onChange="{{setType}}" style="width: 176px">
              <option value="Freight">Freight</option>
              <option value="Detention / Demurrage">Detention / Demurrage</option>
              <option value="Miscellaneous">Miscellaneous</option>
              <option value="Proforma">Proforma</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn btn-primary" onClick="{{generate}}" disabled="{{noReady}}">Generate invoices ({{readyCount}} eligible)</button>
          </div>
        </div>
      </div>
      <main class="gmain" style="flex: 1 0 auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 8px; background: var(--okbg); border: 1px solid var(--okbd); color: var(--ok2); box-sizing: border-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            {{notice}}
          </div>
        </sc-if>

        <div class="r-g4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{tiles}}" as="k" hint-placeholder-count="4">
            <button class="tile" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="border: 1px solid {{k.border}}; box-shadow: {{k.shadow}}">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{k.dot}}"></span>{{k.label}}</span>
              <span class="mono" style="font-size: 24px; font-weight: 500; line-height: 32px; color: {{k.color}}">{{k.value}}</span>
            </button>
          </sc-for>
        </div>

        <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section class="card r-col" style="flex: 999 1 720px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">{{tableTitle}}</h2>
              <span class="card-meta">Status · Invoice Ready</span>
            </div>
            <div style="overflow-x: auto">
              <table>
                <thead><tr><th>B/L #</th><th>Customer</th><th>Charge</th><th>Ccy</th><th class="r">Amount</th><th>Sub-status</th><th>Reason</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: var(--accent)">{{r.bl}}</button></td>
                      <td style="{{r.cell}}">{{r.cust}}</td>
                      <td style="{{r.cell}}">{{r.charge}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.ccy}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.amt}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.chip}}">{{r.status}}</span></td>
                      <td style="color: var(--muted); {{r.cell}}">{{r.reason}}</td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; padding: 32px 16px; text-align: center; color: var(--muted)">No charges with this sub-status.</p>
              </sc-if>
            </div>
          </section>

          <section class="card r-col" style="flex: 1 1 400px; max-width: 440px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">Pre-generation validation</h2>
              <span class="chip" style="{{sel.chip}}">{{sel.status}}</span>
            </div>
            <div style="padding: 16px; border-bottom: 1px solid var(--line2)">
              <div class="mono" style="font-size: 16px; font-weight: 500; line-height: 24px">{{sel.bl}}</div>
              <div style="margin-top: 2px; color: var(--muted)">{{sel.charge}} · {{sel.ccy}} {{sel.amt}} · {{sel.cust}}</div>
            </div>
            <div class="r-wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 0; font-size: 12px"><span style="color: var(--muted)">{{passText}}</span><sc-if value="{{canToggle}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" onClick="{{toggleAll}}">{{toggleText}}</button></sc-if></div>
            <ul class="r-mxh" style="list-style: none; margin: 0; padding: 4px 16px; max-height: 520px; overflow-y: auto">
              <sc-for list="{{checksShown}}" as="c" hint-placeholder-count="10">
                <li class="r-wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 3px 0; font-size: 12px; line-height: 16px; border-bottom: 1px solid var(--line2)">
                  <span style="display: flex; align-items: center; gap: 10px">
                    <span style="width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; background: {{c.dotBg}}; color: {{c.dotFg}}; font-size: 12px; font-weight: 700">{{c.icon}}</span>
                    <span>{{c.label}}</span>
                  </span>
                  <span class="chip" style="{{c.chip}}">{{c.state}}</span>
                </li>
              </sc-for>
            </ul>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="padding: 12px 14px; border-radius: 6px; {{sel.noteStyle}}">{{sel.note}}</div>
              <sc-if value="{{isCredit}}" hint-placeholder-val="{{ false }}">
                <a class="btn btn-primary" href="credit-management.html" style="align-self: flex-start; text-decoration: none">Review credit hold</a>
              </sc-if>
              <sc-if value="{{canCorrect}}" hint-placeholder-val="{{ false }}">
                <div style="border: 1px solid var(--line); border-radius: 8px; overflow: hidden">
                  <div class="r-wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--sub); border-bottom: 1px solid var(--line2)"><span style="font-weight: 600">Resolve hold</span><span class="chip" style="{{fix.chip}}">{{fix.state}}</span></div>
                  <dl style="margin: 0; padding: 10px 14px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; font-size: 12px; line-height: 16px">
                    <dt style="color: var(--muted)">Reason code</dt><dd class="mono" style="margin: 0">{{fix.code}}</dd>
                    <dt style="color: var(--muted)">Field to fix</dt><dd style="margin: 0; font-weight: 500">{{fix.field}}</dd>
                    <dt style="color: var(--muted)">Fix in</dt><dd style="margin: 0">{{fix.src}}</dd>
                    <dt style="color: var(--muted)">Responsible</dt><dd style="margin: 0">{{fix.team}}</dd>
                  </dl>
                  <ol style="list-style: none; margin: 0; padding: 4px 14px 10px; border-top: 1px solid var(--line2)">
                    <sc-for list="{{fix.steps}}" as="t" hint-placeholder-count="4">
                      <li style="display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 12px">
                        <span aria-hidden="true" style="width: 18px; height: 18px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{t.bg}}; color: {{t.fg}}">{{t.icon}}</span>
                        <span style="flex: 1">{{t.label}}</span><span style="color: var(--muted)">{{t.when}}</span>
                      </li>
                    </sc-for>
                  </ol>
                  <sc-if value="{{fix.hasMsg}}" hint-placeholder-val="{{ false }}"><div style="margin: 0 14px 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 16px; {{fix.msgStyle}}">{{fix.msg}}</div></sc-if>
                  <sc-if value="{{fix.open2}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px">
                    <sc-if value="{{fix.canNotify}}" hint-placeholder-val="{{ true }}"><button class="btn btn-sm btn-primary" onClick="{{fix.notify}}">Notify responsible team</button></sc-if>
                    <button class="btn btn-sm" onClick="{{fix.open}}">{{fix.openLabel}}</button>
                    <button class="btn btn-sm" onClick="{{fix.revalidate}}" style="{{fix.revalStyle}}">Re-validate now</button>
                  </div></sc-if>
                  <p style="margin: 0; padding: 8px 14px 12px; border-top: 1px solid var(--line2); font-size: 12px; line-height: 16px; color: var(--muted)">GIRS does not edit source data. The correction is made in the owning system and synced back; the held charge then re-enters validation — no new invoice is created. Held charges are also re-checked automatically on the next batch run.</p>
                </div>
              </sc-if>
              <sc-if value="{{canManual}}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-primary" onClick="{{manual}}" style="align-self: flex-start">Raise manual invoice</button>
              </sc-if>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>


  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="gtoast" style="position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 520px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box">{{shell.toast}}<button class="btn btn-sm" onClick="{{shell.closeToast}}">Close</button></div>
  </sc-if>
</div>
</script>
<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: 'all', selected: 'c3', fixed: {}, notified: {}, reval: {}, invoiced: {}, manualInv: {}, itype: 'Freight', notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const CHECKS = [
      ['roe', 'Exchange rate available'],
      ['party', 'Billing party customer code'],
      ['cust', 'Customer details (name, email, phone, postal, state / city)'],
      ['local', 'Local information present'],
      ['tax', 'Tax structure resolved'],
      ['mand', 'Mandatory fields (customer code, HSN code)'],
      ['credit', 'Credit status · within limit, no hold'],
      ['payable', 'Bills payable matched to manifest'],
      ['fca', 'No pending FCA'],
      ['cancel', 'Booking not cancelled'],
      ['pc', 'No Generic PC linked on B/L'],
      ['charges', 'Charges available'],
      ['lines', 'No negative lines · half-up rounding, 2 dp'],
      ['late', 'No surcharge added after sailing'],
      ['sanction', 'Sanction / blacklist screening']
    ];
    const reasonText = { roe: 'Exchange rate not available', party: 'Billing party customer code missing', local: 'Local information missing', tax: 'Tax structure not resolved', payable: 'Bills payable not matched to manifest', fca: 'Pending FCA', cancel: 'Cancelled booking — excluded from batch', pc: 'Generic PC linked on B/L', charges: 'No charges available', cust: 'Customer details incomplete', mand: 'Mandatory field missing (HSN code)', credit: 'Credit hold — credit limit exceeded', lines: 'Negative charge line not allowed' };
    const charges = [
      { id: 'c1', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Ocean Freight', ccy: 'USD', amt: 1850, fail: null },
      { id: 'c2', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Terminal Handling (THC)', ccy: 'SGD', amt: 410, fail: null },
      { id: 'c3', bl: 'BL-SG-24004', cust: '[Customer B]', charge: 'Ocean Freight', ccy: 'USD', amt: 2300, fail: 'party' },
      { id: 'c4', bl: 'BL-IN-24005', cust: '[Customer C]', charge: 'Documentation Fee', ccy: 'INR', amt: 2800, fail: 'tax' },
      { id: 'c5', bl: 'BL-CN-24003', cust: '[Customer D]', charge: 'Bunker / Environmental Surcharge', ccy: 'USD', amt: 320, fail: 'roe' },
      { id: 'c6', bl: 'BL-SG-24006', cust: '[Customer E]', charge: 'Demurrage', ccy: 'USD', amt: 380, fail: null, sanction: 'warn' },
      { id: 'c7', bl: 'BL-TH-24007', cust: '[Customer F]', charge: 'Ocean Freight', ccy: 'USD', amt: 1600, fail: 'fca' },
      { id: 'c8', bl: 'BL-SG-24002', cust: '[Customer G]', charge: 'Ocean Freight', ccy: 'USD', amt: 2100, fail: 'pc' },
      { id: 'c9', bl: 'BL-MY-24010', cust: '[Customer H]', charge: 'Lift on / lift off (LOLO)', ccy: 'MYR', amt: 180, fail: 'cancel' },
      { id: 'c10', bl: 'BL-SG-24012', cust: '[Customer L]', charge: 'Ocean Freight', ccy: 'USD', amt: 1420, fail: 'cust' },
      { id: 'c11', bl: 'BL-IN-24013', cust: '[Customer N]', charge: 'Terminal Handling (THC)', ccy: 'INR', amt: 9600, fail: 'mand' },
      { id: 'c12', bl: 'BL-SG-24014', cust: '[Customer F]', charge: 'Ocean Freight', ccy: 'USD', amt: 3250, fail: 'credit' },
      { id: 'c13', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Reefer monitoring surcharge', ccy: 'USD', amt: 240, fail: null, late: true },
      { id: 'c14', bl: 'BL-SG-24015', cust: '[Customer M]', charge: 'Ocean Freight · promotional spot rate', ccy: 'USD', amt: 0, fail: null, zero: true },
      { id: 'c15', bl: 'BL-TH-24016', cust: '[Customer K]', charge: 'Documentation Fee', ccy: 'THB', amt: -500, fail: 'lines' }
    ];
    const statusOf = (c) => {
      if (s.invoiced[c.id]) return 'inv';
      if (c.fail && !s.fixed[c.id]) return 'blocked';
      if (c.sanction === 'warn' || c.late) return 'warning';
      return 'ready';
    };
    const META = {
      ready: { label: 'READY', chip: 'background:var(--okbg);color:var(--ok)', dot: 'var(--okdot)', color: 'var(--ok)' },
      warning: { label: 'WARNING', chip: 'background:var(--warnbg);color:var(--warn)', dot: 'var(--warnbar)', color: 'var(--warn)' },
      blocked: { label: 'BLOCKED', chip: 'background:var(--badbg);color:var(--bad)', dot: 'var(--badbar)', color: 'var(--bad)' },
      inv: { label: 'Invoiced', chip: 'background:var(--tint);color:var(--accent2)', dot: 'var(--accent)', color: 'var(--accent2)' }
    };
    const reasonOf = (c) => {
      const st = statusOf(c);
      if (st === 'inv') return s.manualInv[c.id] ? 'Manual invoice raised' : 'Invoice generated';
      if (st === 'blocked') return (c.fail === 'cancel' ? '' : 'On hold · ') + reasonText[c.fail];
      if (st === 'warning') return c.late ? 'Late surcharge after sailing — billing rule to be confirmed by PIL' : 'Sanction / blacklist match — warning, invoice can proceed';
      if (c.zero) return 'Zero-value line (100% discount) — accepted, balance check passed';
      if (s.fixed[c.id]) return 'Hold released after correction';
      return '—';
    };
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const visible = charges.filter((c) => s.filter === 'all' || statusOf(c) === s.filter);
    const rows = visible.map((c) => {
      const st = statusOf(c), on = s.selected === c.id;
      return { ...c, amt: m(c.amt), status: META[st].label, chip: META[st].chip, reason: reasonOf(c),
        cell: on ? 'background:var(--tint);' : '', edge: on ? selEdge : '',
        select: () => this.setState({ selected: c.id }) };
    });
    const count = (k) => charges.filter((c) => statusOf(c) === k).length;
    const tiles = ['ready', 'warning', 'blocked', 'inv'].map((k) => {
      const on = s.filter === k;
      return { label: META[k].label, value: count(k), dot: META[k].dot, color: META[k].color, on: on ? 'true' : 'false',
        border: on ? 'var(--accent)' : 'var(--line)', shadow: on ? '0 0 0 1px var(--accent)' : 'none',
        pick: () => this.setState({ filter: on ? 'all' : k }) };
    });
    const sc = charges.find((c) => c.id === s.selected) || charges[0];
    const sst = statusOf(sc);
    const checks = CHECKS.map(([k, label]) => {
      let state = 'Passed', chip = META.ready.chip, icon = '✓', dotBg = 'var(--okbg)', dotFg = 'var(--ok)';
      if (k === 'sanction') {
        if (sc.sanction === 'warn') { state = 'Match · warning'; chip = META.warning.chip; icon = '!'; dotBg = 'var(--warnbg)'; dotFg = 'var(--warn)'; }
        else state = 'Clear';
      } else if (k === 'late') {
        if (sc.late) { state = 'Late · supplementary'; chip = META.warning.chip; icon = '!'; dotBg = 'var(--warnbg)'; dotFg = 'var(--warn)'; }
      } else if (sc.fail === k && !s.fixed[sc.id]) { state = 'Failed'; chip = META.blocked.chip; icon = '×'; dotBg = 'var(--badbg)'; dotFg = 'var(--bad)'; }
      return { label, state, chip, icon, dotBg, dotFg };
    });
    const notes = {
      ready: ['All validations passed — eligible for invoice generation.', 'background:var(--okbg);color:var(--ok2)'],
      warning: [sc.late ? 'Surcharge added after vessel sailing. Billing treatment — supplementary invoice or debit note — to be confirmed by PIL.' : 'Sanction / blacklist match raised as a warning. The invoice can still proceed.', 'background:var(--warnbg);color:var(--warn2)'],

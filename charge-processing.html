<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIRS Charge Processing</title>
<link rel="icon" href="pil-logo.png">
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#161A21;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:#0071B7}a:hover{color:#005C96}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:#3A4556;text-decoration:none;font-size:13px;font-weight:500}
.nav-item:hover{background:#F1F3F6;color:#161A21}
.nav-on,.nav-on:hover{background:#EAF4FB;color:#0071B7;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid #C5CAD3;background:#fff;color:#161A21;font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#F1F3F6}
.btn-sm{height:32px;padding:0 12px}
.btn-primary{background:#0071B7;border-color:#0071B7;color:#fff}
.btn-primary:hover{background:#005C96;border-color:#005C96}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:2px solid #0071B7;outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select:hover,.input:hover{border-color:#8C95A3}
.input{height:36px;padding:0 12px;border:1px solid #C5CAD3;border-radius:6px;background:#fff;color:#161A21;font-family:inherit;font-size:13px;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:#fff;border:1px solid #DADDE3;border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid #DADDE3;box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:#5A6170}
.lbl{display:block;font-size:12px;font-weight:600;color:#5A6170;line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A6170;font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:#5A6170;padding:0 12px;border-bottom:1px solid #DADDE3;white-space:nowrap;background:#F7F8FA;box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid #ECEEF2;vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:#F7F9FC}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:#0071B7;cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:#0071B7;cursor:pointer}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:8px;height:76px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tile:hover{background:#FBFCFD}
.rowbtn{all:unset;cursor:pointer;display:inline-block}
.rowbtn:focus-visible{outline:2px solid #0071B7;outline-offset:2px}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <div aria-hidden="true" style="height: 3px; background: #E31D1A; flex: none"></div>
  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside style="flex: 1 0 240px; max-width: 240px; background: #fff; border-inline-end: 1px solid #DADDE3; display: flex; flex-direction: column; box-sizing: border-box">
      <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #ECEEF2; box-sizing: border-box">
        <img src="pil-logo.png" alt="PIL" style="height: 26px; width: auto; display: block">
        <span style="width: 1px; height: 20px; background: #DADDE3"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: #0071B7">GIRS</span>
      </div>
      <nav aria-label="Screens" style="display: flex; flex-direction: column; gap: 20px; padding: 16px 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Operations</div>
          <a href="index.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.3 19a10 10 0 1 1 17.4 0"></path><path d="M12 14l4-4"></path></svg>
            <span>Operations Cockpit</span>
          </a>
          <a href="charge-processing.html" class="nav-item nav-on" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path><circle cx="19" cy="18" r="2"></circle></svg>
            <span>Charge Processing</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Invoicing</div>
          <a href="invoice-previewer.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
            <span>Invoice Previewer</span>
          </a>
          <a href="credit-notes.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15h6"></path></svg>
            <span>Credit Notes</span>
          </a>
          <a href="dar-console.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
            <span>DAR Console</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Receivables</div>
          <a href="receipting.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h7"></path><path d="M15 17l2 2 4-4"></path></svg>
            <span>Receipting</span>
          </a>
          <a href="cashapp-workbench.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>
            <span>CashApp Workbench</span>
          </a>
          <a href="tolerance-coreor.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
            <span>Tolerance &amp; COREOR</span>
          </a>
          <a href="soa-aging.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
            <span>SOA &amp; Aging</span>
          </a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="k" style="padding: 0 12px; margin-bottom: 4px">Enquiry</div>
          <a href="enquiry.html" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <span>Enquiry &amp; Monitoring</span>
          </a>
        </div>
      </nav>
    </aside>

    <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
      <header style="min-height: 64px; background: #fff; border-bottom: 1px solid #DADDE3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 24px; box-sizing: border-box">
        <div style="min-width: 0">
          <h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Charge Processing</h1>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5A6170">Charges received from LMS · pre-generation validation, invoice holds and sanction screening before invoice generation</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span style="display: inline-flex; align-items: center; gap: 6px; color: #5A6170; font-size: 12px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            Batch run: [Timing anchor] + [n] days · configured per country
          </span>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: #DADDE3"></span>
          <label for="itype" style="font-size: 12px; font-weight: 600; color: #5A6170">Invoice type</label>
          <div style="position: relative">
            <select id="itype" class="select" value="{{itype}}" onChange="{{setType}}" style="width: 176px">
              <option value="Freight">Freight</option>
              <option value="Detention / Demurrage">Detention / Demurrage</option>
              <option value="Miscellaneous">Miscellaneous</option>
              <option value="Proforma">Proforma</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 10px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn btn-primary" onClick="{{generate}}" disabled="{{noReady}}">Generate invoices ({{readyCount}} eligible)</button>
        </div>
      </header>

      <main style="flex: 1 1 auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 8px; background: #E6F3EC; border: 1px solid #BFE0CC; color: #1A5C3B; box-sizing: border-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            {{notice}}
          </div>
        </sc-if>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{tiles}}" as="k" hint-placeholder-count="4">
            <button class="tile" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="border: 1px solid {{k.border}}; box-shadow: {{k.shadow}}">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #5A6170"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{k.dot}}"></span>{{k.label}}</span>
              <span class="mono" style="font-size: 24px; font-weight: 500; line-height: 32px; color: {{k.color}}">{{k.value}}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
          <section class="card" style="flex: 999 1 720px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">{{tableTitle}}</h2>
              <span class="card-meta">Status · Invoice Ready</span>
            </div>
            <div style="overflow-x: auto">
              <table>
                <thead><tr><th>B/L #</th><th>Customer</th><th>Charge</th><th>Ccy</th><th class="r">Amount</th><th>Sub-status</th><th>Reason</th></tr></thead>
                <tbody>
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                    <tr style="cursor: pointer" onClick="{{r.select}}">
                      <td style="{{r.edge}}"><button class="rowbtn mono" onClick="{{r.select}}" style="font-weight: 500; color: #0071B7">{{r.bl}}</button></td>
                      <td style="{{r.cell}}">{{r.cust}}</td>
                      <td style="{{r.cell}}">{{r.charge}}</td>
                      <td class="mono" style="{{r.cell}}">{{r.ccy}}</td>
                      <td class="mono r" style="{{r.cell}}">{{r.amt}}</td>
                      <td style="{{r.cell}}"><span class="chip" style="{{r.chip}}">{{r.status}}</span></td>
                      <td style="color: #5A6170; {{r.cell}}">{{r.reason}}</td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; padding: 32px 16px; text-align: center; color: #5A6170">No charges with this sub-status.</p>
              </sc-if>
            </div>
          </section>

          <section class="card" style="flex: 1 1 400px; max-width: 440px; min-width: 0; overflow: hidden">
            <div class="card-head">
              <h2 class="card-title">Pre-generation validation</h2>
              <span class="chip" style="{{sel.chip}}">{{sel.status}}</span>
            </div>
            <div style="padding: 16px; border-bottom: 1px solid #ECEEF2">
              <div class="mono" style="font-size: 16px; font-weight: 500; line-height: 24px">{{sel.bl}}</div>
              <div style="margin-top: 2px; color: #5A6170">{{sel.charge}} · {{sel.ccy}} {{sel.amt}} · {{sel.cust}}</div>
            </div>
            <ul style="list-style: none; margin: 0; padding: 4px 16px">
              <sc-for list="{{checks}}" as="c" hint-placeholder-count="10">
                <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; border-bottom: 1px solid #ECEEF2">
                  <span style="display: flex; align-items: center; gap: 10px">
                    <span style="width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; background: {{c.dotBg}}; color: {{c.dotFg}}; font-size: 12px; font-weight: 700">{{c.icon}}</span>
                    <span>{{c.label}}</span>
                  </span>
                  <span class="chip" style="{{c.chip}}">{{c.state}}</span>
                </li>
              </sc-for>
            </ul>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="padding: 12px 14px; border-radius: 6px; {{sel.noteStyle}}">{{sel.note}}</div>
              <sc-if value="{{canCorrect}}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-primary" onClick="{{correct}}" style="align-self: flex-start">Correct data &amp; release hold</button>
              </sc-if>
              <sc-if value="{{canManual}}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-primary" onClick="{{manual}}" style="align-self: flex-start">Raise manual invoice</button>
              </sc-if>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

</div>
</script>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: 'all', selected: 'c3', fixed: {}, invoiced: {}, manualInv: {}, itype: 'Freight', notice: '' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const CHECKS = [
      ['roe', 'Exchange rate available'],
      ['party', 'Billing party customer code'],
      ['local', 'Local information present'],
      ['tax', 'Tax structure resolved'],
      ['payable', 'Bills payable matched to manifest'],
      ['fca', 'No pending FCA'],
      ['cancel', 'Booking not cancelled'],
      ['pc', 'No Generic PC linked on B/L'],
      ['charges', 'Charges available'],
      ['sanction', 'Sanction / blacklist screening']
    ];
    const reasonText = { roe: 'Exchange rate not available', party: 'Billing party customer code missing', local: 'Local information missing', tax: 'Tax structure not resolved', payable: 'Bills payable not matched to manifest', fca: 'Pending FCA', cancel: 'Cancelled booking — excluded from batch', pc: 'Generic PC linked on B/L', charges: 'No charges available' };
    const charges = [
      { id: 'c1', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Ocean Freight', ccy: 'USD', amt: 1850, fail: null },
      { id: 'c2', bl: 'BL-SG-24001', cust: '[Customer A]', charge: 'Terminal Handling (THC)', ccy: 'SGD', amt: 410, fail: null },
      { id: 'c3', bl: 'BL-SG-24004', cust: '[Customer B]', charge: 'Ocean Freight', ccy: 'USD', amt: 2300, fail: 'party' },
      { id: 'c4', bl: 'BL-IN-24005', cust: '[Customer C]', charge: 'Documentation Fee', ccy: 'INR', amt: 2800, fail: 'tax' },
      { id: 'c5', bl: 'BL-CN-24003', cust: '[Customer D]', charge: 'Bunker / Environmental Surcharge', ccy: 'USD', amt: 320, fail: 'roe' },
      { id: 'c6', bl: 'BL-SG-24006', cust: '[Customer E]', charge: 'Demurrage', ccy: 'USD', amt: 380, fail: null, sanction: 'warn' },
      { id: 'c7', bl: 'BL-TH-24007', cust: '[Customer F]', charge: 'Ocean Freight', ccy: 'USD', amt: 1600, fail: 'fca' },
      { id: 'c8', bl: 'BL-SG-24002', cust: '[Customer G]', charge: 'Ocean Freight', ccy: 'USD', amt: 2100, fail: 'pc' },
      { id: 'c9', bl: 'BL-MY-24010', cust: '[Customer H]', charge: 'Lift on / lift off (LOLO)', ccy: 'MYR', amt: 180, fail: 'cancel' }
    ];
    const statusOf = (c) => {
      if (s.invoiced[c.id]) return 'inv';
      if (c.fail && !s.fixed[c.id]) return 'blocked';
      if (c.sanction === 'warn') return 'warning';
      return 'ready';
    };
    const META = {
      ready: { label: 'READY', chip: 'background:#E6F3EC;color:#1F6B45', dot: '#1F8A55', color: '#1F6B45' },
      warning: { label: 'WARNING', chip: 'background:#FDF0E3;color:#8A4200', dot: '#C86B10', color: '#8A4200' },
      blocked: { label: 'BLOCKED', chip: 'background:#FBEAEA;color:#A3262A', dot: '#B3363A', color: '#A3262A' },
      inv: { label: 'Invoiced', chip: 'background:#EAF4FB;color:#005C96', dot: '#0071B7', color: '#005C96' }
    };
    const reasonOf = (c) => {
      const st = statusOf(c);
      if (st === 'inv') return s.manualInv[c.id] ? 'Manual invoice raised' : 'Invoice generated';
      if (st === 'blocked') return (c.fail === 'cancel' ? '' : 'On hold · ') + reasonText[c.fail];
      if (st === 'warning') return 'Sanction / blacklist match — warning, invoice can proceed';
      if (s.fixed[c.id]) return 'Hold released after correction';
      return '—';
    };
    const selEdge = 'background:#EAF4FB;box-shadow:inset 3px 0 0 #0071B7;';
    const visible = charges.filter((c) => s.filter === 'all' || statusOf(c) === s.filter);
    const rows = visible.map((c) => {
      const st = statusOf(c), on = s.selected === c.id;
      return { ...c, amt: m(c.amt), status: META[st].label, chip: META[st].chip, reason: reasonOf(c),
        cell: on ? 'background:#EAF4FB;' : '', edge: on ? selEdge : '',
        select: () => this.setState({ selected: c.id }) };
    });
    const count = (k) => charges.filter((c) => statusOf(c) === k).length;
    const tiles = ['ready', 'warning', 'blocked', 'inv'].map((k) => {
      const on = s.filter === k;
      return { label: META[k].label, value: count(k), dot: META[k].dot, color: META[k].color, on: on ? 'true' : 'false',
        border: on ? '#0071B7' : '#DADDE3', shadow: on ? '0 0 0 1px #0071B7' : 'none',
        pick: () => this.setState({ filter: on ? 'all' : k }) };
    });
    const sc = charges.find((c) => c.id === s.selected) || charges[0];
    const sst = statusOf(sc);
    const checks = CHECKS.map(([k, label]) => {
      let state = 'Passed', chip = META.ready.chip, icon = '✓', dotBg = '#E6F3EC', dotFg = '#1F6B45';
      if (k === 'sanction') {
        if (sc.sanction === 'warn') { state = 'Match · warning'; chip = META.warning.chip; icon = '!'; dotBg = '#FDF0E3'; dotFg = '#8A4200'; }
        else state = 'Clear';
      } else if (sc.fail === k && !s.fixed[sc.id]) { state = 'Failed'; chip = META.blocked.chip; icon = '×'; dotBg = '#FBEAEA'; dotFg = '#A3262A'; }
      return { label, state, chip, icon, dotBg, dotFg };
    });
    const notes = {
      ready: ['All validations passed — eligible for invoice generation.', 'background:#E6F3EC;color:#1A5C3B'],
      warning: ['Sanction / blacklist match raised as a warning. The invoice can still proceed.', 'background:#FDF0E3;color:#7A3A00'],
      blocked: [sc.fail === 'cancel' ? 'Cancelled booking — not included in automatic invoicing. A manual invoice can be raised where charges apply.' : 'Invoice on hold — prerequisite not met. Correct the data to release the hold.', 'background:#FBEAEA;color:#8E1F23'],
      inv: ['Invoice generated for this charge.', 'background:#EAF4FB;color:#005C96']
    };
    const readyIds = charges.filter((c) => statusOf(c) === 'ready' || statusOf(c) === 'warning').map((c) => c.id);
    return {
      itype: s.itype,
      setType: (e) => this.setState({ itype: e.target.value }),
      tiles, rows, empty: rows.length === 0, checks,
      tableTitle: s.filter === 'all' ? 'Charges received from LMS' : META[s.filter].label + ' charges',
      sel: { ...sc, amt: m(sc.amt), status: META[sst].label, chip: META[sst].chip, note: notes[sst][0], noteStyle: notes[sst][1] },
      canCorrect: sst === 'blocked' && sc.fail !== 'cancel',
      canManual: sst === 'blocked' && sc.fail === 'cancel',
      correct: () => this.setState({ fixed: { ...s.fixed, [sc.id]: true } }),
      manual: () => this.setState({ invoiced: { ...s.invoiced, [sc.id]: true }, manualInv: { ...s.manualInv, [sc.id]: true }, notice: 'Manual invoice raised for ' + sc.bl + ' (cancelled booking).' }),
      readyCount: readyIds.length, noReady: readyIds.length === 0,
      hasNotice: !!s.notice, notice: s.notice,
      generate: () => {
        const inv = { ...s.invoiced };
        readyIds.forEach((id) => { inv[id] = true; });
        this.setState({ invoiced: inv, notice: readyIds.length + ' ' + s.itype.toLowerCase() + ' charge(s) sent for invoice generation.' });
      }
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>

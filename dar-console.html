<script type="text/x-dc-template" id="tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root,.theme{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#6B7280;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96}
.theme[data-theme=dark]{--ink:#E6E9EE;--muted:#9AA3B2;--muted2:#C3CAD5;--muted3:#C3CAD5;--muted4:#8B94A5;--line:#2C333E;--line2:#232A34;--bd:#3A4350;--bdh:#5D6878;--line3:#3A4350;--bg:#0E1116;--sub:#1B212A;--hover:#222934;--hover2:#1A2029;--hover3:#1A2029;--neutral:#262D38;--canvas:#0B0E13;--accent:#2A86CC;--accent2:#7DBDEE;--tint:#13263A;--tintbd:#1F4566;--tint2:#14222F;--ok:#5FC896;--okbg:#12291E;--ok2:#7AD3A6;--okdot:#3FB97A;--okbar:#3FB97A;--okbd:#1F4A33;--okrow:#132219;--warn:#F0A35C;--warnbg:#2E1F10;--warn2:#F5B37A;--warnbar:#E08A2E;--warnbd:#5A3A17;--bad:#F08A8C;--badbg:#321718;--badbar:#E0575B;--bad2:#F5A3A5;--badbd:#5C2A2C;--badrow:#24181A;--aibg:#241C38;--ai:#B9A4F2;--surface:#161B22;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#1F6FAE;color-scheme:dark}
.theme[data-theme=dark] .paper,.paper{--ink:#161A21;--muted:#5A6170;--muted2:#3A4556;--muted3:#33405A;--muted4:#6B7280;--line:#DADDE3;--line2:#ECEEF2;--bd:#C5CAD3;--bdh:#8C95A3;--line3:#C9CED6;--bg:#F4F5F7;--sub:#F7F8FA;--hover:#F1F3F6;--hover2:#F7F9FC;--hover3:#FBFCFD;--neutral:#EEF1F5;--canvas:#E4E7EC;--accent:#0071B7;--accent2:#005C96;--tint:#EAF4FB;--tintbd:#B9D9EE;--tint2:#F2F8FC;--ok:#1F6B45;--okbg:#E6F3EC;--ok2:#1A5C3B;--okdot:#1F8A55;--okbar:#2E8B57;--okbd:#BFE0CC;--okrow:#F1F8F4;--warn:#8A4200;--warnbg:#FDF0E3;--warn2:#7A3A00;--warnbar:#C86B10;--warnbd:#F0C899;--bad:#A3262A;--badbg:#FBEAEA;--badbar:#B3363A;--bad2:#8E1F23;--badbd:#E9B7B9;--badrow:#FFF8F8;--aibg:#F1ECFB;--ai:#5B3BA8;--surface:#FFFFFF;--brand:#E31D1A;--onaccent:#FFFFFF;--accenth:#005C96;color-scheme:light;color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:0;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-grp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px 0 12px;border-radius:0;color:var(--muted)}
.nav-grp:hover{background:var(--hover);color:var(--ink)}
.nav-grp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:0;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:0;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:0;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:0;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:0;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:12px;letter-spacing: .32px;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}

.select:focus,.select:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.select:active{background:var(--sub)}
.select:disabled{background:var(--bg);color:var(--muted4);border-color:var(--line);cursor:not-allowed}
.input:focus,.input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
@supports (appearance: base-select){
.select,.select::picker(select){appearance:base-select}
.select{display:inline-flex;align-items:center;line-height:normal}
.select::picker-icon{display:none}
.select::picker(select){margin-top:4px;padding:4px;border:1px solid var(--line);border-radius:0;background:var(--surface);box-shadow:0 10px 28px rgba(22,26,33,.16);max-height:min(360px,60vh);min-width:anchor-size(width)}
.select option{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px;border-radius:0;color:var(--ink);font-size:13px;line-height:18px;cursor:pointer;outline:none}
.select option::checkmark{order:2;margin-inline-start:auto;color:var(--accent);font-weight:700}
.select option:hover{background:var(--hover)}
.select option:focus-visible{background:var(--hover);box-shadow:inset 0 0 0 2px var(--accent)}
.select option:active{background:var(--neutral)}
.select option:checked{background:var(--tint);color:var(--accent2);font-weight:600}
.select option:disabled{color:var(--muted4);cursor:not-allowed}
.select:open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.select:open + svg{transform:rotate(180deg)}
}
.select + svg{transition:transform .15s ease}
.menu{position:absolute;top:44px;inset-inline-end:0;z-index:30;width:296px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:0;box-shadow:0 12px 32px rgba(22,26,33,.16);padding:6px;box-sizing:border-box}
.menu-sep{height:1px;background:var(--line2);margin:6px 4px}
.mi{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 10px;border-radius:0;color:var(--ink);font-size:13px;line-height:18px;cursor:pointer;text-decoration:none;text-align:start}
.mi:hover{background:var(--hover);color:var(--ink)}
.mi:active{background:var(--neutral)}
.mi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mi[aria-checked=true]{background:var(--tint);color:var(--accent2)}
.mi[aria-checked=true] .mi-sub{color:var(--accent2)}
.mi svg{flex:none;color:var(--muted)}
.mi[aria-checked=true] svg{color:var(--accent)}
.mi-txt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.mi-lbl{font-weight:500;white-space:normal}
.mi-sub{font-size:12px;line-height:16px;color:var(--muted);white-space:normal}
.mi-danger{color:var(--bad)}.mi-danger svg{color:var(--bad)}.mi-danger:hover{background:var(--badbg);color:var(--bad)}
.ubtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 4px;border:1px solid var(--line);border-radius:18px;box-sizing:border-box;transition:background .12s,border-color .12s}
.ubtn:hover{background:var(--hover);border-color:var(--bd)}
.ubtn:active{background:var(--neutral)}
.ubtn[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,183,.20)}
.ubtn[aria-expanded=true] .uchev{transform:rotate(180deg)}
.ubtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uchev{transition:transform .15s ease}
tr[data-found=true] td{animation:gfound 2.8s ease-out 1}
@keyframes gfound{0%,40%{background:rgba(255,190,0,.30)}100%{background:transparent}}
.gfind{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 8px 0 14px;border-radius:0;background:var(--tint);border:1px solid var(--tintbd);color:var(--accent2);box-sizing:border-box;flex-wrap:wrap}
.gmenu,.gdclose,.gdctx,.gscrim{display:none !important}

/* ===== IBM Carbon alignment (structure, type, spacing, shape) · colours stay PIL ===== */
body{font-size:14px;line-height:18px;letter-spacing:.16px}
.btn{height:40px;padding:0 16px;border-radius:0;font-size:14px;font-weight:400;letter-spacing:.16px;border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn:hover{background:var(--accent);color:var(--onaccent)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:40px;padding:0;justify-content:center}
.btn-sm.btn-icon{width:32px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth);color:var(--onaccent)}
.btn-primary:disabled:hover{background:var(--accent);color:var(--onaccent)}
.select{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.btn:disabled:hover{background:var(--surface);color:var(--accent)}
.input,.select{height:40px;border:0;border-bottom:1px solid var(--muted4);border-radius:0;background:var(--bg);font-size:14px;padding-inline:16px}
.select{padding-inline:12px 36px}
.select-sm{height:32px;font-size:14px}
.input:focus,.input:focus-visible,.select:focus,.select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;box-shadow:none;border-bottom-color:transparent}
.lbl{font-size:12px;font-weight:400;letter-spacing:.32px;line-height:16px;margin-bottom:8px}
.k{font-size:12px;font-weight:400;letter-spacing:.32px;text-transform:none}
.chip{border-radius:24px !important;font-size:12px;font-weight:400;letter-spacing:.32px;padding:0 8px;height:24px}
.card{border-radius:0}
.card-head{min-height:48px;padding:0 16px}
.card-title{font-size:16px;font-weight:600;line-height:22px}
.card-meta{font-size:12px;letter-spacing:.32px}
th{height:40px;font-size:14px;font-weight:600;color:var(--ink);padding:0 16px;background:var(--neutral);border-bottom:0;letter-spacing:.16px}
td{height:40px;font-size:14px;padding:0 16px;letter-spacing:.16px}
.nav-item{border-radius:0;font-size:14px;font-weight:400}
.nav-on,.nav-on:hover{font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-grp{border-radius:0}
.nav-grp .k{font-size:14px;font-weight:600;letter-spacing:.16px;text-transform:none;color:var(--ink)}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:64px;padding:12px 16px;border-radius:0}
.step{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:56px;padding:0 16px;display:flex;align-items:center;gap:12px}
.step:disabled{cursor:default}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stat{padding:12px 16px;border-radius:0}</style>
</helmet>
<div class="theme groot" data-theme="{{shell.theme}}"  style="zoom: {{shell.zoom}}; height: {{shell.rootH}}; min-height: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="height: 3px; background: var(--brand); flex: none"></div>
  <div style="flex: 1 1 auto; min-height: 0; display: flex">
    <sc-if value="{{shell.drawerOpen}}" hint-placeholder-val="{{ false }}"><div class="gscrim" onClick="{{shell.closeDrawer}}" aria-hidden="true"></div></sc-if>
    <aside id="gside" class="gside" data-drawer="{{shell.drawer}}" aria-label="Side panel" style="flex: none; width: {{shell.sbW}}; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; transition: width .18s ease">
      <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line2); box-sizing: border-box; {{shell.logoRow}}">
        <span style="display: inline-flex; background: white; border-radius: 0; padding: 2px 4px"><img src="pil-logo.png" alt="PIL" style="display: block; {{shell.logo}}"></span>
        <span style="width: 1px; height: 20px; background: var(--line); {{shell.hide}}"></span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); {{shell.hide}}">GIRS</span>
        <button class="btn btn-icon btn-sm gdclose" onClick="{{shell.closeDrawer}}" aria-label="Close menu" style="margin-inline-start: auto; width: 32px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="gdctx" style="flex: none; flex-direction: column; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line2)">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px">
          <div style="position: relative"><label for="dhub" class="sr">Hub</label><select id="dhub" class="select select-sm" value="{{shell.hub}}" onChange="{{shell.setHub}}" style="width: 100%"><option value="SIN">Singapore · SIN</option><option value="NSA">India · NSA</option><option value="LCH">Thailand · LCH</option><option value="PKG">Malaysia · PKG</option><option value="JED">Saudi Arabia · JED</option><option value="ZLO">Mexico · ZLO</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
          <div style="position: relative"><label for="dent" class="sr">Entity</label><select id="dent" class="select select-sm" value="{{shell.ent}}" onChange="{{shell.setEnt}}" style="width: 100%"><option value="PIL">PIL</option><option value="MELL">MELL</option><option value="MSC">MSC</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span class="chip" title="Fiscal period" style="background: var(--okbg); color: var(--ok); height: 28px; border-radius: 0"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--okdot)"></span>[Fiscal period] · Open</span>
          <div role="radiogroup" aria-label="Theme" style="display: flex; gap: 2px; height: 32px; padding: 2px; border-radius: 0; background: var(--neutral); box-sizing: border-box">
            <button role="radio" aria-checked="{{shell.lightOn}}" onClick="{{shell.setLight}}" aria-label="Light theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 0; background: {{shell.lightBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
            <button role="radio" aria-checked="{{shell.darkOn}}" onClick="{{shell.setDark}}" aria-label="Dark theme" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 0; background: {{shell.darkBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
          </div>
        </div>
      </div>
      <nav aria-label="Screens" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 16px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <button class="nav-grp" aria-expanded="{{shell.accA.g0}}" aria-controls="ng-g0" onClick="{{shell.accT.g0}}" style="{{shell.hide}}">
            <span class="k" style="flex: 1 1 auto; display: inline-flex; align-items: center; color: inherit">{{shell.l.g0}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{shell.accR.g0}}); transition: transform .15s"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{shell.acc.g0}}" hint-placeholder-val="{{ true }}">
            <div id="ng-g0" style="display: flex; flex-direction: column; gap: 2px">
          <a href="index.html" class="nav-item" title="{{shell.l.nMain}}" style="{{shell.item}}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.3 19a10 10 0 1 1 17.4 0"></path><path d="M12 14l4-4"></path></svg>

            <span class="mono" style="position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand); color: var(--onaccent); font-size: 12px; line-height: 18px; text-align: center; box-sizing: border-box">{{shell.pending}}</span>

        <div class="ghead" style="min-height: 56px; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box">

                      <span class="r-wrap" style="display: flex; align-items: center; gap: 16px">

              <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">

                <div class="r-g2m" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

                <sc-if value="{{carrierFault}}" hint-placeholder-val="{{ false }}">

                  <input id="pct" type="range" min="0" max="100" step="5" value="{{pct}}" onChange="{{setPct}}" onInput="{{setPct}}">

                <div class="r-g3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">

                  <div class="stat" style="background: var(--tint)"><div class="k" style="color: var(--accent2)">Waiver</div><div class="mono" style="font-size: 18px; line-height: 28px; margin-top: 4px; color: var(--accent2)">USD {{waiverAmt}}</div></div>
                  <div class="stat" style="background: var(--bg)"><div class="k">Remaining payable</div><div class="mono" style="font-size: 18px; line-height: 28px; margin-top: 4px">USD {{remainAmt}}</div></div>

                <sc-if value="{{overGm}}" hint-placeholder-val="{{ false }}">

                </sc-if>

              <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
                <h2 class="card-title" style="font-size: 15px">Review &amp; submit</h2>
                <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
                  <dl class="r-gs r-col" style="flex: 1 1 360px; margin: 0; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px 16px">
                    <dt style="color: var(--muted)">Charge</dt><dd style="margin: 0">{{selCharge.type}} · <span class="mono">{{selCharge.bl}}</span></dd>
                    <dt style="color: var(--muted)">Reason</dt><dd style="margin: 0">{{reasonLabel}}</dd>
                    <dt style="color: var(--muted)">Waiver</dt><dd class="mono" style="margin: 0">{{pct}}% · USD {{waiverAmt}}</dd>

                  <sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">

                      <sc-for list="{{timeline}}" as="t" hint-placeholder-count="4">
                        <li style="display: flex; gap: 12px; align-items: flex-start; padding: 8px 0">
                          <span style="width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: {{t.dot}}; flex: none"></span>
                          <span style="display: flex; flex-direction: column"><span style="font-weight: 500; color: {{t.fg}}">{{t.label}}</span><span style="font-size: 12px; line-height: 16px; color: var(--muted)">{{t.sub}}</span></span>

                <sc-if value="{{isPaid}}" hint-placeholder-val="{{ false }}">

                    <div style="display: flex; flex-wrap: wrap; gap: 24px">

                      <label style="display: flex; align-items: center; gap: 8px; height: 32px; cursor: pointer"><input type="radio" name="settle" checked="{{settleRefund}}" onChange="{{pickRefund}}">Refund</label>
                    </div>

            <div class="r-wrap" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; height: 64px; padding: 0 24px; border-top: 1px solid var(--line); background: var(--sub); box-sizing: border-box">
              <button class="btn" onClick="{{back}}" disabled="{{atStart}}">Back</button>
              <div style="display: flex; gap: 8px">
                <sc-if value="{{showNext}}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary" onClick="{{next}}" disabled="{{nextDisabled}}">Continue</button></sc-if>
                <sc-if value="{{showSubmit}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{submit}}">Submit DAR</button></sc-if>
                <sc-if value="{{showApprove}}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{approve}}">Approve as {{tierApprover}}</button></sc-if>
                <sc-if value="{{showReset}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{reset}}">Lodge another dispute</button></sc-if>
              </div>
            </div>
          </section>

          <aside class="r-col" style="flex: 1 1 400px; max-width: 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

                    <div style="display: flex; flex-direction: column">

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { step: 1, charge: 'c3', reason: null, pct: 100, gm: 2500, submitted: false, approved: false, settle: 'credit' };
  }
  renderVals() {
    const s = this.state;
    const money = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const charges = [
      { id: 'c1', type: 'Demurrage', bl: 'BL-SG-24002', detail: 'SGSIN → AEJEA · 4 days beyond free time', amt: 380, paid: false },
      { id: 'c2', type: 'Detention', bl: 'BL-CN-24003', detail: 'CNSHA → SGSIN · 6 days beyond free time', amt: 1800, paid: true },
      { id: 'c3', type: 'Demurrage', bl: 'BL-SG-24004', detail: 'SGSIN → MYPKG · Strategic VIP shipper · 12 days', amt: 4200, paid: false }
    ];
    const sel = charges.find((c) => c.id === s.charge);
    const reasonDefs = [
      { k: 'blank', label: 'Vessel blank sailing', group: 'Carrier delay', carrier: true },
      { k: 'rolled', label: 'Rolled container', group: 'Carrier delay', carrier: true },
      { k: 'cong', label: 'Port terminal congestion', group: 'Free-time dispute', carrier: false },
      { k: 'hol', label: 'Port holiday', group: 'Free-time dispute', carrier: false }
    ];
    const rsel = reasonDefs.find((r) => r.k === s.reason);
    const waiver = Math.round(sel.amt * s.pct) / 100;
    const tierIdx = waiver < 500 ? 0 : (waiver < 2500 ? 1 : 2);
    const tierDefs = [
      { tier: 'Tier 1', role: 'Agency Ops', limit: '< USD 500' },
      { tier: 'Tier 2', role: 'Trade Desk', limit: '< USD 2,500' },
      { tier: 'Tier 3', role: 'Commercial Director', limit: '> USD 2,500' }
    ];
    const auto = rsel && rsel.carrier;
    const approver = tierDefs[tierIdx].role;
    const stepLabels = ['Charge', 'Reason', 'Waiver', 'Review'];
    const done = s.approved || (s.submitted && auto);
    const tl = [
      { label: 'DAR lodged', sub: 'Dispute registered against ' + sel.bl, on: true },
      { label: auto ? 'Automated carrier-fault waiver' : 'Approval — ' + tierDefs[tierIdx].tier + ' · ' + approver, sub: auto ? 'No manual approval required' : (s.approved ? 'Approved · MFA verified' : 'Awaiting approval · MFA required'), on: auto || s.approved },
      { label: (sel.paid && s.settle === 'refund') ? 'Refund initiated' : 'Credit note triggered', sub: 'USD ' + money(waiver) + (sel.paid && s.settle === 'credit' ? ' · credit on customer account' : ''), on: done },
      { label: 'Subledger reversal posted', sub: 'Oracle Cloud GFS', on: done }
    ];
    return {
      steps: stepLabels.map((label, i) => {
        const n = i + 1, cur = s.step === n, past = s.step > n;
        return { n, label, current: cur ? 'step' : 'false', locked: n > s.step || s.submitted,
          line: cur ? 'var(--accent)' : 'transparent', fg: cur || past ? 'var(--ink)' : 'var(--muted)',
          dotBg: cur ? 'var(--accent)' : (past ? 'var(--ok)' : 'var(--neutral)'), dotFg: cur || past ? 'var(--onaccent)' : 'var(--muted)',
          go: () => { if (n <= s.step && !s.submitted) this.setState({ step: n }); } };
      }),
      s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: s.step === 4,

                <p style="margin: 0; color: var(--muted); font-size: 14px">{{confText}}<br>No approval workflow applies to invoice generation.</p>

                <div style="align-self: stretch; text-align: start; display: flex; flex-direction: column; gap: 8px"><span style="color: var(--muted); font-size: 14px">Where applicable:</span>
                  <ul><li>The invoice will be submitted for e-invoice processing.</li><li>The invoice will be sent to configured customer channels.</li><li>The invoice will be posted to GFS.</li></ul></div>
              </div>
              <div class="df" style="justify-content: center; background: var(--surface); border: 0; padding-bottom: 28px"><button class="btn" onClick="{{closeDlg}}">Back</button><button class="btn btn-primary" onClick="{{doGenerate}}">Generate</button></div>
            </sc-if>

                <sc-if value="{{dPrf}}" hint-placeholder-val="{{ false }}">

                <sc-if value="{{dGen}}" hint-placeholder-val="{{ false }}">

                    <sc-if value="{{x.isText}}" hint-placeholder-val="{{ false }}"><textarea class="input" style="height: 72px; padding-top: 8px; resize: vertical" value="{{x.val}}" onInput="{{x.on}}"></textarea></sc-if>

          </div>
        </sc-if>
      </main>
    </div>

</div>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:28px;padding:0 12px;border-radius:4px;font-size:12px;font-weight:500}</style>
</helmet>

          </div>
          <div style="position: relative">
            <label for="gent" class="sr">Entity</label>

              <option value="MELL">MELL</option>

            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>

            </button>

                <div class="k" style="padding: 6px 10px 4px">Switch login · LMS IAM</div>
                <sc-for list="{{shell.logins}}" as="g" hint-placeholder-count="2">
                  <button role="menuitemradio" aria-checked="{{g.on}}" onClick="{{g.pick}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 10px; border-radius: 6px">
                    <span style="display: flex; flex-direction: column; line-height: 16px"><span style="font-weight: 500">{{g.label}}</span><span style="font-size: 11px; color: var(--muted)">{{g.role}}</span></span>
                    <span style="color: var(--accent); font-weight: 700">{{g.mark}}</span>
                  </button>
                </sc-for>
                <div style="height: 1px; background: var(--line2); margin: 6px 0"></div>
                <div style="padding: 4px 10px; font-size: 12px; line-height: 18px; color: var(--muted)">Single sign-on · MFA for financial approvals<br>Session timeout: [n] min, then automatic logout</div>
                <div style="height: 1px; background: var(--line2); margin: 6px 0"></div>
                <button role="menuitem" onClick="{{shell.signOut}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center">Sign out</button>
              </div>
            </sc-if>
          </div>
        </div>
        <div style="min-height: 56px; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box">
          <div style="min-width: 0">
            <h1 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 22px">Reconciliation</h1>
            <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted)">Backend reconciliation of invoices and receipts across LMS, GIRS, GFS and third-party platforms · backfeed between GFS, GIRS and LMS</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <span class="chip" style="background: var(--warnbg); color: var(--warn); height: 32px; border-radius: 6px">Sample counts</span>
          <label for="rd" style="font-size: 12px; font-weight: 600; color: var(--muted)">Run date</label>
          <input id="rd" class="input mono" type="date" value="{{date}}" onChange="{{setDate}}" style="width: 160px">
          <div style="position: relative">
            <label for="gexp" class="sr">Export</label>
            <select id="gexp" class="select" value="" onChange="{{shell.exp}}" style="width: 112px">
              <option value="">Export</option>
              <option value="xlsx">Excel</option>
              <option value="csv">CSV</option>
              <option value="pdf">PDF</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset-inline-end: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <button class="btn btn-primary" onClick="{{run}}">Run reconciliation</button>
          </div>
        </div>
      </div>
      <main style="flex: 1 0 auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--tint); border: 1px solid var(--tintbd); color: var(--accent2); box-sizing: border-box">{{notice}}<button class="btn btn-sm" onClick="{{closeNotice}}">Close</button></div>
        </sc-if>
        <section class="card" style="overflow: hidden">
          <div class="card-head">
            <h2 class="card-title">Document counts by system · {{kindLabel}}</h2>
            <div role="radiogroup" aria-label="Document kind" style="display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--neutral)">
              <button class="seg" role="radio" aria-checked="{{invOn}}" onClick="{{pickInv}}" style="background: {{invBg}}">Invoices &amp; credit notes</button>
              <button class="seg" role="radio" aria-checked="{{rcpOn}}" onClick="{{pickRcp}}" style="background: {{rcpBg}}">Receipts</button>
            </div>
          </div>
          <table>
            <thead><tr><th>Location</th><sc-for list="{{cols}}" as="c" hint-placeholder-count="4"><th class="r">{{c}}</th></sc-for><th class="r">Matched</th><th class="r">Mismatches</th><th>Result</th></tr></thead>
            <tbody>
              <sc-for list="{{sum}}" as="r" hint-placeholder-count="6">
                <tr><td>{{r.loc}}</td><sc-for list="{{r.vals}}" as="v" hint-placeholder-count="4"><td class="mono r">{{v}}</td></sc-for><td class="mono r">{{r.match}}</td><td class="mono r" style="color: {{r.mmColor}}">{{r.mm}}</td><td><span class="chip" style="{{r.chip}}">{{r.res}}</span></td></tr>
              </sc-for>
            </tbody>
          </table>
        </section>
        <section class="card" style="flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column">
          <div class="card-head"><h2 class="card-title">Mismatches</h2><span class="card-meta">{{mmCount}} open</span></div>
          <div style="flex: 1 1 auto; overflow: auto">
            <table>
              <thead><tr><th>Document</th><th>Location</th><th>LMS</th><th>GIRS</th><th>GFS</th><th>Third-party</th><th>Difference</th><th>Action</th></tr></thead>
              <tbody>
                <sc-for list="{{mms}}" as="m" hint-placeholder-count="6">
                  <tr><td class="mono" style="font-weight: 500">{{m.doc}}</td><td class="mono">{{m.loc}}</td><td>{{m.lms}}</td><td>{{m.girs}}</td><td style="color: {{m.gfsColor}}">{{m.gfs}}</td><td>{{m.tp}}</td><td>{{m.diff}}</td>
                    <td><sc-if value="{{m.open}}" hint-placeholder-val="{{ true }}"><button class="btn btn-sm" onClick="{{m.fix}}">{{m.action}}</button></sc-if><sc-if value="{{m.done}}" hint-placeholder-val="{{ false }}"><span class="chip" style="background: var(--okbg); color: var(--ok)">Re-sent</span></sc-if></td></tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <sc-if value="{{shell.hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 520px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box">{{shell.toast}}<button class="btn btn-sm" onClick="{{shell.closeToast}}">Close</button></div>
  </sc-if>
</div>
</script>
<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { kind: 'inv', date: '2026-11-09', fixed: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const inv = s.kind === 'inv';
    const LOC = [['SIN', 412, 0], ['NSA', 268, 2], ['LCH', 133, 1], ['PKG', 151, 0], ['JED', 97, 1], ['ZLO', 84, 0]];
    const RLOC = [['SIN', 356, 1], ['NSA', 214, 0], ['LCH', 120, 0], ['PKG', 139, 1], ['JED', 88, 0], ['ZLO', 71, 0]];
    const MM0 = inv ? [
      ['m1', 'NSAOF2601058', 'NSA', 'Invoiced', 'Issued', 'Not posted', 'Not applicable', 'Missing in GFS', 'Re-send to GFS'],
      ['m2', 'NSAOD2600214CR', 'NSA', 'Credited', 'Issued', 'Posted', 'Not uploaded', 'Missing on PocketApp', 'Re-upload'],
      ['m3', 'LCHOF2600318', 'LCH', 'Not updated', 'Issued', 'Posted', 'Uploaded', 'Status not flowed back to LMS', 'Re-send status to LMS'],
      ['m4', 'JEDOF2600730', 'JED', 'Invoiced', 'Issued', 'Posted · amount differs', 'Not applicable', 'Amount differs (sample)', 'Investigate']
    ] : [
      ['r1', 'P-0004', 'SIN', 'Paid', 'Receipted', 'Not posted', 'ODeX · paid', 'Missing in GFS', 'Re-send to GFS'],
      ['r2', 'P-0009', 'PKG', 'Unpaid', 'Receipted', 'Posted', 'Not applicable', 'Payment status not in LMS', 'Re-send status to LMS']
    ];
    const MM = MM0.map(([id, doc, loc, lms, girs, gfs, tp, diff, action]) => ({ id, doc, loc, lms, girs, gfs, tp, diff, action, done: !!s.fixed[id], open: !s.fixed[id],
      gfsColor: gfs.indexOf('Not') === 0 || gfs.indexOf('differs') > 0 ? 'var(--bad)' : 'var(--ink)',
      fix: () => this.setState({ fixed: { ...s.fixed, [id]: true }, notice: doc + ': ' + action.toLowerCase() + ' — queued.' }) }));
    const openByLoc = (l) => MM.filter((m) => m.loc === l && m.open).length;
    const sum = (inv ? LOC : RLOC).map(([loc, n]) => { const mm = openByLoc(loc); return { loc, vals: inv ? [n, n, n - mm, n - mm] : [n, n, n - mm, n], match: n - mm, mm, mmColor: mm ? 'var(--bad)' : 'var(--muted)',
      res: mm ? 'Mismatch' : 'Reconciled', chip: mm ? 'background:var(--badbg);color:var(--bad)' : 'background:var(--okbg);color:var(--ok)' }; });
    const bg = (on) => on ? 'var(--surface)' : 'transparent';
    return {
      date: s.date, setDate: (e) => this.setState({ date: e.target.value }), kindLabel: inv ? 'invoices & credit notes' : 'receipts',
      invOn: inv ? 'true' : 'false', rcpOn: inv ? 'false' : 'true', invBg: bg(inv), rcpBg: bg(!inv),
      pickInv: () => this.setState({ kind: 'inv' }), pickRcp: () => this.setState({ kind: 'rcp' }),
      cols: ['LMS', 'GIRS', 'GFS', 'Third-party'], sum, mms: MM, mmCount: MM.filter((m) => m.open).length,
      run: () => this.setState({ notice: 'Reconciliation run for ' + s.date + ' complete. Counts are sample data.' }),
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' })
    };
  }
}

class Component extends GirsPage {
  constructor(p) {
    super(p);
    let sb = false, th = 'light', hub = 'SIN', ent = 'PIL';
    try { sb = localStorage.getItem('girs.sb') === '1'; th = localStorage.getItem('girs.th') || 'light'; hub = localStorage.getItem('girs.hub') || 'SIN'; ent = localStorage.getItem('girs.ent') || 'PIL'; } catch (e) {}
    let lg = 0; try { lg = +(localStorage.getItem('girs.lg') || 0); } catch (e) {}
    this.state = Object.assign({}, this.state, { __sb: sb, __th: th, __hub: hub, __ent: ent, __q: '', __um: false, __lg: lg, __toast: '' });
  }
  renderVals() {
    const v = super.renderVals();
    const s = this.state;
    const save = (k, val) => { try { localStorage.setItem(k, val); } catch (e) {} };
    const L = Object.assign({}, {"g0": "Operations", "nMain": "Operations Cockpit", "nChargeProcessing": "Charge Processing", "nDDEngine": "D&D Engine", "nIntegrationMonitor": "Integration Monitor", "g1": "Invoicing", "nInvoicesHub": "Invoices Hub", "nManualInvoice": "Manual & MISC Invoice", "nInvoicePreviewer": "Invoice Previewer", "nCreditNotes": "Credit Notes", "nDARConsole": "DAR Console", "nEInvoiceExceptions": "E-invoice Exceptions", "g2": "Receivables", "nReceipting": "Receipting", "nCashAppWorkbench": "CashApp Workbench", "nToleranceCOREOR": "Tolerance & COREOR", "nSOADashboard": "SOA & Aging", "nCreditManagement": "Credit Management", "g3": "Control", "nApprovalsInbox": "Approvals Inbox", "nEnquiry": "Enquiry & Monitoring", "nReconciliation": "Reconciliation"}, v.navT || {});
    const c = s.__sb;
    return Object.assign({}, v, { shell: {
      theme: s.__th, dark: s.__th === 'dark',
      sbW: c ? '64px' : '240px', hide: c ? 'display:none' : '', item: c ? 'justify-content:center;padding-inline:0' : '',
      logo: c ? 'height:26px;width:30px;object-fit:cover;object-position:left center' : 'height:26px;width:auto',
      logoRow: c ? 'justify-content:center;padding:0' : 'padding:0 20px',
      sbLabel: c ? 'Expand side panel' : 'Collapse side panel', sbIcon: c ? 'M9 6l6 6-6 6' : 'M15 6l-6 6 6 6',
      toggleSb: () => { save('girs.sb', c ? '0' : '1'); this.setState({ __sb: !c }); },
      lightOn: s.__th === 'dark' ? 'false' : 'true', darkOn: s.__th === 'dark' ? 'true' : 'false',
      lightBg: s.__th === 'dark' ? 'transparent;color:var(--muted)' : 'var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)', darkBg: s.__th === 'dark' ? 'var(--tint);color:var(--accent2)' : 'transparent;color:var(--muted)',
      setLight: () => { save('girs.th', 'light'); this.setState({ __th: 'light' }); },
      setDark: () => { save('girs.th', 'dark'); this.setState({ __th: 'dark' }); },
      hub: s.__hub, setHub: (e) => { save('girs.hub', e.target.value); this.setState({ __hub: e.target.value }); },
      ent: s.__ent, setEnt: (e) => { save('girs.ent', e.target.value); this.setState({ __ent: e.target.value }); },
      q: s.__q, setQ: (e) => this.setState({ __q: e.target.value }), hasQ: !!s.__q, clearQ: () => this.setState({ __q: '' }),
      pending: 10, l: L,
      um: s.__um, toggleUm: () => this.setState({ __um: !s.__um }), closeUm: () => this.setState({ __um: false }),
      logins: [0, 1].map((i) => ({ label: '[Login ' + (i + 1) + ']', role: '[Role ' + (i + 1) + ']', on: s.__lg === i ? 'true' : 'false', mark: s.__lg === i ? '✓' : '',
        pick: () => { save('girs.lg', String(i)); this.setState({ __lg: i, __um: false, __toast: 'Switched to [Login ' + (i + 1) + '] · [Role ' + (i + 1) + ']. Screens and actions follow that role.' }); } })),
      curLogin: '[Login ' + (s.__lg + 1) + ']', curRole: '[Role ' + (s.__lg + 1) + ']',
      exp: (e) => { const v = e.target.value; if (!v) return; e.target.value = ''; this.setState({ __toast: 'Export to ' + ({ xlsx: 'Excel', csv: 'CSV', pdf: 'PDF' })[v] + ' prepared — current filters applied.' }); },
      hasToast: !!s.__toast, toast: s.__toast, closeToast: () => this.setState({ __toast: '' }),
      signOut: () => this.setState({ __um: false, __toast: 'Signed out of GIRS (prototype — no session is ended).' })
    } });
  }
}

</script>
<script src="runtime.js"></script>

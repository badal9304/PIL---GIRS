body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:20px}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;height:32px;padding-inline:12px;border-radius:6px;color:var(--muted2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-on,.nav-on:hover{background:var(--tint);color:var(--accent);font-weight:600}
.nav-item svg{flex:none}
.sbtoggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;height:36px;padding-inline:12px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.sbtoggle:hover{background:var(--hover);color:var(--ink)}
.sbtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 12px}
.btn-icon{width:36px;padding:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-primary:hover{background:var(--accenth);border-color:var(--accenth)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.select:focus-visible,.input:focus-visible,.seg:focus-visible,.opt:focus-visible,.tile:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.select{appearance:none;-webkit-appearance:none;height:36px;padding-block:0;padding-inline:12px 32px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;line-height:34px;cursor:pointer;box-sizing:border-box}
.select-sm{height:32px;line-height:30px;font-size:12px}
.select:hover,.input:hover{border-color:var(--bdh)}
.input{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
.input::placeholder{color:var(--muted4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:20px}
.card-meta{font-size:12px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:16px;margin-bottom:6px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;line-height:16px}
.r{text-align:end}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;height:36px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub);box-sizing:border-box}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap;text-align:start;box-sizing:border-box}
tbody tr:hover td{background:var(--hover2)}
th.r,td.r{text-align:end}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.gsearch{position:relative;flex:0 1 480px;min-width:220px}
.gsearch .input{width:100%;padding-inline:36px 12px;background:var(--sub)}
.grow{flex:1 1 auto}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 16px;border-radius:8px}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:30px;border-radius:4px;font-size:13px;color:var(--ink)}
.ro{display:flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--sub);color:var(--muted2);box-sizing:border-box}</style>

<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { inv: 'v1', full: false, sel: { v1: { l1: true } }, credit: {}, source: 'FCA approval', replace: true, unapplied: {}, stage: 'draft', route: 'matrix' };
  }
  renderVals() {
    const s = this.state;
    const m = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const INV = [
      { id: 'v1', no: 'SINOF2602401', type: 'Final', bl: 'BL-SG-24001', paid: false, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Ocean Freight', 1850], ['l2', 'Bunker / Environmental Surcharge', 320], ['l3', 'Terminal Handling (THC)', 305]] },
      { id: 'v2', no: 'SINOF2602405', type: 'Final', bl: 'BL-SG-24006', paid: true, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Ocean Freight', 3200], ['l2', 'Demurrage', 700]] },
      { id: 'v3', no: 'NSAOF2601044', type: 'Final', bl: 'BL-IN-24005', paid: false, roe: '1 USD = 83.2000 INR', ctry: 'IN', lines: [['l1', 'Ocean Freight', 980], ['l2', 'Documentation Fee', 220]] },
      { id: 'v5', no: 'SINOD2602150', type: 'Final', bl: 'BL-SG-24004', paid: false, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Demurrage', 4200]] },
      { id: 'v6', no: 'SINOF2602298', type: 'Final', bl: 'BL-SG-24009', paid: false, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Ocean Freight', 5200], ['l2', 'Terminal Handling (THC)', 920]] },
      { id: 'v7', no: 'SINOF2602281', type: 'Final', bl: 'BL-SG-24005', paid: true, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Ocean Freight', 62400]] },
      { id: 'v4', no: 'SINOF2600118PRF', type: 'Proforma', bl: 'BL-SG-24002', paid: false, roe: '1 USD = 1.3450 SGD', ctry: 'SG', lines: [['l1', 'Ocean Freight', 2100]] }
    ];
    const v = INV.find((x) => x.id === s.inv);
    const total = v.lines.reduce((a, l) => a + l[2], 0);
    const proforma = v.type === 'Proforma';
    const needsUnapply = v.paid && !s.unapplied[v.id];
    const locked = s.stage !== 'draft' || proforma || needsUnapply;
    const selMap = s.sel[v.id] || {};
    const crMap = s.credit[v.id] || {};
    const lines = v.lines.map(([id, code, amt]) => {
      const on = s.full || !!selMap[id];
      const credit = s.full ? amt : (on ? (crMap[id] !== undefined ? crMap[id] : amt) : 0);
      return { code, amt, amtText: m(amt), on, credit: credit.toFixed(2), val: credit,
        lock: locked || s.full, inputLock: locked || s.full || !on,
        toggle: () => this.setState({ sel: { ...s.sel, [v.id]: { ...selMap, [id]: !on } } }),
        setCredit: (e) => this.setState({ credit: { ...s.credit, [v.id]: { ...crMap, [id]: Math.max(0, Number(e.target.value) || 0) } } }) };
    });
    const over = lines.some((l) => l.val > l.amt + 0.001);
    const creditTotal = lines.reduce((a, l) => a + l.val, 0);
    const tierIdx = creditTotal <= 0 ? -1 : (creditTotal > 50000 ? 1 : 0);
    const tierDefs = [
      { role: 'Team lead', limit: 'Up to USD 50,000' },
      { role: 'Chief Commercial Officer (CCO)', limit: 'Above USD 50,000' }
    ];
    const approver = s.route === 'alt' ? 'alternative approver' : (tierIdx === 1 ? 'CCO' : 'team lead');
    const taxPortal = v.ctry === 'IN';
    const done = s.stage === 'approved';
    const cnNo = v.no.slice(0, 7) + String(311 + INV.indexOf(v)).padStart(5, '0') + 'CR';
    const wasPaid = v.paid;
    const replNo = v.no.slice(0, 7) + String(2501 + INV.indexOf(v) * 7).padStart(5, '0');
    const flow = [
      wasPaid ? { label: 'Payment unapplied', sub: s.unapplied[v.id] ? 'Done' : 'Required first', on: !!s.unapplied[v.id] } : null,
      { label: 'Request prepared', sub: '[User ID]', on: s.stage !== 'draft' },
      { label: 'Approver notified by email', sub: s.stage === 'draft' ? '—' : (s.route === 'alt' ? '[Alternative approver]' : (tierIdx === 1 ? 'CCO' : 'Team lead')), on: s.stage !== 'draft' },
      { label: 'Approval', sub: s.stage === 'pending' ? 'Pending · MFA required' : (done ? 'Approved · MFA verified' : 'Not started'), on: done },
      { label: 'Credit note issued', sub: done ? cnNo : '—', on: done },
      { label: 'Charge codes released for new invoice', sub: done ? 'Released' : '—', on: done },
      { label: 'Replacement invoice', sub: !s.replace ? 'Not required' : (done ? replNo : '—'), on: done && s.replace },
      wasPaid ? { label: 'Payment re-applied to replacement invoice', sub: done && s.replace ? replNo : '—', on: done && s.replace } : null,
      { label: 'Government tax portal', sub: !taxPortal ? 'Not required' : (done ? 'IRN: [64-char hash]' : '—'), on: done && taxPortal },
      { label: 'Posted to GFS', sub: done ? 'Posted' : '—', on: done }
    ].filter(Boolean);
    const stageMeta = { draft: ['Draft', 'background:var(--neutral);color:var(--muted)'], pending: ['Pending approval', 'background:var(--warnbg);color:var(--warn)'], approved: ['Approved', 'background:var(--okbg);color:var(--ok)'] };
    return {
      invoices: INV.map((x) => ({ ...x, totalText: m(x.lines.reduce((a, l) => a + l[2], 0)), on: x.id === s.inv ? 'true' : 'false',
        border: x.id === s.inv ? 'var(--accent)' : 'var(--line)', bg: x.id === s.inv ? 'var(--tint)' : 'var(--surface)',
        pay: x.type === 'Proforma' ? 'Proforma' : (x.paid && !s.unapplied[x.id] ? 'Paid' : 'Unpaid'),
        payStyle: x.paid && !s.unapplied[x.id] ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--neutral);color:var(--muted)',
        pick: () => this.setState({ inv: x.id, stage: 'draft', full: false }) })),
      isProforma: proforma, needsUnapply,
      unapply: () => this.setState({ unapplied: { ...s.unapplied, [v.id]: true } }),
      locked, source: s.source, setSource: (e) => this.setState({ source: e.target.value }),
      today: '05 Nov 2026', roe: v.roe,
      fullOn: s.full ? 'true' : 'false', partOn: s.full ? 'false' : 'true',
      fullBg: s.full ? 'var(--surface)' : 'transparent', partBg: s.full ? 'transparent' : 'var(--surface)',
      fullFw: s.full ? 600 : 500, partFw: s.full ? 500 : 600,
      pickFull: () => this.setState({ full: true }), pickPart: () => this.setState({ full: false }),
      replace: s.replace, toggleReplace: () => this.setState({ replace: !s.replace }),
      lines, overCredit: over, taxPortal, regime: 'GSTN e-Invoice (IRN)',
      origTotal: m(total), creditTotal: m(creditTotal),
      stageText: stageMeta[s.stage][0], stageChip: stageMeta[s.stage][1],
      showSubmit: s.stage === 'draft', cantSubmit: locked || over || creditTotal <= 0,
      submit: () => this.setState({ stage: 'pending' }),
      showApprove: s.stage === 'pending', approver,
      route: s.route, setRoute: (e) => this.setState({ route: e.target.value }), routeLocked: s.stage !== 'draft',
      approve: () => this.setState({ stage: 'approved' }),
      showReset: done, reset: () => this.setState({ stage: 'draft', full: false, sel: { ...s.sel, [v.id]: {} }, credit: { ...s.credit, [v.id]: {} } }),
      tiers: tierDefs.map((t, i) => ({ ...t, border: i === tierIdx ? 'var(--accent)' : 'var(--line)', bg: i === tierIdx ? 'var(--tint)' : 'var(--surface)' })),
      flow: flow.map((f) => ({ ...f, dot: f.on ? 'var(--okdot)' : 'var(--bd)', fg: f.on ? 'var(--ink)' : 'var(--muted)' }))
    };
  }
}

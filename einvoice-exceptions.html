<script type="text/x-dc" id="logic">
class GirsPage extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: 'all', sel: 'e1', st: {}, notice: '' };
  }
  renderVals() {
    const s = this.state;
    const D = [
      ['e1', 'NSAOF2601051', 'Invoice', 'India', 'GSTN e-Invoice', '[Customer C]', '[Error description from portal]', 'Customer state code', 'NSA billing', 2, 'failed'],
      ['e2', 'NSAOF2601058', 'Invoice', 'India', 'GSTN e-Invoice', '[Customer N]', '[Error description from portal]', 'HSN code', 'NSA billing', 1, 'failed'],
      ['e3', 'NSAOD2600214CR', 'Credit note', 'India', 'GSTN e-Invoice', '[Customer C]', '[Error description from portal]', 'Original invoice reference', 'NSA billing', 1, 'failed'],
      ['e4', 'ZLOOF2600402', 'Invoice', 'Mexico', 'CFDI', '[Customer Q]', '[Error description from portal]', 'Customer tax ID', 'ZLO billing', 3, 'failed'],
      ['e5', 'JEDOF2600730', 'Invoice', 'Saudi Arabia', '[Portal]', '[Customer R]', '[Error description from portal]', 'Customer legal name', 'JED billing', 1, 'corrected'],
      ['e6', 'PKGOF2600911', 'Invoice', 'Malaysia', '[Portal]', '[Customer H]', '[Error description from portal]', 'Customer postal details', 'PKG billing', 2, 'corrected'],
      ['e7', 'NSAOF2601033', 'Invoice', 'India', 'GSTN e-Invoice', '[Customer S]', '[Error description from portal]', 'Customer email address', 'NSA billing', 2, 'accepted'],
      ['e8', 'ZLOOF2600395', 'Invoice', 'Mexico', 'CFDI', '[Customer Q]', '[Error description from portal]', 'Customer city code', 'ZLO billing', 2, 'accepted'],
      ['e9', 'NSAID2600090', 'Invoice', 'India', 'GSTN e-Invoice', '[Customer T]', '[Error description from portal]', 'Customer telephone', 'NSA billing', 1, 'failed'],
      ['e10', 'JEDOF2600722', 'Invoice', 'Saudi Arabia', '[Portal]', '[Customer U]', '[Error description from portal]', 'Tax code mapping', 'JED billing', 1, 'accepted']
    ].map(([id, no, type, ctry, portal, cust, err, field, office, tries, st]) => ({ id, no, type, ctry, portal, cust, err, field, office, tries, st0: st }));
    const ST = { failed: ['Failed', 'background:var(--badbg);color:var(--bad)', 'var(--bad)'], corrected: ['Corrected · queued', 'background:var(--warnbg);color:var(--warn)', 'var(--warn)'],
      resub: ['Re-submitted', 'background:var(--tint);color:var(--accent2)', 'var(--accent2)'], accepted: ['Accepted', 'background:var(--okbg);color:var(--ok)', 'var(--ok)'] };
    const stOf = (d) => s.st[d.id] || d.st0;
    const T = [['failed', 'Failed · office notified'], ['corrected', 'Corrected · awaiting re-submit'], ['resub', 'Re-submitted'], ['accepted', 'Accepted after re-submit']];
    const tiles = T.map(([k, label]) => { const on = s.filter === k; return { label, value: D.filter((d) => stOf(d) === k).length, color: ST[k][2], on: on ? 'true' : 'false',
      border: on ? 'var(--accent)' : 'var(--line)', shadow: on ? '0 0 0 1px var(--accent)' : 'none', pick: () => this.setState({ filter: on ? 'all' : k }) }; });
    const selEdge = 'background:var(--tint);box-shadow:inset 3px 0 0 var(--accent);';
    const rows = D.filter((d) => s.filter === 'all' || stOf(d) === s.filter).map((d) => { const on = s.sel === d.id, k = stOf(d); return { ...d, tries: d.tries + (k === 'resub' ? 1 : 0), st: ST[k][0], chip: ST[k][1],
      edge: on ? selEdge : '', cell: on ? 'background:var(--tint);' : '', pick: () => this.setState({ sel: d.id }) }; });
    const d = D.find((x) => x.id === s.sel) || D[0];
    const k = stOf(d);
    const isIN = d.ctry === 'India';
    const refs = k === 'accepted' || k === 'resub' ? (isIN ? [{ k: 'IRN', v: k === 'accepted' ? '[64-char hash]' : 'Awaiting' }, { k: 'Signed QR code', v: k === 'accepted' ? 'Stored' : 'Awaiting' }] : [{ k: 'Validation reference', v: k === 'accepted' ? '[Reference]' : 'Awaiting' }])
      : [{ k: 'Validation reference', v: 'Not issued' }];
    const corr = D.filter((x) => stOf(x) === 'corrected');
    return {
      tiles, rows, rowCount: rows.length, empty: rows.length === 0, listTitle: s.filter === 'all' ? 'All e-invoice exceptions' : T.find((t) => t[0] === s.filter)[1],
      sel: { ...d, st: ST[k][0], chip: ST[k][1] }, refs,
      canCorrect: k === 'failed' || k === 'corrected',
      correct: () => this.setState({ st: { ...s.st, [d.id]: 'resub' }, notice: d.no + ' corrected and re-submitted to ' + d.portal + '.' }),
      corrCount: corr.length, noRetry: corr.length === 0,
      retryAll: () => { const st = { ...s.st }; corr.forEach((x) => { st[x.id] = 'resub'; }); this.setState({ st, notice: corr.length + ' corrected document(s) re-submitted automatically.' }); },
      rules: ['India', 'Mexico', 'Saudi Arabia', 'Malaysia'].map((c) => ({ c })),
      hasNotice: !!s.notice, notice: s.notice, closeNotice: () => this.setState({ notice: '' })
    };
  }
}
